<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial del alumno · Academia DG</title>
<link rel="stylesheet" href="tema-adg.css?v=2026-08-14a">
<style>
  /* Los colores los pone tema-adg.css. Estos son los de reserva. */
  :root{
    --bg:#EEF2F4; --panel:#FFFFFF; --linea:#DFE8EC; --line:#DFE8EC; --txt:#16262E;
    --sec:#5A6E7A; --azul:#1080A5; --azul-d:#0C6A8A; --verde:#2F9E62; --rojo:#E0483D; --ambar:#D9982B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:var(--sans);font-size:15px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 70px}
  body.conBarra .wrap{padding-bottom:96px}

  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:21px;margin:0}
  .sub{color:var(--sec);font-size:13px}
  .yo{color:var(--sec);font-size:12px;margin:6px 0 16px}
  .yo a{color:var(--azul);text-decoration:none;margin-left:10px}

  .buscador{position:relative;margin-bottom:16px}
  .buscador input{width:100%;background:var(--panel);border:1px solid var(--linea);
    border-radius:11px;color:var(--txt);padding:13px 14px;font-family:inherit;font-size:16px}
  #sug{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:20;background:var(--panel);
    border:1px solid var(--linea);border-radius:11px;overflow:hidden;max-height:280px;overflow-y:auto}
  #sug .s{padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--linea)}
  #sug .s:last-child{border-bottom:0}
  #sug .s:hover,#sug .s:active{background:#E7F1F7}
  #sug .s small{display:block;font-size:11.5px;color:var(--sec)}

  .ficha{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
    padding:13px 15px;margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .ficha .nom{font-size:17px;font-weight:600}
  .ficha .dato{font-size:12.5px;color:var(--sec)}
  .ficha .dato b{color:var(--txt);font-weight:600}

  .totales{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .tot{background:var(--panel);border:1px solid var(--linea);border-radius:11px;padding:8px 13px;font-size:12.5px}
  .tot b{display:block;font-size:18px;font-weight:600;line-height:1.3}
  .tot.cobra b{color:var(--verde)}
  .tot.nocobra b{color:var(--sec)}
  .tot.revisar b{color:var(--ambar)}

  .clase{background:var(--panel);border:1px solid var(--linea);border-radius:11px;
    padding:10px 13px;margin-bottom:7px;display:flex;gap:12px;align-items:center}
  .clase.sinconf{border-color:#E8CE8A}
  .clase .info{flex:1;min-width:0}
  .clase .l1{font-size:14px;font-weight:500}
  .clase .l2{font-size:12.5px;color:var(--sec)}
  .cobro{font-size:11.5px;padding:3px 10px;border-radius:20px;white-space:nowrap;font-weight:600}
  .cobro.si{background:#E6F5EC;color:var(--verde)}
  .cobro.no{background:#EDF1F3;color:var(--sec)}
  button.b{font-family:inherit;font-size:12.5px;padding:6px 12px;border-radius:9px;
    border:1px solid var(--linea);background:transparent;color:var(--txt);cursor:pointer;white-space:nowrap}
  button.b:hover{border-color:var(--sec)}
  button.b.pri{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
  button.b.gr{font-size:14px;padding:11px 18px}

  .mes{font-size:12px;font-weight:700;color:var(--sec);letter-spacing:.4px;
    margin:18px 0 7px;text-transform:uppercase}
  .filtros{background:#fff;border:1px solid var(--line,var(--linea));border-radius:12px;
    padding:11px 13px;margin-bottom:14px}
  .ftit{font-size:11px;font-weight:700;color:var(--sec);letter-spacing:.4px;
    text-transform:uppercase;margin-bottom:8px}
  .fchips{display:flex;gap:6px;flex-wrap:wrap}
  .fchips button{font-family:inherit;font-size:12.5px;padding:6px 11px;border-radius:20px;
    border:1px solid var(--linea);background:#fff;color:var(--txt);cursor:pointer}
  .fchips button:hover{border-color:var(--sec)}
  .fchips button.on{border-color:var(--azul-d);background:#e3f1f6;color:var(--azul-d);font-weight:700}
  .fchips button b{opacity:.6;font-weight:600;margin-left:3px}
  .fnota{font-size:11.5px;color:var(--sec);margin-top:8px}
  .quien{font-weight:700;font-size:13.5px;margin-bottom:1px}
  .vacio{color:var(--sec);text-align:center;padding:40px 10px;font-size:14px}
  #cargando{color:var(--sec);text-align:center;padding:36px 0}

  #ov,#ovRech{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;
    align-items:center;justify-content:center;padding:16px}
  #ov.show,#ovRech.show{display:flex}
  .caja{background:var(--panel);border:1px solid var(--linea);border-radius:14px;
    padding:18px 16px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
  .caja h3{margin:0 0 3px;font-size:17px}
  .caja .donde{color:var(--sec);font-size:13px;margin-bottom:15px}
  .ops{display:flex;flex-direction:column;gap:7px}
  .ops button{font-family:inherit;font-size:14px;padding:12px 14px;border-radius:10px;
    border:1px solid var(--linea);background:transparent;color:var(--txt);cursor:pointer;text-align:left}
  .ops button.on{border-color:var(--azul);background:#E7F1F7;color:var(--azul);font-weight:600}
  .ops button small{display:block;font-size:11.5px;color:var(--sec);font-weight:400}
  .campo{margin-top:13px}
  .campo label{display:block;font-size:12.5px;color:var(--sec);margin-bottom:5px}
  .campo input{width:100%;background:var(--bg);border:1px solid var(--linea);border-radius:9px;
    color:var(--txt);padding:11px;font-family:inherit;font-size:15px}
  .err{color:var(--rojo);font-size:13px;margin-top:9px;min-height:17px}
  .acc{display:flex;gap:8px;margin-top:14px}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;
    background:var(--verde);color:#FFFFFF;padding:11px 18px;border-radius:12px;font-size:14px;display:none}

  /* ---- Clases para aprobar ---- */
  #aprobar{margin-bottom:18px}
  .apTit{font-size:13px;font-weight:700;color:var(--ambar);letter-spacing:.3px;
    text-transform:uppercase;margin:0 0 9px;display:flex;align-items:center;gap:8px}
  .apFila{background:var(--panel);border:1px solid #E8CE8A;border-radius:11px;
    padding:11px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .apFila .info{flex:1;min-width:190px}
  .apFila .l1{font-size:14.5px;font-weight:600}
  .apFila .l2{font-size:12.5px;color:var(--sec)}
  .apFila .l3{font-size:12px;color:var(--sec);margin-top:3px}
  .apFila .nota{font-size:12.5px;color:var(--txt);margin-top:4px;
    border-left:2px solid var(--linea);padding-left:8px}
  .apFila.choca{border-color:var(--rojo)}
  .apFila .choque{font-size:12.5px;color:var(--rojo);margin-top:6px;
    border-left:2px solid var(--rojo);padding-left:8px}
  .apAcc{display:flex;gap:7px}
  .apAcc button{white-space:nowrap}
  .apAcc .no{border-color:#F3C9C4;color:var(--rojo)}
  .apAcc .si{background:var(--verde);border-color:var(--verde);color:#FFFFFF;font-weight:700}
  .marca{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;
    background:#FFF6E0;color:#8A6A16;border:1px solid #E8CE8A}
  .apVacio{color:var(--sec);font-size:13px}

  #login,#nopuede{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;
    align-items:center;justify-content:center;flex-direction:column;padding:26px;text-align:center}
  #login h2,#nopuede h2{margin:0 0 8px;font-size:20px}
  #login p,#nopuede p{color:var(--sec);max-width:340px;margin:0 0 22px}

  /* ---- Las dos vistas ---- */
  .solapas{display:flex;gap:6px;margin-bottom:16px;background:var(--panel);
    border:1px solid var(--linea);border-radius:12px;padding:5px}
  .solapas button{flex:1;font-family:inherit;font-size:14px;padding:10px 12px;border-radius:9px;
    border:0;background:transparent;color:var(--sec);cursor:pointer;font-weight:600}
  .solapas button.on{background:var(--azul);color:#fff}
  .solapas button small{display:block;font-size:11px;font-weight:400;opacity:.8}

  /* ---- El día ---- */
  .barraDia{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .barraDia input[type=date]{background:var(--panel);border:1px solid var(--linea);border-radius:10px;
    color:var(--txt);padding:9px 11px;font-family:inherit;font-size:15px}
  .barraDia .flecha{padding:9px 13px}
  .diaTit{font-size:17px;font-weight:600;flex:1;min-width:130px}

  /* El cartel de estado: dice de una si el día está guardado o no, porque de
     eso depende que a alguien se le cobre o no se le cobre. */
  .estadoDia{border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13.5px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .estadoDia .txt{flex:1;min-width:180px}
  .estadoDia b{font-weight:700}
  .estadoDia small{display:block;font-size:12px;opacity:.85;margin-top:2px}
  .estadoDia.abierto{background:#FFF6E0;border:1px solid #E8CE8A;color:#8A6A16}
  .estadoDia.guardado{background:#E6F5EC;border:1px solid #A8DBBE;color:#1F6B43}
  .estadoDia.auto{background:#EDF1F3;border:1px solid var(--linea);color:var(--sec)}

  .hora{display:flex;align-items:baseline;gap:9px;margin:18px 0 8px}
  .hora .h{font-size:15px;font-weight:700}
  .hora .cuantos{font-size:12px;color:var(--sec)}
  .hora .raya{flex:1;height:1px;background:var(--linea)}

  /* Una clase del día. Toda la fila es tocable: en el celular apuntarle a un
     botón chico con el dedo, sesenta veces, no es forma de trabajar. */
  .cl{background:var(--panel);border:1px solid var(--linea);border-radius:11px;
    padding:10px 13px;margin-bottom:6px;display:flex;gap:11px;align-items:center;cursor:pointer}
  .cl:hover{border-color:var(--sec)}
  .cl.tocada{border-color:var(--azul);background:#F4FAFC}
  .cl .nom{font-size:14.5px;font-weight:600}
  .cl .det{font-size:12.5px;color:var(--sec)}
  .cl .der{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .cl .info{flex:1;min-width:0}
  .cl .est{font-size:12.5px}
  .cl.sintipo{border-left:3px solid var(--ambar)}
  .cl .cambiada{font-size:11px;color:var(--azul);font-weight:600}

  /* La barra de guardar va CLAVADA abajo de la pantalla, no al final de la
     lista: con sesenta y cinco clases la página mide seis mil píxeles y un
     botón allá abajo no lo encuentra nadie. */
  .guardarBarra{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--panel);border-top:1px solid var(--linea);padding:10px 14px;
    box-shadow:0 -3px 14px rgba(0,0,0,.10)}
  .guardarBarra .dentro{max-width:820px;margin:0 auto;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .guardarBarra .cuenta{flex:1;min-width:150px;font-size:13px;color:var(--sec)}
  .guardarBarra .cuenta b{color:var(--txt)}
  .avisos{background:#FFF6E0;border:1px solid #E8CE8A;color:#8A6A16;border-radius:11px;
    padding:10px 13px;margin-bottom:13px;font-size:12.5px}
  .avisos b{display:block;margin-bottom:4px}

</style>
</head>

var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];

var $ = function(id){ return document.getElementById(id); };
var miCorreo=null, historial=[], alumnos=[], elegido=null, editando=null, opElegida=null;
/* Qué días ya están cerrados en historial_v2, y por quién. Sirve para dos
   cosas: no sumar dos veces una fecha que también está en la planilla, y
   saber si una clase se corrige en el día (las nuevas) o en la planilla
   (las viejas). */
var diasCerrados={};

function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function aClave(m){ return String(m).trim().toLowerCase().replace(/\./g, ','); }
function normNom(s){
  return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/\s+/g,' ').trim();
}
function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block';
  clearTimeout(e._t); e._t=setTimeout(function(){ e.style.display='none'; }, 3200); }

function fechaLarga(iso){
  var d=new Date(iso+'T00:00:00');
  return DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
}
function mesDe(iso){
  var d=new Date(iso+'T00:00:00');
  return MESES[d.getMonth()]+' '+d.getFullYear();
}

/* ---------- Datos ---------- */
function parseCSV(txt){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<txt.length;i++){ var c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* ============================================================
   DE DÓNDE SALE EL HISTORIAL

   De dos lados, y hay que juntarlos:

   · historial_v2  — el de ahora. Un día por fecha, escrito por el cierre de
     las 23:30 o guardado a mano desde la solapa del día. Es el que Caja y
     Ganancias usan para cobrar y pagar.

   · historial_v1  — la copia de la planilla, que un script refrescaba cada 30
     minutos. Ahí está lo VIEJO: la planilla dejó de llenarse el 10/08/2026,
     cuando se sacó el cierre que la escribía.

   Si una fecha está en los dos, manda historial_v2: es donde se corrige hoy.
   ============================================================ */
function filaAClase(f){
  if(!f || !f.length) return null;
  var fecha=String(f[0]||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return null;
  var nom=String(f[1]||'').trim(); if(!nom) return null;
  return { fecha:fecha, alumno:nom, hora:String(f[2]||'').trim(), sede:String(f[3]||'').trim(),
           profe:String(f[4]||'').trim(), tipo:String(f[5]||'').trim(),
           estado:String(f[6]||'').trim(), cobro:String(f[7]||'').trim(),
           motivo:String(f[8]||'').trim(), id:String(f[9]||'').trim() };
}

function cargarHistorial(){
  return Promise.all([
    firebase.database().ref('historial_v2').once('value').then(function(s){ return s.val()||{}; })
      .catch(function(e){ console.warn('historial_v2:', e.message); return {}; }),
    firebase.database().ref('historial_v1/csv').once('value').then(function(s){ return s.val()||''; })
      .catch(function(e){ console.warn('historial_v1:', e.message); return ''; })
  ]).then(function(r){
    var v2=r[0], csv=r[1];
    historial=[];
    diasCerrados={};

    Object.keys(v2).forEach(function(fecha){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return;
      var d=v2[fecha]||{};
      diasCerrados[fecha]={ cuando:d.cerrado||'', por:d.por||'', aMano:!!d.aMano };
      (d.filas||[]).forEach(function(f){
        var c=filaAClase(f);
        if(c){ c.deDia=true; historial.push(c); }
      });
    });

    /* La planilla solo aporta las fechas que historial_v2 todavía no tiene. */
    var rows=parseCSV(csv);
    for(var i=1;i<rows.length;i++){
      var c=filaAClase(rows[i]);
      if(c && !diasCerrados[c.fecha]) historial.push(c);
    }

    historial.sort(function(a,b){ return a.fecha<b.fecha?1:(a.fecha>b.fecha?-1:0); });
  });
}

/* Migración a Firebase: la lista de alumnos sale de padron_v1 (canónico por
   ID: nombre, tel, cat). Si no estuviera, cae al espejo viejo alumnos_v1/csv,
   igual que profe-dia, profe-agenda, envíos, pausas y alto-rendimiento.
   Era el último HTML que leía SOLO la planilla. */
function cargarAlumnos(){
  return firebase.database().ref('padron_v1').once('value').then(function(s){
    var pv = s.val();
    if(!(pv && pv.alumnos && Object.keys(pv.alumnos).length)) return cargarAlumnosCSV();
    alumnos = [];
    Object.keys(pv.alumnos).forEach(function(id){
      var a = pv.alumnos[id];
      var nom = ((a && a.nombre) || '').trim(); if(!nom) return;
      alumnos.push({ nombre: nom,
                     id:  (((a && a.id)  || id) + '').trim(),
                     tel: (((a && a.tel) || '') + '').trim(),
                     cat: (((a && a.cat) || '') + '').trim() });
    });
    alumnos.sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  }).catch(function(e){
    console.warn('padron_v1:', e.message, '- queda la planilla');
    return cargarAlumnosCSV();
  });
}

function cargarAlumnosCSV(){
  return firebase.database().ref('alumnos_v1/csv').once('value').then(function(s){
    var csv=s.val(); if(!csv) return;
    var rows=parseCSV(csv); if(rows.length<2) return;
    var headRow=-1, iNom=-1, iId=-1, iTel=-1, iCat=-1;
    for(var r=0;r<Math.min(rows.length,12);r++){
      var h=rows[r].map(normNom);
      var n=h.findIndex(function(x){ return x==='alumnos'||x==='alumno'||x==='nombre'; });
      var d=h.findIndex(function(x){ return x==='id'||x==='id alumno'; });
      if(n>=0&&d>=0){
        headRow=r; iNom=n; iId=d;
        iTel=h.findIndex(function(x){ return x==='telefono'; });
        iCat=h.findIndex(function(x){ return x==='categoria'; });
        break;
      }
    }
    if(headRow<0) return;
    alumnos=[];
    for(var i=headRow+1;i<rows.length;i++){
      var nom=(rows[i][iNom]||'').trim(); if(!nom) continue;
      alumnos.push({nombre:nom, id:(rows[i][iId]||'').trim(),
        tel:iTel>=0?(rows[i][iTel]||'').trim():'', cat:iCat>=0?(rows[i][iCat]||'').trim():''});
    }
    alumnos.sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  }).catch(function(e){ console.warn('alumnos_v1:', e.message); });
}

/* ============================================================
   FILTROS POR ESTADO
   Los estados salen de los datos, no de una lista escrita a mano: si mañana
   aparece uno nuevo en el historial, el filtro lo muestra solo.

   Funcionan en los dos modos:
   · con un alumno elegido → filtran sus clases
   · sin alumno elegido    → muestran esas clases de TODOS los alumnos juntos,
                             que es lo que no se podía ver antes
   ============================================================ */
var fEstado='todos';

function contarEstados(lista){
  var c={};
  lista.forEach(function(x){
    var e=(x.estado||'—').trim() || '—';
    c[e]=(c[e]||0)+1;
  });
  return c;
}

function pintarFiltros(){
  var base = elegido ? clasesDe(elegido) : historial;
  var c = contarEstados(base);
  var claves = Object.keys(c).sort(function(a,b){ return c[b]-c[a]; });
  if(!claves.length){ $('filtros').style.display='none'; return; }
  $('filtros').style.display='block';

  var nAus=base.filter(function(x){ return /ausente/i.test(x.estado||''); }).length;
  var h='<button data-e="todos"'+(fEstado==='todos'?' class="on"':'')+'>Todos <b>'+base.length+'</b></button>';
  /* Atajo: todas las formas de ausencia juntas, que es lo que se mira siempre. */
  if(nAus) h+='<button data-e="__ausentes"'+(fEstado==='__ausentes'?' class="on"':'')+'>Solo ausentes <b>'+nAus+'</b></button>';
  claves.forEach(function(e){
    h+='<button data-e="'+esc(e)+'"'+(fEstado===e?' class="on"':'')+'>'+esc(e)+' <b>'+c[e]+'</b></button>';
  });
  $('fEstados').innerHTML=h;
  $('fEstados').querySelectorAll('button[data-e]').forEach(function(b){
    b.onclick=function(){ fEstado=b.dataset.e; verTodos=false; pintarDetalle(); };
  });

  $('fNota').textContent = elegido
    ? 'Estás viendo solo a '+elegido.nombre+'. Borrá el buscador para ver a todos los alumnos juntos.'
    : 'Estás viendo a todos los alumnos. Buscá uno arriba para ver solo el suyo.';
}

/* Las clases que hay que mostrar, según el alumno elegido y el estado. */
function clasesAMostrar(){
  var base = elegido ? clasesDe(elegido) : historial;
  if(fEstado==='todos') return base;
  if(fEstado==='__ausentes') return base.filter(function(x){ return /ausente/i.test(x.estado||''); });
  return base.filter(function(x){ return ((x.estado||'—').trim()||'—')===fEstado; });
}

/* ============================================================
   LA VISTA DEL DÍA

   QUÉ MUESTRA
   Las clases de un día tal como están AHORA, con lo que el profe marcó en la
   tablet, y al lado si esa clase se cobra o no. Administración lo revisa a la
   noche, corrige lo que haga falta y lo guarda. Eso guardado es lo que después
   usan Caja (para cobrarle al alumno) y Ganancias (para pagarle al profe).

   POR QUÉ NO SE CALCULA ACÁ
   La regla del cobro vive en el agente, en una sola función, y esta pantalla se
   la pregunta. Si la copiáramos acá habría dos reglas, y el día que se cambie
   una y no la otra un profe cobra de menos sin que nadie se entere.

   LOS TRES ESTADOS DE UN DÍA
   · SIN GUARDAR      todavía se puede revisar; a las 23:30 se guarda solo
   · GUARDADO SOLO    lo cerró el agente porque nadie entró a revisarlo
   · GUARDADO A MANO  alguien lo revisó; el automático ya no lo toca
   ============================================================ */

/* El agente. Misma dirección que usa cal-unif; cuando se mude de servidor se
   cambia en los dos con CAMBIAR-URL-DEL-AGENTE.cmd. */
const SERVIDOR_AGENTE = 'https://academiadg-agente-production.up.railway.app';

var dFecha = null;        // qué día se está mirando
var dDatos = null;        // lo que contestó el agente
var dFilas = [];          // las filas como quedaron en pantalla (con los cambios)
var dTocadas = {};        // qué filas cambió el usuario, por posición
var dEditando = -1;

/* Las diez columnas, por nombre, para no andar contando con los dedos. */
var C = { FECHA:0, ALUMNO:1, HORA:2, SEDE:3, PROFE:4, TIPO:5, ESTADO:6, COBRO:7, MOTIVO:8, ID:9 };

function isoDe(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function correrDia(iso, cuantos){
  var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+cuantos); return isoDe(d);
}
function tituloDia(iso){
  var d = new Date(iso+'T00:00:00');
  var DIASL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  return DIASL[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];
}
function horaDeReloj(txt){
  /* "21:07" del reloj de Asunción o de un ISO, para el cartel de estado. */
  try{
    var d = new Date(txt);
    if(isNaN(d)) return '';
    return d.toLocaleTimeString('es-PY', { hour:'2-digit', minute:'2-digit', hour12:false });
  }catch(e){ return ''; }
}

/* ---------- hablar con el agente ---------- */
/* Siempre con el token de quien está adentro: el agente vuelve a preguntarle a
   Google de quién es y si es administrador. Un token vencido da 401 y acá se
   pide de nuevo, en vez de dejar la pantalla en blanco sin explicación. */
function alAgente(camino, opciones){
  return firebase.auth().currentUser.getIdToken().then(function(tk){
    var o = opciones || {};
    return fetch(SERVIDOR_AGENTE + camino, {
      method: o.metodo || 'GET',
      headers: Object.assign({ 'Authorization':'Bearer '+tk },
                             o.cuerpo ? {'Content-Type':'application/json'} : {}),
      body: o.cuerpo ? JSON.stringify(o.cuerpo) : undefined
    });
  }).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(d){
      if(!r.ok || !d || d.ok === false){
        var m = (d && d.error) || ('el servidor contestó '+r.status);
        if(r.status === 401) m += ' — probá salir y volver a entrar';
        throw new Error(m);
      }
      return d;
    });
  });
}

/* ---------- cargar un día ---------- */
function verDia(iso){
  dFecha = iso;
  $('dFecha').value = iso;
  $('dTitulo').textContent = tituloDia(iso);
  $('dLista').innerHTML = ''; $('dGuardar').innerHTML = '';
  $('dEstado').innerHTML = ''; $('dAvisos').innerHTML = '';
  $('dCargando').style.display = 'block';
  dTocadas = {};

  alAgente('/dia-en-vivo?fecha='+encodeURIComponent(iso)).then(function(d){
    dDatos = d;
    /* Si el día ya está guardado, se muestra lo GUARDADO, que es lo que se
       cobra. Lo de ahora queda al costado solo para poder compararlo. */
    var base = (d.cerrado && d.guardadas && d.guardadas.length) ? d.guardadas : (d.filas || []);
    dFilas = base.map(function(f){ return f.slice(); });
    $('dCargando').style.display = 'none';
    pintarDia();
  }).catch(function(e){
    $('dCargando').style.display = 'none';
    $('dEstado').innerHTML = '<div class="estadoDia abierto"><div class="txt"><b>No pude traer el día.</b>'+
      '<small>'+esc(e.message)+'</small></div></div>';
  });
}

/* ---------- el cartel de estado ---------- */
function pintarEstadoDia(){
  var c = dDatos && dDatos.cerrado;
  var h;
  if(!c){
    h = '<div class="estadoDia abierto"><div class="txt"><b>Sin guardar.</b>'+
        '<small>Revisalo y guardalo. Si no, a las 23:30 se guarda solo con lo que haya.</small></div></div>';
  } else if(c.aMano){
    var vueltas = (c.correcciones || []).length;
    h = '<div class="estadoDia guardado"><div class="txt"><b>Guardado por '+esc(c.por)+'</b>'+
        '<small>'+esc(horaDeReloj(c.cuando))+' · '+c.filas+' clases'+
        (vueltas ? ' · corregido '+vueltas+(vueltas===1?' vez':' veces') : '')+
        '. El guardado automático ya no lo toca.</small></div></div>';
  } else {
    h = '<div class="estadoDia auto"><div class="txt"><b>Se guardó solo a las '+esc(horaDeReloj(c.cuando))+'.</b>'+
        '<small>'+c.filas+' clases. Nadie lo revisó. Si corregís algo y guardás, queda a tu nombre.</small></div></div>';
  }
  $('dEstado').innerHTML = h;

  /* Sin tipo de clase el alumno aporta cero a la bolsa y el profe cobra de
     menos: hay que verlo antes de guardar, no después. */
  var av = (dDatos && dDatos.avisos) || [];
  $('dAvisos').innerHTML = av.length
    ? '<div class="avisos"><b>⚠ '+av.length+' sin tipo de clase</b>'+
      esc(av.slice(0,6).join(' · '))+(av.length>6 ? ' … y '+(av.length-6)+' más' : '')+
      '<div style="margin-top:5px">Sin tipo, el alumno no suma a la bolsa de esa hora y el profe cobra de menos. Se arregla en la ficha del alumno.</div></div>'
    : '';
}

/* ---------- la lista del día ---------- */
function pintarDia(){
  pintarEstadoDia();

  if(!dFilas.length){
    $('dLista').innerHTML = '<div class="vacio">No hay clases ese día.</div>';
    $('dGuardar').innerHTML = '';
    document.body.classList.remove('conBarra');
    return;
  }

  /* Por hora, que es como se mira la cancha. Dentro de cada hora, por sede y
     profe, para que las de un mismo profe queden juntas. */
  var orden = dFilas.map(function(f,i){ return i; }).sort(function(a,b){
    var A = dFilas[a], B = dFilas[b];
    var ha = String(A[C.HORA]).padStart(5,'0'), hb = String(B[C.HORA]).padStart(5,'0');
    if(ha !== hb) return ha < hb ? -1 : 1;
    if(A[C.SEDE] !== B[C.SEDE]) return A[C.SEDE] < B[C.SEDE] ? -1 : 1;
    if(A[C.PROFE] !== B[C.PROFE]) return A[C.PROFE] < B[C.PROFE] ? -1 : 1;
    return String(A[C.ALUMNO]).localeCompare(String(B[C.ALUMNO]));
  });

  var cobra = dFilas.filter(function(f){ return f[C.COBRO] === 'Sí'; }).length;
  var noCobra = dFilas.filter(function(f){ return f[C.COBRO] === 'No'; }).length;
  var sinTipo = dFilas.filter(function(f){ return !String(f[C.TIPO]).trim(); }).length;

  var h = '<div class="totales">'+
    '<div class="tot"><b>'+dFilas.length+'</b>clases</div>'+
    '<div class="tot cobra"><b>'+cobra+'</b>se cobran</div>'+
    '<div class="tot nocobra"><b>'+noCobra+'</b>no se cobran</div>'+
    (sinTipo ? '<div class="tot revisar"><b>'+sinTipo+'</b>sin tipo</div>' : '')+
    '</div>';

  var horaAct = null, abierto = false;
  orden.forEach(function(i){
    var f = dFilas[i];
    if(f[C.HORA] !== horaAct){
      if(abierto) h += '';
      horaAct = f[C.HORA];
      var cuantos = dFilas.filter(function(x){ return x[C.HORA] === horaAct; }).length;
      h += '<div class="hora"><span class="h">'+esc(horaAct || 'sin hora')+'</span>'+
           '<span class="cuantos">'+cuantos+(cuantos===1?' clase':' clases')+'</span>'+
           '<span class="raya"></span></div>';
      abierto = true;
    }
    var si = f[C.COBRO] === 'Sí';
    var noAplica = f[C.COBRO] === '—';
    h += '<div class="cl'+(dTocadas[i]?' tocada':'')+(String(f[C.TIPO]).trim()?'':' sintipo')+'" data-i="'+i+'">'+
      '<div class="info">'+
        '<div class="nom">'+esc(f[C.ALUMNO])+'</div>'+
        '<div class="det">'+esc(f[C.SEDE])+(f[C.PROFE]?' · '+esc(f[C.PROFE]):'')+
          (f[C.TIPO]?' · '+esc(f[C.TIPO]):' · <b style="color:var(--ambar)">sin tipo</b>')+'</div>'+
        '<div class="est">'+esc(f[C.ESTADO])+
          (f[C.MOTIVO]?' <span style="color:var(--sec)">· '+esc(f[C.MOTIVO])+'</span>':'')+'</div>'+
      '</div>'+
      '<div class="der">'+
        '<span class="cobro '+(noAplica?'no':(si?'si':'no'))+'">'+
          (noAplica ? 'no aplica' : (si ? 'se cobra' : 'no se cobra'))+'</span>'+
        (dTocadas[i] ? '<span class="cambiada">cambiado</span>' : '')+
      '</div>'+
    '</div>';
  });

  $('dLista').innerHTML = h;
  $('dLista').querySelectorAll('.cl').forEach(function(el){
    el.onclick = function(){ abrirCambioDia(+el.dataset.i); };
  });

}

/* Los cambios quedan en pantalla hasta que se aprieta Guardar. Así se puede
   corregir varias de una y revisar antes de que toque la plata. */
function abrirCambioDia(i){
  dEditando = i;
  var f = dFilas[i];
  $('cNom').textContent = f[C.ALUMNO];
  $('cDonde').textContent = f[C.HORA]+' · '+f[C.SEDE]+(f[C.PROFE]?' · '+f[C.PROFE]:'')+
    ' — ahora: '+f[C.ESTADO]+(f[C.COBRO]==='Sí'?' (se cobra)':(f[C.COBRO]==='No'?' (no se cobra)':''));
  $('cMotivo').value = ''; $('cErr').textContent = '';
  opElegida = null;
  $('cOps').querySelectorAll('button').forEach(function(b){
    var mismo = b.dataset.e.split('|')[0] === f[C.ESTADO];
    b.classList.toggle('on', mismo);
    if(mismo) opElegida = b.dataset.e;
  });

function aplicarCambioDia(){
  if(dEditando < 0 || !opElegida){ $('cErr').textContent = 'Elegí qué pasó.'; return; }
  var motivo = $('cMotivo').value.trim();
  if(motivo.length < 3){ $('cErr').textContent = 'Escribí por qué lo cambiás. Dentro de tres meses lo vas a agradecer.'; return; }
  var p = opElegida.split('|'), f = dFilas[dEditando];
  f[C.ESTADO] = p[0];
  f[C.COBRO]  = p[1];
  f[C.MOTIVO] = motivo + ' · ' + miCorreo;
  dTocadas[dEditando] = true;
  cerrarCambio();
  pintarDia();
}

  }}).then(function(r){

/* ============================================================
   CORREGIR UNA CLASE DE UN DÍA YA CERRADO

   Las clases nuevas no viven en la planilla sino en historial_v2, así que el
   puente de Apps Script no las toca. Se corrigen por el mismo camino que la
   solapa del día: se trae el día entero, se cambia esa fila y se vuelve a
   guardar. La fila se busca por fecha + alumno + hora + sede, que es como se
   emparejaba siempre.
   ============================================================ */
function corregirClaseDelDia(c, estado, cobro, motivo){
  return alAgente('/dia-en-vivo?fecha='+encodeURIComponent(c.fecha)).then(function(d){
    var filas=(d.guardadas && d.guardadas.length) ? d.guardadas : (d.filas||[]);
    filas=filas.map(function(f){ return f.slice(); });
    var i=filas.findIndex(function(f){
      return normNom(f[1])===normNom(c.alumno) &&
             String(f[2]).trim()===String(c.hora).trim() &&
             String(f[3]).trim().toUpperCase()===String(c.sede).trim().toUpperCase();
    });
    if(i<0) throw new Error('esa clase ya no está en el día ' + c.fecha);
    filas[i][6]=estado; filas[i][7]=cobro; filas[i][8]=motivo+' · '+miCorreo;
    return alAgente('/guardar-dia', { metodo:'POST', cuerpo:{
      fecha:c.fecha, filas:filas, nota:'corregido desde el historial del alumno' } })
      .then(function(){ return filas[i]; });
  });
}

$('cGuardar').onclick=function(){
  /* El mismo recuadro sirve para las dos vistas. En la del día el cambio queda
     en pantalla hasta que se guarda el día entero. En la del alumno se guarda
     al toque, y va a historial_v2 o a la planilla según de dónde salió esa
     clase. */
  if($('ov').dataset.modo === 'dia'){ aplicarCambioDia(); return; }
  if(!editando || !opElegida){ $('cErr').textContent='Elegí qué pasó.'; return; }
  var motivo=$('cMotivo').value.trim();
  if(motivo.length<3){ $('cErr').textContent='Escribí por qué lo cambiás. Dentro de tres meses lo vas a agradecer.'; return; }
  var p=opElegida.split('|');
  var b=$('cGuardar'); b.disabled=true; b.textContent='Guardando…';

  if(editando.deDia){
    /* cerrarCambio() deja `editando` en null, asi que la clase se guarda acá
       antes de cerrar: si no, el aviso sale sin fecha. */
    var clase = editando;
    corregirClaseDelDia(clase, p[0], p[1], motivo).then(function(){
      clase.estado=p[0]; clase.cobro=p[1]; clase.motivo=motivo+' · '+miCorreo;
      cerrarCambio(); pintarDetalle();
      b.disabled=false; b.textContent='Guardar el cambio';
      toast('✅ Cambio guardado en el día ' + fechaLarga(clase.fecha));
    }).catch(function(e){
      b.disabled=false; b.textContent='Guardar el cambio';
      $('cErr').textContent='No se pudo guardar: '+e.message;
    });
    return;
  }

  firebase.auth().currentUser.getIdToken().then(function(tk){
    return enviarAlPuente('corregir', {cambios:[{
      fecha:editando.fecha, alumno:editando.alumno, hora:editando.hora, sede:editando.sede,
      estado:p[0], cobro:p[1], motivo:motivo
    }]}, tk);
  }).then(function(){
    /* La planilla ya se corrigió, pero la copia que leemos se refresca cada 30
       minutos. Se actualiza en pantalla para no dejar al usuario esperando. */
    editando.estado=p[0]; editando.cobro=p[1];
    editando.motivo=motivo+' · '+miCorreo;
    anotarEnHistorial(editando, p[0], p[1], motivo);
    cerrarCambio(); pintarDetalle();
    b.disabled=false; b.textContent='Guardar el cambio';
    toast('✅ Cambio guardado en la planilla');
  }).catch(function(e){
    b.disabled=false; b.textContent='Guardar el cambio';
    $('cErr').textContent='No se pudo guardar: '+e.message;
  });
};

/* El puente se llama con un formulario en un recuadro invisible: no se puede leer
   la respuesta. Por eso conviene verificar en la planilla si algo no cuadra. */
/* ============================================================
   EL PUENTE A LA PLANILLA, Y CÓMO SE ENTERA UNO CUANDO FALLA

   Ésta era la peor de las cuatro copias: ni siquiera escuchaba si el iframe
   cargaba. Mandaba el formulario, esperaba 2 segundos y medio y daba por hecho
   que había salido bien. Token vencido, permiso sacado, Apps Script caído: todo
   pasaba por bueno.

   Y acá pesa más que en otros lados, porque lo que viaja por este puente son
   correcciones de COBRO: marcar que una clase no se cobra. Si no llegan a la
   hoja, el alumno sigue apareciendo como cobrable.

   Ahora se intenta por fetch, que sí deja leer el {ok, error} que el puente ya
   venía contestando. Si el navegador lo bloquea por CORS se cae al formulario,
   pero esperando el onload y distinguiendo "contestó" de "se quedó mudo".
   ============================================================ */
/* El puente avisa por acá cuando la planilla no confirmó. Acá pesa más que en
   otros lados: lo que viaja son correcciones de COBRO. */
window.__avisoPuente=function(txt){ try{ toast('⚠️ '+txt); }catch(e){ console.warn(txt); } };

function avisoPuente(res, action){
  if(res && res.ok) return res;
  var txt = 'La planilla no confirmó el cambio' + (res && res.error ? ': ' + res.error : '') +
            '. El dato quedó guardado acá, pero la hoja puede estar desactualizada.';
  try{ if(typeof window.__avisoPuente === 'function'){ window.__avisoPuente(txt, res, action); return res; } }catch(e){}
  console.warn('puente (' + action + '): ' + txt);
  return res;
}

function enviarAlPuente(action, payload, idToken){
  var cuerpo = 'data=' + encodeURIComponent(JSON.stringify(Object.assign({action:action, idToken:idToken}, payload)));

  /* CAMINO 1 — fetch. El Content-Type de formulario es a propósito: es de los
     que el navegador manda sin preguntar antes (sin preflight), así que Apps
     Script lo recibe igual que al formulario de toda la vida. */
  return fetch(PUENTE_URL, {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
    body: cuerpo
  }).then(function(r){ return r.text(); }).then(function(t){
    var d=null; try{ d=JSON.parse(t); }catch(e){}
    if(d && typeof d.ok === 'boolean') return avisoPuente({ok:d.ok, via:'fetch', error:d.error||''}, action);
    return avisoPuente({ok:false, via:'fetch', error:'respuesta inesperada del puente'}, action);
  }).catch(function(e){
    console.warn('puente por fetch no salió (' + e.message + '), voy por el iframe');
    /* CAMINO 2 — el formulario, ahora esperando el onload de verdad. */
    return new Promise(function(res){
      var name='puente_'+Date.now();
      var ifr=document.createElement('iframe'); ifr.name=name; ifr.style.display='none';
      document.body.appendChild(ifr);
      var f=document.createElement('form');
      f.method='POST'; f.action=PUENTE_URL; f.target=name; f.style.display='none';
      var i=document.createElement('input');
      i.name='data'; i.value=JSON.stringify(Object.assign({action:action, idToken:idToken}, payload));
      f.appendChild(i); document.body.appendChild(f);
      var listo=false, fin=function(contesto){
        if(listo) return; listo=true;
        setTimeout(function(){ try{ f.remove(); ifr.remove(); }catch(e){} }, 300);
        res(contesto ? {ok:true, via:'iframe', error:''}
                     : avisoPuente({ok:false, via:'iframe', error:'no contestó en 8 segundos'}, action));
      };
      ifr.onload=function(){ fin(true); };
      setTimeout(function(){ fin(false); }, 8000);
      f.submit();
    });
  });
}

/* Todo cambio de cobro queda en el historial general: dentro de tres meses vas a
   querer saber por qué ese cobro no está. */
function anotarEnHistorial(c, estado, cobro, motivo){
  try{
    var hoy=new Date();
    var dia=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');
    firebase.database().ref('ops_v1/'+dia).push({
      tipo:'cobro', alumno:c.alumno,
      detalle:'clase del '+c.fecha+' '+c.hora+' '+c.sede+' → '+estado+
              ' · '+(cobro==='Sí'?'se cobra':'no se cobra')+' · '+motivo,
      porCorreo:miCorreo, porNombre:window._yoNombre||miCorreo, ts:Date.now()
    }).catch(function(){});
  }catch(e){}
}

/* ============================================================
   CLASES PARA APROBAR
   Los profes cargan desde el celular las clases que se olvidaron de marcar en
   la tablet. Quedan en atrasadas_v1 esperando. Acá se aprueban o se rechazan.

   Al aprobar, la clase se manda a HISTORIAL con la MISMA forma que usa el
   cierre del día: diez campos, la sede en mayúscula y la hora como texto. El
   puente tiene su propio control anti-duplicados por fecha + alumno + hora +
   sede, así que aprobar dos veces por error no cobra dos veces.

   Nada se borra nunca: una clase rechazada queda con su motivo.
   ============================================================ */
var SEDE_NICE = {lomas:'LOMAS', elite:'ELITE', segurola:'SEGUROLA', adefinir:'A DEFINIR'};
var atrasadas = {}, rechazando = null;

function idDelAlumno(nombre){
  var k=normNom(nombre);
  for(var i=0;i<alumnos.length;i++){ if(normNom(alumnos[i].nombre)===k) return alumnos[i].id||''; }
  return '';
}
function isoDeHoy(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* A los profesores se les paga por semana. Una clase de una semana anterior
   cambia un total que ya se pagó: no lo impide, pero lo avisa antes de tocar. */
function lunesDeEstaSemana(){
  var d=new Date(); var wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function haceCuanto(ts){
  if(!ts) return '';
  var m=Math.floor((Date.now()-ts)/60000);
  if(m<60) return 'hace '+m+' min';
  if(m<1440) return 'hace '+Math.floor(m/60)+' h';
  return 'hace '+Math.floor(m/1440)+' días';
}

function escucharAtrasadas(){
  firebase.database().ref('atrasadas_v1').on('value', function(s){
    atrasadas = s.val() || {};
    pintarAprobar();
  }, function(e){ console.warn('atrasadas_v1:', e.message); });
}

function pendientes(){
  return Object.keys(atrasadas).map(function(k){
    var a=atrasadas[k]||{}; a._k=k; return a;
  }).filter(function(a){ return a.estado==='pendiente'; })
    .sort(function(a,b){ return String(a.fecha).localeCompare(String(b.fecha)); });
}

function pintarAprobar(){
  var c=$('aprobar'); if(!c) return;
  var ps=pendientes();
  if(!ps.length){ c.innerHTML=''; return; }
  var lun=lunesDeEstaSemana();
  c.innerHTML='<div class="apTit">⏳ Clases para aprobar ('+ps.length+')</div>'+
    ps.map(function(a){
      var vieja = String(a.fecha) < lun;
      var sede  = SEDE_NICE[a.sede] || String(a.sede||'').toUpperCase();
      var ya    = filaYaExiste(a);
      return '<div class="apFila'+(ya?' choca':'')+'" data-k="'+esc(a._k)+'">'+
        '<div class="info">'+
          '<div class="l1">'+esc(a.alumno||'')+'</div>'+
          '<div class="l2">'+esc(fechaLarga(a.fecha))+' · '+esc(a.hora||'')+' · '+esc(sede)+
            ' · '+esc(a.profe||'')+' · '+esc(a.mod||'')+'</div>'+
          '<div class="l3">cargada por '+esc(a.porNombre||a.porCorreo||'')+' '+esc(haceCuanto(a.ts))+'</div>'+
          (a.nota?('<div class="nota">'+esc(a.nota)+'</div>'):'')+
          (ya?('<div class="choque">⚠ Esa clase <b>ya está en el historial</b> como <b>'+esc(ya.estado||'')+
               '</b> ('+(ya.cobro==='Sí'?'se cobra':'no se cobra')+'). Aprobarla acá puede no cambiar nada: '+
               'lo seguro es buscar al alumno abajo y corregir esa clase.</div>'):'')+
        '</div>'+
        (vieja?'<span class="marca">⚠ semana ya pagada</span>':'')+
        '<div class="apAcc">'+
          '<button class="b no" data-ac="no">Rechazar</button>'+
          '<button class="b si" data-ac="si">Aprobar</button>'+
        '</div></div>';
    }).join('');
}

/* ¿El cierre del día ya escribió una fila para esa misma clase?
   Pasa cuando el alumno SÍ estaba en el calendario y el profe solo no marcó la
   asistencia: a las 23:00 la fila se escribió igual, como "Sin confirmar". El
   puente empareja por fecha + alumno + hora + sede, así que aprobarla acá puede
   no cambiar nada. En ese caso el camino correcto es corregir la clase que ya
   está, no cargarla de nuevo. */
function filaYaExiste(a){
  var f=String(a.fecha), n=normNom(a.alumno||'');
  var h=normHoraTxt(a.hora||'');
  var sede=String(SEDE_NICE[a.sede]||a.sede||'').toUpperCase();
  for(var i=0;i<historial.length;i++){
    var x=historial[i];
    if(x.fecha!==f) continue;
    if(normNom(x.alumno)!==n) continue;
    if(normHoraTxt(x.hora)!==h) continue;
    if(String(x.sede||'').toUpperCase()!==sede) continue;
    return x;
  }
  return null;
}
function normHoraTxt(h){
  var t=String(h==null?'':h).trim();
  var m=t.match(/^(\d{1,2})\s*[:.]?\s*(\d{2})?$/);
  return m ? ((+m[1])+':'+(m[2]||'00')) : t;
}

$('aprobar').onclick=function(ev){
  var b=ev.target.closest('button[data-ac]'); if(!b) return;
  var fila=b.closest('.apFila'); if(!fila) return;
  var k=fila.dataset.k, a=atrasadas[k];
  if(!a) return;
  if(b.dataset.ac==='si') aprobarClase(k, a, b);
  else abrirRechazo(k, a);
};

function aprobarClase(k, a, boton){
  var vieja = String(a.fecha) < lunesDeEstaSemana();
  var sede  = SEDE_NICE[a.sede] || String(a.sede||'').toUpperCase();
  var txt = a.alumno+'\n'+fechaLarga(a.fecha)+' · '+(a.hora||'')+' · '+sede+' · '+(a.profe||'')+' · '+(a.mod||'')+
            '\n\nSe cobra al alumno y se le paga al profesor.'+
            (vieja?'\n\n⚠ Es de una semana que ya se pagó: el total de esa semana va a cambiar.':'');
  if(!confirm(txt)) return;

  boton.disabled=true; boton.textContent='…';
  /* Los diez campos del cierre del día, en el mismo orden. */
  var filaHist=[a.fecha, a.alumno, a.hora||'', sede, a.profe||'', a.mod||'',
                'Presente', 'Sí', 'cargada tarde por '+(a.porNombre||a.porCorreo||''),
                idDelAlumno(a.alumno)];

  firebase.auth().currentUser.getIdToken().then(function(tk){
    return enviarAlPuente('historial', {filas:[filaHist]}, tk);
  }).then(function(){
    /* Recién después de mandarla a la planilla se marca como aprobada. Si se
       marcara antes y el puente fallara, la clase quedaría perdida: nadie la
       vería más y nunca habría llegado. */
    return firebase.database().ref('atrasadas_v1/'+k).update({
      estado:'aprobado', resueltoTs:Date.now(), resueltoPor:miCorreo
    });
  }).then(function(){
    anotarAtrasadaEnOps(a, 'aprobó', sede, '');
    toast('✅ Aprobada y enviada a la planilla');
  }).catch(function(e){
    boton.disabled=false; boton.textContent='Aprobar';
    alert('No se pudo aprobar: '+e.message);
  });
}

function abrirRechazo(k, a){
  rechazando={k:k, a:a};
  var sede = SEDE_NICE[a.sede] || String(a.sede||'').toUpperCase();
  $('rDonde').textContent = a.alumno+' · '+fechaLarga(a.fecha)+' · '+(a.hora||'')+' · '+sede;
  $('rMotivo').value=''; $('rErr').textContent='';
  $('ovRech').classList.add('show');
  try{ $('rMotivo').focus(); }catch(e){}
}
$('rCancel').onclick=function(){ $('ovRech').classList.remove('show'); rechazando=null; };
$('rGuardar').onclick=function(){
  if(!rechazando) return;
  var motivo=$('rMotivo').value.trim();
  if(motivo.length<3){ $('rErr').textContent='Escribí por qué. El profe lo va a leer.'; return; }
  var b=$('rGuardar'); b.disabled=true; b.textContent='…';
  var k=rechazando.k, a=rechazando.a;
  firebase.database().ref('atrasadas_v1/'+k).update({
    estado:'rechazado', resueltoTs:Date.now(), resueltoPor:miCorreo,
    resueltoMotivo:motivo.slice(0,300)
  }).then(function(){
    anotarAtrasadaEnOps(a, 'rechazó', SEDE_NICE[a.sede]||a.sede, motivo);
    b.disabled=false; b.textContent='Rechazar';
    $('ovRech').classList.remove('show'); rechazando=null;
    toast('Rechazada. El profe la va a ver');
  }).catch(function(e){
    b.disabled=false; b.textContent='Rechazar';
    $('rErr').textContent='No se pudo: '+e.message;
  });
};

/* Todo queda en el historial general, con tu nombre. */
function anotarAtrasadaEnOps(a, que, sede, motivo){
  try{
    firebase.database().ref('ops_v1/'+isoDeHoy()).push({
      tipo:'atrasada', alumno:a.alumno||'',
      detalle:que+' la clase del '+a.fecha+' '+(a.hora||'')+' '+sede+' '+(a.profe||'')+
              ' · cargada por '+(a.porNombre||a.porCorreo||'')+(motivo?(' · '+motivo):''),
      porCorreo:miCorreo, porNombre:window._yoNombre||miCorreo, ts:Date.now()
    }).catch(function(){});
  }catch(e){}
}

/* ---------- Entrada ---------- */
$('btnEntrar').onclick=function(){
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(function(e){ $('errLogin').textContent=e.message; });
};
$('btnSalir').onclick=function(e){ e.preventDefault(); firebase.auth().signOut(); };
$('btnSalir2').onclick=function(){ firebase.auth().signOut(); };

/* Nada que lea Firebase corre antes del login. */
firebase.auth().onAuthStateChanged(function(u){
  if(!u){ $('login').style.display='flex'; $('nopuede').style.display='none'; $('app').style.display='none'; return; }
  miCorreo=u.email.toLowerCase();
  firebase.database().ref('usuarios/'+aClave(miCorreo)).once('value').then(function(s){
    var f=s.val()||{}, p=f.permisos||{};
    /* Esto toca plata: solo administradores. */
    if(f.activo!==true || p.admin!==true){
      $('login').style.display='none';
      $('nopuedeTxt').textContent=miCorreo+'\n\nEsta sección es solo para administradores.';
      $('nopuede').style.display='flex';
      return;
    }
    window._yoNombre=f.nombre||'';
    $('login').style.display='none'; $('nopuede').style.display='none';
    $('app').style.display='block';
    document.querySelector('.adg-barra').style.display='flex';
    $('yoMail').textContent=miCorreo;
    escucharAtrasadas();
    /* Arranca en el día de hoy, que es para lo que se entra todos los días.
       El historial completo del alumno pesa (todas las clases de todos) y se
       carga recién cuando se abre esa solapa. */
    verDia(isoDeHoy());
  }).catch(function(e){
    $('login').style.display='none';
    $('nopuedeTxt').textContent='No se pudo verificar tu acceso. '+e.message;
    $('nopuede').style.display='flex';
  });
});
</script>

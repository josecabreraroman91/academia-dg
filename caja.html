/* ============================================================
   CAJA — de dónde sale cada número

   Nada se guarda dos veces. Todo se calcula al abrir, leyendo:

     historial_v1/csv  · las clases que ya pasaron (copia de la hoja HISTORIAL,
                         la refresca un script cada 30 minutos)
     alumnos_v1/csv    · el padrón: precio por clase y teléfono
     tipos_v1          · cuánto aporta cada tipo de clase al pozo de los profes.
                         Es el ÚNICO dato que vive acá y en ningún otro lado.

   Las dos cuentas son independientes y solo comparten la clase:

     Lo que cobra la academia → sale del ALUMNO (su precio, del padrón)
     Lo que se paga al profe  → sale del TIPO DE CLASE (igual para todos)

   La diferencia es lo que le queda a la academia.
   ============================================================ */

var CUENTA={ nombre:'Diego González', alias:'1.549.349' };

var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];

var $=function(id){ return document.getElementById(id); };
var miCorreo=null, miNombre='';
var historial=[], padron=[], tipos={};
var idxId={}, idxNom={};
var solapa='cobros', mesElegido='', filtroTxt='';
var POZO=null, CORREGIR=null;

function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function aClave(m){ return String(m).trim().toLowerCase().replace(/\./g, ','); }
function gs(n){ return Math.round(n||0).toLocaleString('es-PY'); }
function toast(t){ var e=$('toast'); e.textContent=t; e.style.display='block';
  clearTimeout(e._t); e._t=setTimeout(function(){ e.style.display='none'; }, 3200); }

function normNom(s){
  return String(s==null?'':s).replace(/\u2060/g,'').replace(/\u200b/g,'').replace(/\u2019/g,"'")
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/\s+/g,' ').trim();
}
/* Misma limpieza que usa el calendario: saca el sufijo de sede o de tipo de clase
   pegado al nombre ("Pedro Gomez LOMAS", "Rob Wilkie DUAL"). Sin esto, el mismo
   alumno queda partido en dos. */
var SUFIJOS=['lomas','elite','segurola','dual','duales','individual','ind','grupal','g','d',
             'noche','ar','alto','rendimiento','pretemporada','prete','grupo','chicos'];
function keyAlumno(s){
  var w=normNom(s).replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().split(' ');
  while(w.length>1 && SUFIJOS.indexOf(w[w.length-1])>=0) w.pop();
  return w.join(' ');
}
function soloDigitos(s){ return String(s==null?'':s).replace(/\D/g,''); }

/* Códigos de país de los alumnos del exterior: no se les pega el 595 delante, y
   se lo despega si una versión vieja ya lo hizo. Igual que en el calendario. */
var PAIS_CC=['549','54','598','591','593','55','56','51','57','52','34','33','39','44','49',
             '351','353','31','41','43','45','46','47','48','420','61','64','81','82','86','972','1'];
function empiezaConPais(d){
  for(var i=0;i<PAIS_CC.length;i++){ if(d.indexOf(PAIS_CC[i])===0) return true; }
  return false;
}
function normTel(raw){
  var d=soloDigitos(raw); if(!d) return '';
  if(d.slice(0,2)==='00') d=d.slice(2);
  if(d.indexOf('595')===0 && d.length>12 && empiezaConPais(d.slice(3))) return d.slice(3);
  if(d.indexOf('595')===0){
    var r=d.slice(3); while(r.charAt(0)==='0') r=r.slice(1);
    return '595'+r;
  }
  while(d.charAt(0)==='0') d=d.slice(1);
  if(d.length<=10 && !empiezaConPais(d)) return '595'+d;
  return d;
}
function telOk(t){ return t && t.length>=10 && t.length<=15; }
/* Un paraguayo es 595 + 9 dígitos = 12. Un número del exterior con su código de
   país está bien: hay 76 alumnos así. Lo que no es ninguna de las dos cosas está
   mal cargado — el caso de Jorge Bernal, con el 595 tipeado 959, pasa el largo
   pero no existe. */
function telRaro(t){
  var d=soloDigitos(t); if(!d) return 'sin teléfono';
  if(d.indexOf('595')===0){
    if(d.length===12) return '';
    return d.length>12 ? 'le sobran '+(d.length-12)+' dígito(s)' : 'le faltan '+(12-d.length)+' dígito(s)';
  }
  if(empiezaConPais(d) && d.length>=10 && d.length<=15) return '';
  return 'no se reconoce el país';
}

function fechaCorta(iso){
  var d=new Date(iso+'T00:00:00');
  return DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
}
function mesDe(iso){ return iso.slice(0,7); }
function mesNombre(m){
  var p=m.split('-');
  return MESES[(+p[1])-1]+' '+p[0];
}

/* ---------- Lectura de los datos ---------- */
function parseCSV(txt){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<txt.length;i++){ var c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* HISTORIAL: Fecha · Alumno · Hora · Sede · Profe · Tipo · Estado · Cobro · Motivo · ID */
function cargarHistorial(){
  return firebase.database().ref('historial_v1/csv').once('value').then(function(s){
    var csv=s.val(); if(!csv) return;
    var rows=parseCSV(csv); if(rows.length<2) return;
    historial=[];
    for(var i=1;i<rows.length;i++){
      var r=rows[i];
      var fecha=(r[0]||'').trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) continue;
      var nom=(r[1]||'').trim(); if(!nom) continue;
      var estado=(r[6]||'').trim();
      historial.push({
        fecha:fecha, alumno:nom, hora:(r[2]||'').trim(), sede:(r[3]||'').trim(),
        profe:(r[4]||'').trim(), tipo:(r[5]||'').trim(),
        estado:estado, cobro:(r[7]||'').trim(), motivo:(r[8]||'').trim(),
        id:(r[9]||'').trim(),
        presente: estado.indexOf('Presente')===0,
        seCobra: (r[7]||'').trim().toLowerCase().indexOf('s')===0
      });
    }
  }).catch(function(e){ console.warn('historial_v1:', e.message); });
}

/* Padrón: los encabezados NO están en la primera fila y hay columnas ocultas,
   así que las columnas se buscan por su nombre, nunca por posición. */
function cargarPadron(){
  return firebase.database().ref('alumnos_v1/csv').once('value').then(function(s){
    var csv=s.val(); if(!csv) return;
    var rows=parseCSV(csv); if(rows.length<2) return;
    var head=-1, col={};
    for(var r=0;r<Math.min(rows.length,12);r++){
      var h=rows[r].map(normNom);
      var iNom=h.indexOf('alumnos'); if(iNom<0) iNom=h.indexOf('alumno');
      var iId=h.indexOf('id');
      if(iNom>=0 && iId>=0){
        head=r;
        col.nom=iNom; col.id=iId;
        col.precio=h.findIndex(function(x){ return x.indexOf('precio')>=0; });
        col.tel=h.findIndex(function(x){ return x.indexOf('telefono')>=0; });
        col.tipo=h.findIndex(function(x){ return x.indexOf('tipo de clase')>=0; });
        col.cat=h.findIndex(function(x){ return x.indexOf('categoria')>=0; });
        col.alt1=h.findIndex(function(x){ return x.indexOf('nombre p/ horario')>=0 || x.indexOf('nombre p horario')>=0; });
        col.alt2=h.findIndex(function(x){ return x.indexOf('nombre_calendario')>=0 || x.indexOf('nombre calendario')>=0; });
        break;
      }
    }
    if(head<0) return;
    padron=[]; idxId={}; idxNom={};
    for(var i=head+1;i<rows.length;i++){
      var f=rows[i], nom=(f[col.nom]||'').trim(); if(!nom) continue;
      var a={
        nombre:nom,
        id:col.id>=0?(f[col.id]||'').trim():'',
        precio:col.precio>=0?(+soloDigitos(f[col.precio])||0):0,
        tel:col.tel>=0?normTel(f[col.tel]):'',
        telCrudo:col.tel>=0?(f[col.tel]||'').trim():'',
        tipo:col.tipo>=0?(f[col.tipo]||'').trim():'',
        cat:col.cat>=0?(f[col.cat]||'').trim():''
      };
      padron.push(a);
      if(a.id && !idxId[a.id]) idxId[a.id]=a;
      [nom, col.alt1>=0?f[col.alt1]:'', col.alt2>=0?f[col.alt2]:''].forEach(function(n){
        var k=keyAlumno(n); if(k && !idxNom[k]) idxNom[k]=a;
      });
    }
  }).catch(function(e){ console.warn('alumnos_v1:', e.message); });
}

/* La tabla de tipos: el único dato que nace acá. */
function cargarTipos(){
  return firebase.database().ref('tipos_v1').once('value').then(function(s){
    tipos=s.val()||{};
  }).catch(function(e){ tipos={}; console.warn('tipos_v1:', e.message); });
}

function fichaDe(h){
  if(h.id && idxId[h.id]) return idxId[h.id];
  return idxNom[keyAlumno(h.alumno)]||null;
}
function aporteDe(tipo){
  var t=tipos[claveTipo(tipo)];
  return t && t.aporte ? +t.aporte : 0;
}
/* Las claves de Firebase no aceptan puntos ni barras. */
function claveTipo(t){ return String(t||'(sin tipo)').trim().replace(/[.#$/\[\]]/g,'_')||'(sin tipo)'; }

/* ============================================================
   EL POZO DE LOS PROFESORES

   Verificado contra tres meses de pagos reales: coincide al peso.

   · La bolsa de una hora se arma con lo que aportan los alumnos PRESENTES de
     esa hora, juntando las tres sedes.
   · Se reparte en partes iguales entre todos los profes que TENÍAN CLASE esa
     hora, hayan venido sus alumnos o no. El profe cuyos alumnos faltaron igual
     estuvo trabajando: hay 85 horas así en el historial viejo.
   · No importa cuántos alumnos tuvo cada uno.
   ============================================================ */
function calcularPozo(filas){
  var horas={};
  filas.forEach(function(h){
    var k=h.fecha+'|'+h.hora;
    if(!horas[k]) horas[k]={fecha:h.fecha, hora:h.hora, total:0, profes:{}, presentes:0, clases:0, sinTipo:0};
    var b=horas[k];
    b.clases++;
    if(h.profe) b.profes[h.profe]=true;
    if(h.presente){
      b.presentes++;
      var ap=aporteDe(h.tipo);
      if(!ap) b.sinTipo++;
      b.total+=ap;
    }
  });
  var porProfe={}, sinTipoTotal=0, totalPozo=0;
  Object.keys(horas).forEach(function(k){
    var b=horas[k], ps=Object.keys(b.profes);
    sinTipoTotal+=b.sinTipo;
    if(!ps.length || !b.total) return;
    b.parte=b.total/ps.length;
    totalPozo+=b.total;
    ps.forEach(function(p){
      if(!porProfe[p]) porProfe[p]={profe:p, monto:0, horas:0, clases:0, presentes:0};
      porProfe[p].monto+=b.parte;
      porProfe[p].horas++;
    });
  });
  filas.forEach(function(h){
    if(h.profe && porProfe[h.profe]){
      porProfe[h.profe].clases++;
      if(h.presente) porProfe[h.profe].presentes++;
    }
  });
  return { horas:horas, porProfe:porProfe, total:totalPozo, clasesSinTipo:sinTipoTotal };
}

/* ============================================================
   LO QUE COBRA LA ACADEMIA

   Se cobra lo que ya decidió el cierre del día (columna Cobro del HISTORIAL):
   el que vino, y el que dijo que venía y no vino. Acá no se vuelve a decidir
   nada, solo se le pone precio.

   Un precio de más de 500.000 es un abono mensual mal cargado en la casilla del
   precio por clase. No se multiplica: se cobra una vez en el mes.
   ============================================================ */
var TOPE_ABONO=500000;

function cobroDeFilas(filas){
  var porAlumno={};
  filas.forEach(function(h){
    if(!h.seCobra) return;
    var f=fichaDe(h);
    var k=f?(f.id||keyAlumno(f.nombre)):keyAlumno(h.alumno);
    if(!porAlumno[k]) porAlumno[k]={
      clave:k, nombre:f?f.nombre:h.alumno, ficha:f, clases:0, dias:{},
      precio:f?f.precio:0, abono:!!(f&&f.precio>TOPE_ABONO), total:0, sinPrecio:!f||!f.precio
    };
    var a=porAlumno[k];
    a.clases++;
    a.dias[h.fecha]=(a.dias[h.fecha]||0)+1;
  });
  Object.keys(porAlumno).forEach(function(k){
    var a=porAlumno[k];
    if(a.sinPrecio) a.total=0;
    else if(a.abono) a.total=a.precio;          // abono mensual: una vez, no por clase
    else a.total=a.precio*a.clases;
  });
  return porAlumno;
}

function filasDelMes(mes){
  if(!mes) return historial;
  return historial.filter(function(h){ return mesDe(h.fecha)===mes; });
}
function mesesDisponibles(){
  var m={};
  historial.forEach(function(h){ m[mesDe(h.fecha)]=true; });
  return Object.keys(m).sort().reverse();
}

/* ---------- Solapas ---------- */
document.querySelectorAll('.solapas button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.solapas button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); solapa=b.dataset.s; pintar();
  };
});

function selectorMes(){
  var ms=mesesDisponibles();
  if(!ms.length) return '';
  if(!mesElegido || ms.indexOf(mesElegido)<0) mesElegido=ms[0];
  return '<select id="selMes">'+ms.map(function(m){
    return '<option value="'+m+'"'+(m===mesElegido?' selected':'')+'>'+esc(mesNombre(m))+'</option>';
  }).join('')+'</select>';
}
function engancharMes(){
  var s=$('selMes'); if(!s) return;
  s.onchange=function(){ mesElegido=s.value; pintar(); };
}

function pintar(){
  if(solapa==='cobros') pantallaCobros();
  else if(solapa==='informes') pantallaInformes();
  else if(solapa==='profes') pantallaProfes();
  else if(solapa==='tipos') pantallaTipos();
  else pantallaCorregir();
  contarCorregir();
}

/* ============================================================
   SOLAPA COBROS
   ============================================================ */
function pantallaCobros(){
  var ms=mesesDisponibles();
  if(!ms.length){ $('pantalla').innerHTML='<div class="vacio">Todavía no hay clases cerradas en el historial.</div>'; return; }
  var filas=filasDelMes(mesElegido);
  var porAlumno=cobroDeFilas(filas);
  var lista=Object.keys(porAlumno).map(function(k){ return porAlumno[k]; });

  var t=filtroTxt?normNom(filtroTxt):'';
  var vis=lista.filter(function(a){ return !t || normNom(a.nombre).indexOf(t)>=0; });
  vis.sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });

  var totCobrable=0, totSinPrecio=0, clasesSinPrecio=0;
  lista.forEach(function(a){
    totCobrable+=a.total;
    if(a.sinPrecio){ totSinPrecio++; clasesSinPrecio+=a.clases; }
  });

  var html='<div class="barra">'+selectorMes()+
    '<input class="txt" id="q" placeholder="Buscar alumno…" value="'+esc(filtroTxt)+'"></div>'+
    '<div class="totales">'+
      '<div class="tot"><b>'+lista.length+'</b>alumnos con clases</div>'+
      '<div class="tot entra"><b>'+gs(totCobrable)+'</b>a cobrar en el mes</div>'+
      (totSinPrecio?'<div class="tot malo"><b>'+totSinPrecio+'</b>sin precio · '+clasesSinPrecio+' clases</div>':'')+
    '</div>';

  if(totSinPrecio) html+='<div class="aviso">Hay <b>'+totSinPrecio+' alumnos sin precio cargado</b> con clases este mes. '+
    'No entran en el total. Están listados en <b>Para corregir</b>, y el precio se carga en la app de Alumnos.</div>';

  html+='<div class="caja"><table><thead><tr><th>Alumno</th><th class="num">Días</th>'+
    '<th class="num">Clases</th><th class="num">Precio</th><th class="num">Total</th><th></th></tr></thead><tbody>';
  if(!vis.length) html+='<tr><td colspan="6" class="vacio">Nadie con ese nombre.</td></tr>';
  vis.forEach(function(a){
    var dias=Object.keys(a.dias).length;
    html+='<tr class="click" data-k="'+esc(a.clave)+'">'+
      '<td>'+esc(a.nombre)+(a.abono?' <span class="chip ojo">abono</span>':'')+
        (a.sinPrecio?' <span class="chip mal">sin precio</span>':'')+'</td>'+
      '<td class="num">'+dias+'</td>'+
      '<td class="num">'+a.clases+'</td>'+
      '<td class="num">'+(a.precio?gs(a.precio):'—')+'</td>'+
      '<td class="num">'+(a.total?gs(a.total):'—')+'</td>'+
      '<td class="num"><button class="b chico">Ver</button></td></tr>';
  });
  html+='</tbody></table><div class="pie">Se cobran las clases que el cierre del día marcó como cobrables: '+
    'el que vino, y el que dijo que venía y no vino.</div></div>';

  $('pantalla').innerHTML=html;
  engancharMes();
  var q=$('q');
  if(q){ q.oninput=function(){ filtroTxt=q.value; pantallaCobros();
    var n=$('q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }; }
  document.querySelectorAll('#pantalla tr.click').forEach(function(tr){
    tr.onclick=function(){ abrirAlumno(porAlumno[tr.dataset.k], filas); };
  });
}

function fraseDias(ds){
  if(ds.length===1) return ds[0];
  return ds.slice(0,-1).join(', ')+' y '+ds[ds.length-1];
}

function textoMensaje(a){
  var primer=(a.nombre||'').trim().split(/\s+/)[0];
  var fechas=Object.keys(a.dias).sort();
  var ds=fechas.map(function(f){
    var d=+f.slice(8,10), c=a.dias[f];
    return c>1 ? d+' ('+c+' clases)' : ''+d;
  });
  var frase='En '+mesNombre(mesElegido).split(' ')[0]+' entrenaste los días '+fraseDias(ds)+
            ' y el total es '+gs(a.total)+' Gs.';
  return '*Hola '+primer+' cómo estás? 🎾*\n\n'+
    'Quiero pasarte tu estado de cuenta y detalle de clases por favor.\n\n'+
    frase+'\n\n'+
    'Por favor cuando puedas podes fijarte y realizar la transferencia sin problema.\n'+
    'Si preferís pagar por *QR*, avísame y te envío la imagen 💪🏻\n\n'+
    '*CUENTA PARA TRANSFERENCIAS*\n\n'+
    '👤*Nombre:* '+CUENTA.nombre+'\n'+
    '💰 *Alias CI:* '+CUENTA.alias+'\n\n'+
    'Muchas gracias!!!!';
}

function abrirAlumno(a, filas){
  if(!a) return;
  var suyas=filas.filter(function(h){
    var f=fichaDe(h);
    var k=f?(f.id||keyAlumno(f.nombre)):keyAlumno(h.alumno);
    return k===a.clave;
  }).sort(function(x,y){ return x.fecha<y.fecha?-1:1; });

  var tel=a.ficha?a.ficha.tel:'';
  var msg=a.total?textoMensaje(a):'';

  var h='<h3>'+esc(a.nombre)+'</h3>'+
    '<div class="donde">'+esc(mesNombre(mesElegido))+' · '+a.clases+' clases cobrables'+
    (a.ficha&&a.ficha.id?' · '+esc(a.ficha.id):'')+'</div>';

  h+='<table><thead><tr><th>Día</th><th>Hora</th><th>Sede</th><th>Profe</th><th>Tipo</th><th class="num">Cobro</th></tr></thead><tbody>';
  suyas.forEach(function(c){
    h+='<tr><td>'+esc(fechaCorta(c.fecha))+'</td><td>'+esc(c.hora)+'</td><td>'+esc(c.sede)+'</td>'+
       '<td>'+esc(c.profe)+'</td><td>'+esc(c.tipo||'—')+'</td>'+
       '<td class="num"><span class="chip '+(c.seCobra?'si':'no')+'">'+(c.seCobra?'sí':'no')+'</span></td></tr>';
  });
  h+='</tbody></table>';

  if(a.sinPrecio){
    h+='<div class="aviso" style="margin-top:14px">Este alumno <b>no tiene precio cargado</b>. '+
       'El precio vive en el padrón: se carga en la app de Alumnos y acá aparece solo.</div>';
  } else {
    h+='<div class="totales" style="margin-top:14px">'+
       '<div class="tot"><b>'+gs(a.precio)+'</b>'+(a.abono?'abono del mes':'por clase')+'</div>'+
       '<div class="tot entra"><b>'+gs(a.total)+'</b>total del mes</div></div>';
    h+='<div class="msg">'+esc(msg)+'</div>';
  }

  h+='<div class="acc">';
  if(a.total){
    if(telOk(tel)) h+='<button class="b wa" id="mWa">Enviar por WhatsApp</button>';
    else h+='<button class="b" disabled>Sin teléfono usable</button>';
    h+='<button class="b" id="mCopiar">Copiar el mensaje</button>';
  }
  h+='<button class="b" id="mCerrar">Cerrar</button></div>';

  $('modal').innerHTML=h; $('ov').classList.add('show');
  $('mCerrar').onclick=cerrarModal;
  if($('mWa')) $('mWa').onclick=function(){
    /* web.whatsapp.com y NO wa.me: en Windows wa.me abre WhatsApp Escritorio y
       ese programa rompe los emojis de cuatro bytes (🎾 💪 👤 💰). */
    window.open('https://web.whatsapp.com/send?phone='+tel+'&text='+encodeURIComponent(msg),'waSenderTab');
  };
  if($('mCopiar')) $('mCopiar').onclick=function(){
    navigator.clipboard.writeText(msg).then(function(){ toast('Mensaje copiado'); },
      function(){ toast('No pude copiar'); });
  };
}
function cerrarModal(){ $('ov').classList.remove('show'); }
$('ov').onclick=function(e){ if(e.target===$('ov')) cerrarModal(); };

/* ============================================================
   SOLAPA INFORMES
   ============================================================ */
function pantallaInformes(){
  var ms=mesesDisponibles();
  if(!ms.length){ $('pantalla').innerHTML='<div class="vacio">Todavía no hay clases cerradas en el historial.</div>'; return; }
  var filas=filasDelMes(mesElegido);
  var pozo=calcularPozo(filas);
  var porAlumno=cobroDeFilas(filas);

  var entra=0, sinPrecio=0;
  Object.keys(porAlumno).forEach(function(k){
    entra+=porAlumno[k].total;
    if(porAlumno[k].sinPrecio) sinPrecio+=porAlumno[k].clases;
  });
  var sale=pozo.total, margen=entra-sale;
  var pct=entra?Math.round(margen*100/entra):0;

  var html='<div class="barra">'+selectorMes()+'</div>';

  html+='<div class="totales">'+
    '<div class="tot entra"><b>'+gs(entra)+'</b>entra (alumnos)</div>'+
    '<div class="tot sale"><b>'+gs(sale)+'</b>sale (profesores)</div>'+
    '<div class="tot '+(margen>=0?'margen':'malo')+'"><b>'+gs(margen)+'</b>queda · '+pct+'%</div>'+
    '<div class="tot"><b>'+filas.length+'</b>clases del mes</div>'+
  '</div>';

  if(sinPrecio||pozo.clasesSinTipo){
    html+='<div class="aviso">Estos números están cortos: hay <b>'+sinPrecio+' clases sin precio de alumno</b>'+
      (pozo.clasesSinTipo?' y <b>'+pozo.clasesSinTipo+' clases con un tipo sin aporte cargado</b>':'')+
      '. Cada corrección hace este informe más cierto.</div>';
  }

  /* --- Evolución mes a mes --- */
  html+='<div class="caja"><h3>Mes a mes</h3><table><thead><tr><th>Mes</th><th class="num">Clases</th>'+
    '<th class="num">Entra</th><th class="num">Sale</th><th class="num">Queda</th><th class="num">%</th></tr></thead><tbody>';
  ms.slice().reverse().forEach(function(m){
    var f=filasDelMes(m), pz=calcularPozo(f), ca=cobroDeFilas(f), e=0;
    Object.keys(ca).forEach(function(k){ e+=ca[k].total; });
    var q=e-pz.total;
    html+='<tr><td>'+esc(mesNombre(m))+'</td><td class="num">'+f.length+'</td>'+
      '<td class="num">'+gs(e)+'</td><td class="num">'+gs(pz.total)+'</td>'+
      '<td class="num" style="color:'+(q>=0?'var(--celeste)':'var(--rojo)')+'">'+gs(q)+'</td>'+
      '<td class="num">'+(e?Math.round(q*100/e):0)+'%</td></tr>';
  });
  html+='</tbody></table></div>';

  /* --- Por hora del día --- */
  var horas={};
  Object.keys(pozo.horas).forEach(function(k){
    var b=pozo.horas[k];
    if(!horas[b.hora]) horas[b.hora]={hora:b.hora, pozo:0, presentes:0, clases:0, turnos:0};
    var x=horas[b.hora];
    x.pozo+=b.total; x.presentes+=b.presentes; x.clases+=b.clases;
    x.turnos+=Object.keys(b.profes).length;
  });
  var lh=Object.keys(horas).map(function(k){ return horas[k]; })
    .sort(function(a,b){ return (b.pozo/Math.max(b.presentes,1))-(a.pozo/Math.max(a.presentes,1)); });
  html+='<div class="caja"><h3>Por hora del día</h3><table><thead><tr><th>Hora</th>'+
    '<th class="num">Alumnos</th><th class="num">Sale</th><th class="num">Costo x alumno</th>'+
    '<th class="num">Alumnos x profe</th></tr></thead><tbody>';
  lh.forEach(function(x){
    var costo=x.presentes?x.pozo/x.presentes:0;
    var apf=x.turnos?x.presentes/x.turnos:0;
    html+='<tr><td>'+esc(x.hora)+'</td><td class="num">'+x.presentes+'</td>'+
      '<td class="num">'+gs(x.pozo)+'</td><td class="num">'+gs(costo)+'</td>'+
      '<td class="num">'+apf.toFixed(1)+'</td></tr>';
  });
  html+='</tbody></table><div class="pie">Ordenado de la hora más cara a la más barata. '+
    'Como la bolsa se reparte entre todos los profes que trabajan esa hora, una hora con pocos '+
    'alumnos y muchos profes cuesta mucho más por alumno.</div></div>';

  /* --- Por sede --- */
  var sedes={};
  filas.forEach(function(h){
    var s=h.sede||'(sin sede)';
    if(!sedes[s]) sedes[s]={sede:s, clases:0, presentes:0, entra:0};
    sedes[s].clases++;
    if(h.presente) sedes[s].presentes++;
    if(h.seCobra){
      var f=fichaDe(h);
      if(f && f.precio && f.precio<=TOPE_ABONO) sedes[s].entra+=f.precio;
    }
  });
  html+='<div class="caja"><h3>Por sede</h3><table><thead><tr><th>Sede</th><th class="num">Clases</th>'+
    '<th class="num">Presentes</th><th class="num">Entra</th></tr></thead><tbody>';
  Object.keys(sedes).sort(function(a,b){ return sedes[b].clases-sedes[a].clases; }).forEach(function(k){
    var s=sedes[k];
    html+='<tr><td>'+esc(s.sede)+'</td><td class="num">'+s.clases+'</td>'+
      '<td class="num">'+s.presentes+'</td><td class="num">'+gs(s.entra)+'</td></tr>';
  });
  html+='</tbody></table><div class="pie">Los abonos mensuales no se reparten por sede: quedan afuera de esta columna.</div></div>';

  /* --- Por tipo de clase --- */
  var tps={};
  filas.forEach(function(h){
    var t=h.tipo||'(sin tipo)';
    if(!tps[t]) tps[t]={tipo:t, clases:0, presentes:0, aporte:0};
    tps[t].clases++;
    if(h.presente){ tps[t].presentes++; tps[t].aporte+=aporteDe(h.tipo); }
  });
  html+='<div class="caja"><h3>Por tipo de clase</h3><table><thead><tr><th>Tipo</th><th class="num">Clases</th>'+
    '<th class="num">Presentes</th><th class="num">Aporte al pozo</th></tr></thead><tbody>';
  Object.keys(tps).sort(function(a,b){ return tps[b].clases-tps[a].clases; }).forEach(function(k){
    var t=tps[k];
    html+='<tr><td>'+esc(t.tipo)+(aporteDe(t.tipo)?'':' <span class="chip mal">sin aporte</span>')+'</td>'+
      '<td class="num">'+t.clases+'</td><td class="num">'+t.presentes+'</td>'+
      '<td class="num">'+gs(t.aporte)+'</td></tr>';
  });
  html+='</tbody></table></div>';

  /* --- Ausencias --- */
  var aus=0, ausCobrada=0, perdida=0;
  filas.forEach(function(h){
    if(h.presente) return;
    aus++;
    if(h.seCobra) ausCobrada++;
    else {
      var f=fichaDe(h);
      if(f && f.precio && f.precio<=TOPE_ABONO) perdida+=f.precio;
    }
  });
  html+='<div class="caja"><h3>Ausencias</h3>'+
    '<div class="totales" style="margin:0">'+
      '<div class="tot"><b>'+aus+'</b>clases sin alumno presente</div>'+
      '<div class="tot entra"><b>'+ausCobrada+'</b>se cobran igual</div>'+
      '<div class="tot malo"><b>'+gs(perdida)+'</b>no se cobra</div>'+
    '</div>'+
    '<div class="pie">Se cobra al que dijo que venía y no vino. No se cobra al que avisó, '+
    'ni al que nunca contestó el WhatsApp.</div></div>';

  /* --- Alumnos que dejaron de venir --- */
  var ult={}, hoy=new Date();
  historial.forEach(function(h){
    if(!h.presente) return;
    var f=fichaDe(h);
    var k=f?(f.id||keyAlumno(f.nombre)):keyAlumno(h.alumno);
    if(!ult[k] || h.fecha>ult[k].fecha) ult[k]={fecha:h.fecha, nombre:f?f.nombre:h.alumno};
    ult[k].total=(ult[k].total||0)+1;
  });
  var dormidos=Object.keys(ult).map(function(k){
    var u=ult[k];
    var d=Math.round((hoy-new Date(u.fecha+'T00:00:00'))/86400000);
    return {nombre:u.nombre, fecha:u.fecha, dias:d, total:u.total};
  }).filter(function(x){ return x.dias>=21; })
    .sort(function(a,b){ return b.total-a.total; }).slice(0,25);

  html+='<div class="caja"><h3>Hace 3 semanas que no vienen</h3>';
  if(!dormidos.length) html+='<div class="pie">Ninguno. O el historial todavía es muy corto para saberlo.</div>';
  else{
    html+='<table><thead><tr><th>Alumno</th><th class="num">Última vez</th>'+
      '<th class="num">Días</th><th class="num">Clases que tuvo</th></tr></thead><tbody>';
    dormidos.forEach(function(x){
      html+='<tr><td>'+esc(x.nombre)+'</td><td class="num">'+esc(fechaCorta(x.fecha))+'</td>'+
        '<td class="num">'+x.dias+'</td><td class="num">'+x.total+'</td></tr>';
    });
    html+='</tbody></table><div class="pie">Ordenado por cuántas clases llegó a tener: primero los que más se extrañan.</div>';
  }
  html+='</div>';

  $('pantalla').innerHTML=html;
  engancharMes();
}

/* ============================================================
   SOLAPA PAGO A PROFESORES
   ============================================================ */
function pantallaProfes(){
  var ms=mesesDisponibles();
  if(!ms.length){ $('pantalla').innerHTML='<div class="vacio">Todavía no hay clases cerradas en el historial.</div>'; return; }
  var filas=filasDelMes(mesElegido);
  var pozo=calcularPozo(filas);
  var lista=Object.keys(pozo.porProfe).map(function(k){ return pozo.porProfe[k]; })
    .sort(function(a,b){ return b.monto-a.monto; });

  var html='<div class="barra">'+selectorMes()+'</div>';

  html+='<div class="totales">'+
    '<div class="tot sale"><b>'+gs(pozo.total)+'</b>total a pagar</div>'+
    '<div class="tot"><b>'+lista.length+'</b>profesores</div>'+
  '</div>';

  if(pozo.clasesSinTipo) html+='<div class="aviso"><b>'+pozo.clasesSinTipo+' clases</b> tienen un tipo '+
    'sin aporte cargado y no suman al pozo. Se cargan en <b>Tipos de clase</b>.</div>';

  html+='<div class="caja"><table><thead><tr><th>Profesor</th><th class="num">Horas trabajadas</th>'+
    '<th class="num">Clases</th><th class="num">Alumnos presentes</th><th class="num">A cobrar</th>'+
    '<th></th></tr></thead><tbody>';
  if(!lista.length) html+='<tr><td colspan="6" class="vacio">Sin clases este mes.</td></tr>';
  lista.forEach(function(p){
    html+='<tr class="click" data-p="'+esc(p.profe)+'"><td>'+esc(p.profe)+'</td>'+
      '<td class="num">'+p.horas+'</td><td class="num">'+p.clases+'</td>'+
      '<td class="num">'+p.presentes+'</td><td class="num">'+gs(p.monto)+'</td>'+
      '<td class="num"><button class="b chico">Ver el detalle</button></td></tr>';
  });
  html+='</tbody></table><div class="pie">La bolsa de cada hora se arma con los alumnos presentes de las tres '+
    'sedes y se reparte en partes iguales entre los profes que tenían clase esa hora.</div></div>';

  $('pantalla').innerHTML=html;
  engancharMes();
  document.querySelectorAll('#pantalla tr.click').forEach(function(tr){
    tr.onclick=function(){ abrirProfe(tr.dataset.p, pozo); };
  });
}

function abrirProfe(profe, pozo){
  var hs=Object.keys(pozo.horas).map(function(k){ return pozo.horas[k]; })
    .filter(function(b){ return b.profes[profe] && b.total; })
    .sort(function(a,b){ return (a.fecha+a.hora)<(b.fecha+b.hora)?-1:1; });

  var h='<h3>'+esc(profe)+'</h3><div class="donde">'+esc(mesNombre(mesElegido))+' · '+hs.length+' horas</div>';
  h+='<table><thead><tr><th>Día</th><th>Hora</th><th class="num">Bolsa</th>'+
     '<th class="num">Profes</th><th class="num">Le toca</th></tr></thead><tbody>';
  var tot=0;
  hs.forEach(function(b){
    var n=Object.keys(b.profes).length;
    tot+=b.parte;
    h+='<tr><td>'+esc(fechaCorta(b.fecha))+'</td><td>'+esc(b.hora)+'</td>'+
       '<td class="num">'+gs(b.total)+'</td><td class="num">'+n+'</td>'+
       '<td class="num">'+gs(b.parte)+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="totales" style="margin-top:14px"><div class="tot sale"><b>'+gs(tot)+'</b>total del mes</div></div>';
  h+='<div class="acc"><button class="b" id="pCopiar">Copiar el detalle</button>'+
     '<button class="b" id="mCerrar">Cerrar</button></div>';

  $('modal').innerHTML=h; $('ov').classList.add('show');
  $('mCerrar').onclick=cerrarModal;
  $('pCopiar').onclick=function(){
    var t=profe+' · '+mesNombre(mesElegido)+'\n';
    hs.forEach(function(b){
      t+=fechaCorta(b.fecha)+' '+b.hora+' · bolsa '+gs(b.total)+' entre '+
         Object.keys(b.profes).length+' → '+gs(b.parte)+'\n';
    });
    t+='TOTAL: '+gs(tot)+' Gs.';
    navigator.clipboard.writeText(t).then(function(){ toast('Detalle copiado'); },
      function(){ toast('No pude copiar'); });
  };
}

/* ============================================================
   SOLAPA TIPOS DE CLASE

   La lista NO está escrita a mano: sale de los tipos que aparecen de verdad en
   el historial. Si mañana aparece un tipo nuevo, aparece acá solo, marcado como
   sin aporte, y el informe avisa. Una casa por dato: el aporte vive únicamente
   en tipos_v1.
   ============================================================ */
function pantallaTipos(){
  var uso={};
  historial.forEach(function(h){
    var t=(h.tipo||'').trim()||'(sin tipo)';
    if(!uso[t]) uso[t]={tipo:t, clases:0};
    uso[t].clases++;
  });
  Object.keys(tipos).forEach(function(k){ if(!uso[k]) uso[k]={tipo:k, clases:0}; });

  var lista=Object.keys(uso).map(function(k){ return uso[k]; })
    .sort(function(a,b){ return b.clases-a.clases; });

  var html='<div class="aviso">Acá se carga <b>cuánto aporta cada tipo de clase al pozo de los profesores</b>. '+
    'No es lo que paga el alumno: eso vive en el padrón, alumno por alumno. Son dos números distintos para la misma clase.</div>';

  html+='<div class="caja"><h3>Tipos que aparecen en el historial</h3>';
  if(!lista.length) html+='<div class="pie">Todavía no hay clases cerradas.</div>';
  lista.forEach(function(t){
    var k=claveTipo(t.tipo);
    var val=tipos[k]&&tipos[k].aporte?tipos[k].aporte:'';
    html+='<div class="tipoFila"><div class="nom">'+esc(t.tipo)+
      '<div class="uso">'+t.clases+' clases en el historial</div></div>'+
      '<input type="text" inputmode="numeric" data-t="'+esc(k)+'" value="'+esc(val?gs(val):'')+'" placeholder="0"></div>';
  });
  html+='<div class="acc"><button class="b pri" id="tGuardar">Guardar los aportes</button></div>'+
    '<div class="pie">Se guarda en Firebase, en <b>tipos_v1</b>. Es el único dato que nace en esta app.</div></div>';

  $('pantalla').innerHTML=html;

  $('tGuardar').onclick=function(){
    var datos={};
    document.querySelectorAll('#pantalla input[data-t]').forEach(function(i){
      var v=+soloDigitos(i.value)||0;
      if(v) datos[i.dataset.t]={ aporte:v, ts:Date.now(), por:miCorreo };
    });
    $('tGuardar').disabled=true;
    firebase.database().ref('tipos_v1').set(datos).then(function(){
      tipos=datos; $('tGuardar').disabled=false;
      toast('Aportes guardados');
      anotarEnHistorial('tipos', 'Se actualizaron los aportes de '+Object.keys(datos).length+' tipos de clase');
      pintar();
    }).catch(function(e){
      $('tGuardar').disabled=false;
      alert('No se pudo guardar en Firebase.\n\n'+e.message+
        '\n\nSi dice que no tenés permiso, falta agregarle el cajón tipos_v1 a las reglas de Firebase.');
    });
  };
}

function anotarEnHistorial(tipo, detalle){
  try{
    var hoy=new Date();
    var dia=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');
    firebase.database().ref('ops_v1/'+dia).push({
      tipo:tipo, alumno:'—', detalle:detalle,
      porCorreo:miCorreo, porNombre:miNombre||miCorreo, ts:Date.now()
    }).catch(function(){});
  }catch(e){}
}

/* ============================================================
   SOLAPA PARA CORREGIR

   No es una lista cargada a mano ni un archivo aparte: se calcula cada vez,
   cruzando el historial contra el padrón. El que se corrige en la app de
   Alumnos desaparece de acá solo.
   ============================================================ */
function calcularCorregir(){
  var porAlumno={}, tiposSinAporte={};
  historial.forEach(function(h){
    var f=fichaDe(h);
    var k=f?(f.id||keyAlumno(f.nombre)):('?'+keyAlumno(h.alumno));
    if(!porAlumno[k]) porAlumno[k]={
      nombre:f?f.nombre:h.alumno, ficha:f, clases:0, cobrables:0, tipos:{}, plata:0
    };
    var a=porAlumno[k];
    a.clases++;
    if(h.seCobra) a.cobrables++;
    if(h.tipo) a.tipos[h.tipo]=(a.tipos[h.tipo]||0)+1;
    if(h.presente && !aporteDe(h.tipo)){
      var t=(h.tipo||'').trim()||'(sin tipo)';
      tiposSinAporte[t]=(tiposSinAporte[t]||0)+1;
    }
  });

  var items=[];
  Object.keys(porAlumno).forEach(function(k){
    var a=porAlumno[k], f=a.ficha, motivos=[];
    if(!f) motivos.push({txt:'no está en el padrón', grave:true});
    else{
      if(!f.precio) motivos.push({txt:'sin precio cargado', grave:true});
      else if(f.precio>TOPE_ABONO) motivos.push({txt:'precio de abono mensual ('+gs(f.precio)+') en la casilla del precio por clase', grave:false});
      if(!f.tipo) motivos.push({txt:'sin tipo de clase', grave:false});
      var tr=telRaro(f.tel);
      if(tr) motivos.push({txt: tr==='sin teléfono' ? 'sin teléfono' : ('teléfono: '+tr+' ('+f.telCrudo+')'), grave:false});
    }
    if(Object.keys(a.tipos).length>1)
      motivos.push({txt:'hace '+Object.keys(a.tipos).length+' tipos de clase y el padrón tiene un solo precio', grave:false});
    if(!motivos.length) return;
    items.push({
      nombre:a.nombre, clases:a.clases, cobrables:a.cobrables, motivos:motivos,
      grave: motivos.some(function(m){ return m.grave; })
    });
  });
  items.sort(function(a,b){
    if(a.grave!==b.grave) return a.grave?-1:1;
    return b.cobrables-a.cobrables;
  });
  return { items:items, tiposSinAporte:tiposSinAporte };
}

function contarCorregir(){
  CORREGIR=calcularCorregir();
  var n=CORREGIR.items.length+Object.keys(CORREGIR.tiposSinAporte).length;
  $('nCorregir').textContent=n?'· '+n:'';
}

function pantallaCorregir(){
  var c=calcularCorregir();
  var graves=c.items.filter(function(x){ return x.grave; });
  var clasesGraves=graves.reduce(function(s,x){ return s+x.cobrables; },0);

  var html='';
  html+='<div class="totales">'+
    '<div class="tot malo"><b>'+graves.length+'</b>alumnos que no se pueden cobrar</div>'+
    '<div class="tot malo"><b>'+clasesGraves+'</b>clases colgadas por eso</div>'+
    '<div class="tot"><b>'+c.items.length+'</b>alumnos para revisar en total</div>'+
  '</div>';

  var tsa=Object.keys(c.tiposSinAporte);
  if(tsa.length){
    html+='<div class="caja"><h3>Tipos de clase sin aporte cargado</h3>'+
      '<table><thead><tr><th>Tipo</th><th class="num">Clases que no suman al pozo</th></tr></thead><tbody>';
    tsa.sort(function(a,b){ return c.tiposSinAporte[b]-c.tiposSinAporte[a]; }).forEach(function(t){
      html+='<tr><td>'+esc(t)+'</td><td class="num">'+c.tiposSinAporte[t]+'</td></tr>';
    });
    html+='</tbody></table><div class="pie">Se cargan en la solapa <b>Tipos de clase</b>. '+
      'Mientras estén en cero, el pago a profesores sale corto.</div></div>';
  }

  html+='<div class="caja"><h3>Alumnos</h3>';
  if(!c.items.length) html+='<div class="pie">No hay nada para corregir. Raro y buenísimo.</div>';
  else{
    html+='<table><thead><tr><th>Alumno</th><th class="num">Clases</th>'+
      '<th class="num">Cobrables</th><th>Qué le falta</th></tr></thead><tbody>';
    c.items.forEach(function(x){
      html+='<tr><td>'+esc(x.nombre)+'</td><td class="num">'+x.clases+'</td>'+
        '<td class="num">'+x.cobrables+'</td><td>'+
        x.motivos.map(function(m){ return '<span class="chip '+(m.grave?'mal':'ojo')+'">'+esc(m.txt)+'</span>'; }).join(' ')+
        '</td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='<div class="pie">Los rojos son los que hoy no se pueden cobrar. Todo esto se arregla en la '+
    '<b>app de Alumnos</b>, que es donde vive el padrón: acá desaparecen solos cuando se corrigen. '+
    'Ordenado por clases cobrables, no alfabético: primero lo que más plata mueve.</div></div>';

  $('pantalla').innerHTML=html;
}

/* ---------- Entrada ---------- */
$('btnEntrar').onclick=function(){
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(function(e){ $('errLogin').textContent=e.message; });
};
$('btnSalir').onclick=function(e){ e.preventDefault(); firebase.auth().signOut(); };
$('btnSalir2').onclick=function(){ firebase.auth().signOut(); };

/* El botón "atrás" del celular saca la app del recuadro del hub y la deja en
   blanco: cualquier ventana abierta deja una marca en el historial. */
window.addEventListener('popstate', function(){ if($('ov').classList.contains('show')) cerrarModal(); });

/* Nada que lea Firebase corre antes del login. */
firebase.auth().onAuthStateChanged(function(u){
  if(!u){ $('login').style.display='flex'; $('nopuede').style.display='none'; $('app').style.display='none'; return; }
  miCorreo=u.email.toLowerCase();
  firebase.database().ref('usuarios/'+aClave(miCorreo)).once('value').then(function(s){
    var f=s.val()||{}, p=f.permisos||{};
    /* Esto es plata, de los alumnos y de los profesores: solo administradores. */
    if(f.activo!==true || p.admin!==true){
      $('login').style.display='none';
      $('nopuedeTxt').textContent=miCorreo+'\n\nLa caja es solo para administradores.';
      $('nopuede').style.display='flex';
      return;
    }
    miNombre=f.nombre||'';
    $('login').style.display='none'; $('nopuede').style.display='none';
    $('app').style.display='block';
    $('yoMail').textContent=miCorreo;
    Promise.all([cargarPadron(), cargarHistorial(), cargarTipos()]).then(function(){
      $('cargando').style.display='none';
      var ms=mesesDisponibles();
      $('rango').textContent = historial.length
        ? historial.length+' clases en el historial · '+(ms.length?mesNombre(ms[ms.length-1])+' a '+mesNombre(ms[0]):'')
        : 'todavía sin clases cerradas';
      pintar();
    });
  }).catch(function(e){
    $('login').style.display='none';
    $('nopuedeTxt').textContent='No se pudo verificar tu acceso. '+e.message;
    $('nopuede').style.display='flex';
  });
});
</script>

  contarCorregir();
}

/* ============================================================
   SOLAPA COBROS
   Misma presentación que la app de clases por alumno: un alumno por fila, un mes
   por columna, y el número de clases se toca para abrir la ficha.
   ============================================================ */
function marcas(a){
  var f=a.ficha, p='';
  if(!f) return '<span class="pin no">no está en el padrón</span>';
  if(f.beca) p+='<span class="pin mn">becado</span>';
  else if(!f.precio) p+='<span class="pin sp">sin precio</span>';
  else if(f.precio>TOPE_ABONO) p+='<span class="pin mn">abono mensual</span>';
  /* El corte del abono es "más de 500.000". Un abono cargado en 400.000 o en
     500.000 exactos cae del otro lado y se multiplica por clase: a un alumno de
     20 clases se le cobrarían 10 millones. Acá no se decide nada, solo se avisa
     para que una persona lo mire. */
  else if(f.precio>=ZONA_DUDA) p+='<span class="pin sp">¿precio por clase o abono?</span>';
  var tr=telRaro(f.tel);
  if(tr) p+='<span class="pin tl">'+esc(tr==='sin teléfono'?'sin teléfono':'teléfono')+'</span>';
  return p;
}

function pantallaCobros(){
  if(!ALUMNOS.length){
    $('pantalla').innerHTML='<div class="vacio">Todavía no hay clases cerradas en el historial.<br>'+
      'El cierre del día las va escribiendo todas las noches.</div>';
    return;
  }
  var q=filtroTxt?normNom(filtroTxt):'';
  var lista=q.length>=2 ? ALUMNOS.filter(function(a){ return normNom(a.nombre).indexOf(q)>=0; }) : ALUMNOS;

  /* Cifras de arriba: siempre sobre TODOS los alumnos, no sobre el filtro. */
  var conPrecio=0, sinPrecio=0, clasesSinPrecio=0, totalTodo=0, clasesTodo=0, becados=0;
  ALUMNOS.forEach(function(a){
    var c=cobroDe(a, MESES_HAY);
    clasesTodo+=c.clases;
    if(c.estado==='ok'||c.estado==='abono'){ conPrecio++; totalTodo+=c.total; }
    else if(c.estado==='beca'){ becados++; }
    else { sinPrecio++; clasesSinPrecio+=c.clases; }
  });

  var html='<div class="cifras">'+
    '<div class="cifra"><b>'+gs(ALUMNOS.length)+'</b><span>alumnos con clases</span></div>'+
    '<div class="cifra"><b>'+gs(clasesTodo)+'</b><span>clases cobrables</span></div>'+
    '<div class="cifra entra"><b>'+gs(totalTodo)+'</b><span>en todo el historial</span></div>'+
    (becados?'<div class="cifra"><b>'+gs(becados)+'</b><span>becados · no pagan</span></div>':'')+
    (sinPrecio?'<div class="cifra malo"><b>'+gs(sinPrecio)+'</b><span>sin precio · '+gs(clasesSinPrecio)+' clases</span></div>':'')+
  '</div>';

  if(sinPrecio) html+='<div class="aviso">Hay <b>'+sinPrecio+' alumnos</b> con clases que no se pueden cobrar, '+
    'por <b>'+gs(clasesSinPrecio)+' clases</b>. Están en la solapa <b>Para corregir</b>, y el precio se carga en la app de Alumnos.</div>';

  html+='<div class="barra">'+
    '<input id="q" type="search" autocomplete="off" placeholder="Buscar un alumno por su nombre…" value="'+esc(filtroTxt)+'">'+
  '</div>';

  if(!lista.length){
    html+='<div class="tabla"><div class="vacio">Ningún alumno coincide con eso.</div></div>';
    $('pantalla').innerHTML=html; engancharBuscador(); return;
  }

  var muestra=lista.slice(0, tope);
  var cols='minmax(210px,1fr) repeat('+MESES_HAY.length+', 78px)';
  html+='<div class="tabla"><div class="tgrid" style="grid-template-columns:'+cols+'">';
  html+='<div class="th nomh">Alumno</div>';
  MESES_HAY.forEach(function(m){ html+='<div class="th">'+esc(mesCorto(m))+'</div>'; });
  muestra.forEach(function(a,i){
    var fin=(i===muestra.length-1)?' fin':'';
    html+='<div class="td nomc'+fin+'"><span>'+esc(a.nombre)+'</span>'+marcas(a)+'</div>';
    MESES_HAY.forEach(function(m){
      var mm=a.meses[m];
      html+='<div class="td mesc'+fin+'">';
      html+= mm
        ? '<button class="cnt" data-k="'+esc(a.k)+'" data-m="'+m+'">'+gs(mm.clases)+
          '<small>'+(mm.clases===1?'clase':'clases')+'</small></button>'
        : '<span class="sin">·</span>';
      html+='</div>';
    });
  });
  html+='</div></div>';
  if(lista.length>tope) html+='<button id="masBtn">Ver '+gs(lista.length-tope)+' alumnos más</button>';

  $('pantalla').innerHTML=html;
  engancharBuscador();
  document.querySelectorAll('button.cnt').forEach(function(b){
    b.onclick=function(){ abrirFicha(b.dataset.k, b.dataset.m); };
  });
  if($('masBtn')) $('masBtn').onclick=function(){ tope+=TOPE_FILAS; pantallaCobros(); };
}

function engancharBuscador(){
  var q=$('q'); if(!q) return;
  q.oninput=function(){
    filtroTxt=q.value; tope=TOPE_FILAS; pantallaCobros();
    var n=$('q'); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
  };
}

/* ---------- La ficha del alumno ---------- */
function abrirFicha(k, mes){
  VIENDO=ALUMNOS.filter(function(a){ return a.k===k; })[0]; if(!VIENDO) return;
  var suyos=Object.keys(VIENDO.meses).sort();
  MESES_SEL=[ (mes && VIENDO.meses[mes]) ? mes : suyos[suyos.length-1] ];
  _sumando=false;
  pintarFicha();
  $('ov').classList.add('show');
  document.body.style.overflow='hidden';
  /* El botón "atrás" del celular cierra la ficha en vez de sacar la app del hub. */
  try{ history.pushState({ficha:1},''); }catch(e){}
}
function cerrarFicha(){
  $('ov').classList.remove('show'); document.body.style.overflow=''; VIENDO=null;
}
$('ov').onclick=function(e){ if(e.target===$('ov')) cerrarFicha(); };
window.addEventListener('popstate', function(){ if($('ov').classList.contains('show')) cerrarFicha(); });

function pintarFicha(){
  if(!VIENDO) return;
  var a=VIENDO;
  var suyos=Object.keys(a.meses).sort();
  var sel=MESES_SEL.slice().sort();
  var faltan=suyos.filter(function(m){ return sel.indexOf(m)<0; });

  /* Con permiso de escribir y ficha en el padron, se puede poner el precio
     desde aca mismo. A diferencia de la herramienta provisoria -- donde el
     precio a mano vivia en memoria y se perdia al recargar -- este se guarda
     de verdad: va a alumnos_v2, a padron_v1 y a la planilla por el puente.
     O sea que corrige al alumno para todo el sistema, no para esta pantalla. */
  var faltaPrecio = a.ficha && !a.ficha.beca && !a.ficha.precio;
  var h='<div class="f-cab"><h2>'+esc(a.nombre)+'</h2>'+
        (puedeEditar && a.ficha ? '<div class="pbox" id="pbox">'+
           '<button class="pbtn'+(faltaPrecio?' falta':'')+'" id="fPrecioBtn" title="'+
           (faltaPrecio?'Falta el precio: ponelo a mano':'Cambiar el precio')+'">₲</button>'+
           '<input id="fPrecio" type="text" inputmode="numeric" autocomplete="off" '+
           'placeholder="precio o BECA" aria-label="Precio por clase">'+
         '</div>' : '')+
        '<button id="fCerrar" aria-label="Cerrar">✕</button></div><div class="f-cuerpo">';

  /* Mes principal + botón para sumar otro (para el que debe dos meses). */
  h+='<div class="mesfila"><select class="sel" id="fMes">'+
     suyos.slice().reverse().map(function(m){
       return '<option value="'+m+'"'+(m===sel[sel.length-1]?' selected':'')+'>'+esc(mesNombre(m))+'</option>';
     }).join('')+'</select>'+
     (faltan.length?'<button class="masmes" id="fMasMes" title="Sumar otro mes">+</button>':'')+
     '</div>';

  if(sel.length>1 || _sumando){
    h+='<div class="chips">';
    sel.forEach(function(m){
      h+='<span class="chip">'+esc(mesNombre(m))+
         (sel.length>1?'<button data-quitar="'+m+'" title="Sacar">✕</button>':'')+'</span>';
    });
    if(_sumando) faltan.forEach(function(m){
      h+='<button class="chipAdd" data-sumar="'+m+'">+ '+esc(mesNombre(m))+'</button>';
    });
    h+='</div>';
  }

  /* Los días, agrupados por mes cuando hay más de uno. */
  var clases=0, dias=0, cuerpo='';
  sel.forEach(function(m){
    var mm=a.meses[m]; if(!mm) return;
    var ds=Object.keys(mm.dias).sort();
    clases+=mm.clases; dias+=ds.length;
    var mPago = mesPagado(a, m);
    if(sel.length>1) cuerpo+='<div class="diasMes'+(mPago?' pagado':'')+'">'+esc(mesNombre(m))+' · '+gs(mm.clases)+
      (mm.clases===1?' clase':' clases')+(mPago?' · pagado':'')+'</div>';
    cuerpo+=ds.map(function(f){
      var n=+f.slice(8,10), c=mm.dias[f];
      var pg=estaPagado(a.k, f);
      return '<div class="d'+(c>1?' varias':'')+(pg?' pagado':'')+'"'+
             ' data-pago="'+f+'" title="'+(pg?'Pagado · toca para desmarcar':'Toca si ya se cobro este dia')+'">'+
             '<span class="n">'+n+'</span>'+
             '<span class="c">'+(c===1?'1 clase':c+' clases')+'</span></div>';
    }).join('');
  });
  /* El mes va en verde solo cuando estan pagadas TODAS sus fechas. No hay
     marca de mes que mantener: se lee de las fechas. */
  var todoPago = mesesPagados(a, sel);
  h+='<div class="rotulo'+(todoPago?' pagado':'')+'"><b>'+gs(clases)+(clases===1?' clase':' clases')+'</b> en <b>'+
     gs(dias)+(dias===1?' día':' días')+'</b>'+
     (sel.length>1?' · <b>'+sel.length+' meses juntos</b>':'')+
     (todoPago?'<span class="selloPago">PAGADO</span>':'')+'</div>';
  h+='<div class="dias">'+cuerpo+'</div>';

  /* Cuánto pagar */
  var c=cobroDe(a, sel);
  h+='<div class="cobro"><div class="tit">Cuánto pagar</div>';
  if(c.estado==='ok'){
    h+=op('bien','Según el padrón','₲ '+gs(c.total),
          gs(c.clases)+' clases × ₲ '+gs(c.precio)+' por clase');
  } else if(c.estado==='abono'){
    h+=op('flojo','Según el padrón · abono mensual','₲ '+gs(c.total),
          '₲ '+gs(c.precio)+' por mes × '+c.meses+(c.meses===1?' mes':' meses')+
          '. <b>No se multiplica por clase</b>: el padrón tiene un abono cargado, así que las clases no cambian el monto.');
  } else if(c.estado==='beca'){
    h+=op('flojo','Alumno becado','Sin cargo',
          gs(c.clases)+' clases en el período. No paga: en el padrón dice BECA. '+
          'Al profesor se le paga igual, porque su parte sale del tipo de clase.');
  } else if(c.estado==='planilla'){
    /* Todo el periodo sale de la planilla del sistema viejo: el monto es el que
       ese sistema cobro de verdad, clase por clase. No se recalcula nada. */
    h+=op('bien','Según la planilla','₲ '+gs(c.total),
          gs(c.planClases)+' clases del sistema viejo, con el precio que se cobró en cada una. '+
          'No se usa el padrón: el precio ya viene en el archivo.');
  } else if(c.estado==='mixto'){
    h+=op('bien','Planilla + historial propio','₲ '+gs(c.total),
          gs(c.planClases)+' clases de la planilla · ₲ '+gs(c.planMonto)+'<br>'+
          gs(c.propias)+' clases del historial · '+gs(c.propias)+' × ₲ '+gs(c.precio)+
          ' = ₲ '+gs(c.precio*c.propias));
  } else if(c.estado==='sinprecio'){
    h+=op('malo','Según el padrón','Sin precio cargado',
          'Está en el padrón pero la columna de precio está vacía o en cero. Se carga en la app de Alumnos.');
  } else {
    h+=op('malo','Según el padrón','No está en el padrón',
          'Tiene clases en el historial pero no existe como alumno. Se crea en la app de Alumnos.');
  }
  h+='</div>';

  /* WhatsApp */
  var tel=a.ficha?a.ficha.tel:'';
  var puede=c.total>0 && telOk(tel) && !telRaro(tel);
  h+='<button class="wa" id="fWa"'+(puede?'':' disabled')+'>Enviar por WhatsApp</button>';
  h+='<button class="chico" id="fCopiar" style="width:100%;margin-top:7px"'+(c.total>0?'':' disabled')+'>Copiar el mensaje</button>';
  var nota='';
  if(!c.total) nota='Sin precio no hay mensaje que mandar.';
  else if(!tel) nota='Este alumno no tiene teléfono en el padrón.';
  else if(telRaro(tel)) nota='El teléfono está mal cargado: '+telRaro(tel)+'.';
  else nota='Abre WhatsApp con el mensaje escrito. No lo manda: lo revisás y apretás enviar vos.';
  h+='<div class="waNota">'+esc(nota)+'</div>';

  h+='</div>';
  $('ficha').innerHTML=h;

  $('fCerrar').onclick=cerrarFicha;
  if($('fPrecioBtn')){
    var _pb=$('pbox'), _pi=$('fPrecio');
    _pi.value = a.ficha.beca ? 'BECA' : (a.ficha.precio ? gs(a.ficha.precio) : '');
    $('fPrecioBtn').onclick=function(){ _pb.classList.add('abierto'); _pi.focus(); _pi.select(); };
    _pi.oninput=function(){
      if(/beca/i.test(_pi.value)) return;              // BECA se escribe como palabra
      var d=soloDigitos(_pi.value); _pi.value = d ? gs(+d) : '';
    };
    var _guardar=function(){
      _pb.classList.remove('abierto');
      var txt=(_pi.value||'').trim();
      var antesN=a.ficha.precio||0, antesB=!!a.ficha.beca;
      var nuevoB=/beca/i.test(txt), nuevoN=+soloDigitos(txt)||0;
      if(nuevoB===antesB && nuevoN===antesN) return;   // no cambio nada
      if(!nuevoB && !nuevoN) return;                   // vacio: no se borra un precio sin querer
      corregirAlumno(a.ficha, txt, a.ficha.tipo||'').then(function(){
        pintarFicha(); pintar(); toast('Precio guardado');
      }).catch(function(e){
        alert('No pude guardar el precio.'+String.fromCharCode(10,10)+e.message);
      });
    };
    _pi.onblur=_guardar;
    _pi.onkeydown=function(ev){
      if(ev.key==='Enter'){ _pi.blur(); }
      else if(ev.key==='Escape'){ _pi.value = a.ficha.beca?'BECA':(a.ficha.precio?gs(a.ficha.precio):''); _pb.classList.remove('abierto'); }
    };
  }
  $('fMes').onchange=function(){ MESES_SEL=[$('fMes').value]; _sumando=false; pintarFicha(); };
  if($('fMasMes')) $('fMasMes').onclick=function(){ _sumando=true; pintarFicha(); };
  $('ficha').querySelectorAll('[data-quitar]').forEach(function(b){
    b.onclick=function(){ MESES_SEL=MESES_SEL.filter(function(x){ return x!==b.dataset.quitar; }); pintarFicha(); };
  });
  $('ficha').querySelectorAll('[data-sumar]').forEach(function(b){
    b.onclick=function(){ MESES_SEL.push(b.dataset.sumar); _sumando=false; pintarFicha(); };
  });

  /* Tocar un dia lo marca como pagado (o lo desmarca). Solo con permiso de
     escribir: el que entra a mirar no puede cambiar la cobranza sin querer. */
  if(puedeEditar){
    $('ficha').querySelectorAll('[data-pago]').forEach(function(el){
      el.onclick=function(){ togglePago(a.k, el.dataset.pago); };
    });
  } else {
    $('ficha').querySelectorAll('[data-pago]').forEach(function(el){
      el.style.cursor='default'; el.title='Sin permiso para marcar cobros';
    });
  }

  var msg=c.total?textoMensaje(a, sel, c):'';
  if(puede) $('fWa').onclick=function(){
    /* web.whatsapp.com y NO wa.me: en Windows wa.me abre WhatsApp Escritorio y
       ese programa rompe los emojis de cuatro bytes (🎾 💪 👤 💰). */
    window.open('https://web.whatsapp.com/send?phone='+tel+'&text='+encodeURIComponent(msg),'waSenderTab');
  };
  if(c.total) $('fCopiar').onclick=function(){
    navigator.clipboard.writeText(msg).then(function(){ toast('Mensaje copiado'); },
      function(){ toast('No pude copiar'); });
  };
}

function op(clase, et, nm, exp){
  return '<div class="op '+clase+'"><div class="fila1"><span class="et">'+et+
    '</span><span class="nm">'+nm+'</span></div>'+(exp?'<div class="exp">'+exp+'</div>':'')+'</div>';
}

function fraseDias(ds){
  if(ds.length===1) return ds[0];
  return ds.slice(0,-1).join(', ')+' y '+ds[ds.length-1];
}

/* El mensaje que definió José. Con dos meses la frase se encadena sola. */
function textoMensaje(a, sel, c){
  var primer=(a.nombre||'').trim().split(/\s+/)[0];
  var partes=sel.slice().sort().map(function(m,i){
    var mm=a.meses[m]; if(!mm) return '';
    var ds=Object.keys(mm.dias).sort().map(function(f){
      var d=+f.slice(8,10), n=mm.dias[f];
      return n>1 ? d+' ('+n+' clases)' : ''+d;
    });
    var nom=MESES[(+m.split('-')[1])-1];
    return (i===0?'En '+nom+' entrenaste los días ':'y en '+nom+' los días ')+fraseDias(ds);
  }).filter(Boolean);
  var frase=partes.join(', ')+' y el total es '+gs(c.total)+' Gs.';

  return '*Hola '+primer+' cómo estás? 🎾*\n\n'+
    'Quiero pasarte tu estado de cuenta y detalle de clases por favor.\n\n'+
    frase+'\n\n'+
    'Por favor cuando puedas podes fijarte y realizar la transferencia sin problema.\n'+
    'Si preferís pagar por *QR*, avísame y te envío la imagen 💪🏻\n\n'+
    '*CUENTA PARA TRANSFERENCIAS*\n\n'+
    '👤*Nombre:* '+CUENTA.nombre+'\n'+
    '💰 *Alias CI:* '+CUENTA.alias+'\n\n'+
    'Muchas gracias!!!!';
}

/* ============================================================
   SOLAPA INFORMES
   ============================================================ */
function totalDelMes(mes){
  var e=0, clasesSinPrecio=0;
  ALUMNOS.forEach(function(a){
    if(!a.meses[mes]) return;
    var c=cobroDe(a,[mes]);
    e+=c.total;
    if(c.estado==='sinprecio'||c.estado==='nopadron') clasesSinPrecio+=c.clases;
  });
  return { entra:e, clasesSinPrecio:clasesSinPrecio };
}

function pantallaInformes(){
  if(!MESES_HAY.length){ $('pantalla').innerHTML='<div class="vacio">Todavía no hay clases cerradas en el historial.</div>'; return; }
  var filas=filasDelMes(mesElegido);
  var pozo=calcularPozo(filas);
  var tm=totalDelMes(mesElegido);
  var entra=tm.entra, sale=pozo.total, queda=entra-sale;
  var pct=entra?Math.round(queda*100/entra):0;

  var html='<div class="barra">'+selectorMes()+'</div>';

  html+='<div class="cifras">'+
    '<div class="cifra entra"><b>'+gs(entra)+'</b><span>entra · alumnos</span></div>'+
    '<div class="cifra sale"><b>'+gs(sale)+'</b><span>sale · profesores</span></div>'+
    '<div class="cifra '+(queda>=0?'queda':'malo')+'"><b>'+gs(queda)+'</b><span>queda · '+pct+'%</span></div>'+
    '<div class="cifra"><b>'+gs(filas.length)+'</b><span>clases del mes</span></div>'+
  '</div>';

  if(tm.clasesSinPrecio||pozo.clasesSinTipo){
    html+='<div class="aviso">Estos números están cortos: hay <b>'+gs(tm.clasesSinPrecio)+' clases sin precio de alumno</b>'+
      (pozo.clasesSinTipo?' y <b>'+gs(pozo.clasesSinTipo)+' clases con un tipo sin aporte cargado</b>':'')+
      '. Cada corrección hace este informe más cierto.</div>';
  }

  /* --- Mes a mes --- */
  html+='<div class="caja"><h3>Mes a mes</h3><table class="t"><thead><tr><th>Mes</th><th class="num">Clases</th>'+
    '<th class="num">Entra</th><th class="num">Sale</th><th class="num">Queda</th><th class="num">%</th></tr></thead><tbody>';
  MESES_HAY.slice().reverse().forEach(function(m){
    var f=filasDelMes(m), pz=calcularPozo(f), t=totalDelMes(m), q=t.entra-pz.total;
    html+='<tr><td style="text-transform:capitalize">'+esc(mesNombre(m))+'</td><td class="num">'+gs(f.length)+'</td>'+
      '<td class="num">'+gs(t.entra)+'</td><td class="num">'+gs(pz.total)+'</td>'+
      '<td class="num'+(q<0?' neg':'')+'">'+gs(q)+'</td>'+
      '<td class="num">'+(t.entra?Math.round(q*100/t.entra):0)+'%</td></tr>';
  });
  html+='</tbody></table></div>';

  /* --- Por hora del día --- */
  var horas={};
  Object.keys(pozo.horas).forEach(function(k){
    var b=pozo.horas[k];
    if(!horas[b.hora]) horas[b.hora]={hora:b.hora, pozo:0, presentes:0, turnos:0};
    var x=horas[b.hora];
    x.pozo+=b.total; x.presentes+=b.presentes; x.turnos+=Object.keys(b.profes).length;
  });
  var lh=Object.keys(horas).map(function(k){ return horas[k]; })
    .sort(function(a,b){ return (b.pozo/Math.max(b.presentes,1))-(a.pozo/Math.max(a.presentes,1)); });
  html+='<div class="caja"><h3>Por hora del día</h3><table class="t"><thead><tr><th>Hora</th>'+
    '<th class="num">Alumnos</th><th class="num">Sale</th><th class="num">Costo x alumno</th>'+
    '<th class="num">Alumnos x profe</th></tr></thead><tbody>';
  lh.forEach(function(x){
    html+='<tr><td>'+esc(x.hora)+'</td><td class="num">'+gs(x.presentes)+'</td>'+
      '<td class="num">'+gs(x.pozo)+'</td><td class="num">'+gs(x.presentes?x.pozo/x.presentes:0)+'</td>'+
      '<td class="num">'+(x.turnos?(x.presentes/x.turnos).toFixed(1):'0.0')+'</td></tr>';
  });
  html+='</tbody></table><div class="pie">De la hora más cara a la más barata. Como la bolsa se reparte entre '+
    'todos los profes que trabajan esa hora, una hora con pocos alumnos y muchos profes cuesta mucho más por alumno.</div></div>';

  /* --- Por sede --- */
  var sedes={};
  filas.forEach(function(h){
    var s=h.sede||'(sin sede)';
    if(!sedes[s]) sedes[s]={sede:s, clases:0, presentes:0, entra:0};
    sedes[s].clases++;
    if(h.presente) sedes[s].presentes++;
    if(h.seCobra){
      var f=fichaDe(h);
      if(f && f.precio && f.precio<=TOPE_ABONO) sedes[s].entra+=f.precio;
    }
  });
  html+='<div class="caja"><h3>Por sede</h3><table class="t"><thead><tr><th>Sede</th><th class="num">Clases</th>'+
    '<th class="num">Presentes</th><th class="num">Entra</th></tr></thead><tbody>';
  Object.keys(sedes).sort(function(a,b){ return sedes[b].clases-sedes[a].clases; }).forEach(function(k){
    var s=sedes[k];
    html+='<tr><td>'+esc(s.sede)+'</td><td class="num">'+gs(s.clases)+'</td>'+
      '<td class="num">'+gs(s.presentes)+'</td><td class="num">'+gs(s.entra)+'</td></tr>';
  });
  html+='</tbody></table><div class="pie">Los abonos mensuales no se pueden repartir por sede: quedan afuera de esta columna.</div></div>';

  /* --- Por tipo de clase --- */
  var tps={};
  filas.forEach(function(h){
    var t=h.tipo||'(sin tipo)';
    if(!tps[t]) tps[t]={tipo:t, clases:0, presentes:0, aporte:0};
    tps[t].clases++;
    if(h.presente){ tps[t].presentes++; tps[t].aporte+=aporteDe(h.tipo); }
  });
  html+='<div class="caja"><h3>Por tipo de clase</h3><table class="t"><thead><tr><th>Tipo</th><th class="num">Clases</th>'+
    '<th class="num">Presentes</th><th class="num">Aporte al pozo</th></tr></thead><tbody>';
  Object.keys(tps).sort(function(a,b){ return tps[b].clases-tps[a].clases; }).forEach(function(k){
    var t=tps[k];
    html+='<tr><td>'+esc(t.tipo)+(aporteDe(t.tipo)?'':' <span class="pin sp">sin aporte</span>')+'</td>'+
      '<td class="num">'+gs(t.clases)+'</td><td class="num">'+gs(t.presentes)+'</td>'+
      '<td class="num">'+gs(t.aporte)+'</td></tr>';
  });
  html+='</tbody></table></div>';

  /* --- Ausencias --- */
  var aus=0, ausCobrada=0, perdida=0;
  filas.forEach(function(h){
    if(h.presente) return;
    aus++;
    if(h.seCobra) ausCobrada++;
    else{
      var f=fichaDe(h);
      if(f && f.precio && f.precio<=TOPE_ABONO) perdida+=f.precio;
    }
  });
  html+='<div class="caja"><h3>Ausencias</h3><div class="cifras" style="margin:0">'+
    '<div class="cifra"><b>'+gs(aus)+'</b><span>clases sin alumno</span></div>'+
    '<div class="cifra entra"><b>'+gs(ausCobrada)+'</b><span>se cobran igual</span></div>'+
    '<div class="cifra malo"><b>'+gs(perdida)+'</b><span>no se cobra</span></div></div>'+
    '<div class="pie">Se cobra al que dijo que venía y no vino. No se cobra al que avisó, '+
    'ni al que nunca contestó el WhatsApp.</div></div>';

  /* --- Los que dejaron de venir --- */
  var ult={}, hoy=new Date();
  historial.forEach(function(h){
    if(!h.presente) return;
    var f=fichaDe(h);
    var k=f?(f.id||keyAlumno(f.nombre)):keyAlumno(h.alumno);
    if(!ult[k]) ult[k]={fecha:h.fecha, nombre:f?f.nombre:h.alumno, total:0};
    if(h.fecha>ult[k].fecha) ult[k].fecha=h.fecha;
    ult[k].total++;
  });
  var dormidos=Object.keys(ult).map(function(k){
    var u=ult[k];
    return {nombre:u.nombre, fecha:u.fecha, total:u.total,
            dias:Math.round((hoy-new Date(u.fecha+'T00:00:00'))/86400000)};
  }).filter(function(x){ return x.dias>=21; })
    .sort(function(a,b){ return b.total-a.total; }).slice(0,25);

  html+='<div class="caja"><h3>Hace tres semanas que no vienen</h3>';
  if(!dormidos.length) html+='<div class="pie">Ninguno. O el historial todavía es muy corto para saberlo.</div>';
  else{
    html+='<table class="t"><thead><tr><th>Alumno</th><th class="num">Última vez</th>'+
      '<th class="num">Días</th><th class="num">Clases que tuvo</th></tr></thead><tbody>';
    dormidos.forEach(function(x){
      html+='<tr><td>'+esc(x.nombre)+'</td><td class="num">'+esc(fechaCorta(x.fecha))+'</td>'+
        '<td class="num">'+gs(x.dias)+'</td><td class="num">'+gs(x.total)+'</td></tr>';
    });
    html+='</tbody></table><div class="pie">Ordenado por cuántas clases llegó a tener: primero los que más se extrañan.</div>';
  }
  html+='</div>';

  $('pantalla').innerHTML=html;
  engancharMes();
}

/* ============================================================
   SOLAPA PAGO A PROFESORES
   ============================================================ */
/* ============================================================
   EL PERÍODO DEL PAGO A PROFESORES

   Antes solo se podía elegir un MES entero. A los profes no siempre se les paga
   por mes: a veces es por semana, o por una quincena, o por un tramo suelto
   cuando alguien se va. Con el mes como única opción había que sacar la cuenta
   a mano y ahí es donde aparecen los errores.

   Ahora hay dos modos:
   · POR MES     — como siempre, para el cierre mensual.
   · POR FECHAS  — desde el día X hasta el día Y, los dos incluidos.

   El período elegido se escribe arriba de la tabla, y también en el detalle de
   cada profe: un total de pago sin decir de cuándo a cuándo es un número que
   nadie puede revisar después.
   ============================================================ */

var periodo = { modo:'mes', desde:'', hasta:'' };

/* Los días que hay, para poner topes que tengan sentido en el calendario. */
function _rangoDisponible(){
  var f = historial.map(function(h){ return h.fecha; }).sort();
  return { min: f[0] || '', max: f[f.length-1] || '' };
}

/* Las filas del período elegido. Es la ÚNICA puerta: si algún día se agrega
   otro modo, se agrega acá y todas las pantallas lo toman solas. */
function filasDelPeriodo(){
  if(periodo.modo === 'mes') return filasDelMes(mesElegido);
  var d = periodo.desde, h = periodo.hasta;
  return historial.filter(function(x){
    return (!d || x.fecha >= d) && (!h || x.fecha <= h);
  });
}

/* Cómo se llama el período, para que quede escrito en la pantalla y en lo que
   se copie o se imprima. */
function periodoTxt(){
  if(periodo.modo === 'mes') return mesElegido ? mesNombre(mesElegido) : 'todo';
  if(!periodo.desde && !periodo.hasta) return 'todo';
  if(periodo.desde && periodo.hasta){
    return periodo.desde === periodo.hasta
      ? ('el ' + fechaCorta(periodo.desde))
      : ('del ' + fechaCorta(periodo.desde) + ' al ' + fechaCorta(periodo.hasta));
  }
  return periodo.desde ? ('desde el ' + fechaCorta(periodo.desde)) : ('hasta el ' + fechaCorta(periodo.hasta));
}
function fechaCorta(iso){
  var p = String(iso || '').split('-');
  return p.length === 3 ? (Number(p[2]) + '/' + Number(p[1])) : iso;
}

/* Atajos: lo que más se usa es "la semana que pasó". La semana arranca el lunes,
   igual que en el calendario. */
function _lunesDe(iso){
  var p = String(iso).split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1]-1, p[2]));
  var wd = (d.getUTCDay() + 6) % 7;              // 0 = lunes
  d.setUTCDate(d.getUTCDate() - wd);
  return d.toISOString().slice(0,10);
}
function _masDias(iso, n){
  var p = String(iso).split('-').map(Number);
  var d = new Date(Date.UTC(p[0], p[1]-1, p[2]));
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

function selectorPeriodo(){
  var r = _rangoDisponible();
  if(!r.min) return '';
  if(!periodo.desde) periodo.desde = r.min;
  if(!periodo.hasta) periodo.hasta = r.max;

  var h = '<div class="barra">';
  h += '<div class="mesfila" style="margin-bottom:8px">' +
       '<label><input type="radio" name="pModo" value="mes"' + (periodo.modo === 'mes' ? ' checked' : '') + '> Por mes</label>' +
       '<label style="margin-left:14px"><input type="radio" name="pModo" value="fechas"' + (periodo.modo === 'fechas' ? ' checked' : '') + '> Por fechas</label>' +
       '</div>';

  if(periodo.modo === 'mes'){
    h += selectorMes();
  } else {
    h += '<div class="mesfila">' +
         '<input class="sel" id="pDesde" type="date" value="' + esc(periodo.desde) + '" min="' + esc(r.min) + '" max="' + esc(r.max) + '">' +
         '<span style="align-self:center;margin:0 4px">hasta</span>' +
         '<input class="sel" id="pHasta" type="date" value="' + esc(periodo.hasta) + '" min="' + esc(r.min) + '" max="' + esc(r.max) + '">' +
         '</div>' +
         '<div class="mesfila">' +
         '<button class="chico" data-atajo="semana">La semana que pasó</button>' +
         '<button class="chico" data-atajo="estasemana">Esta semana</button>' +
         '<button class="chico" data-atajo="todo">Todo</button>' +
         '</div>';
  }
  h += '</div>';
  return h;
}

function engancharPeriodo(){
  Array.prototype.forEach.call(document.querySelectorAll('input[name=pModo]'), function(r){
    r.onchange = function(){ periodo.modo = r.value; pintar(); };
  });
  if($('pDesde')) $('pDesde').onchange = function(){ periodo.desde = $('pDesde').value; pintar(); };
  if($('pHasta')) $('pHasta').onchange = function(){ periodo.hasta = $('pHasta').value; pintar(); };

  Array.prototype.forEach.call(document.querySelectorAll('button[data-atajo]'), function(b){
    b.onclick = function(){
      var r = _rangoDisponible();
      var hoy = new Date().toISOString().slice(0,10);
      if(b.dataset.atajo === 'todo'){ periodo.desde = r.min; periodo.hasta = r.max; }
      else if(b.dataset.atajo === 'estasemana'){
        periodo.desde = _lunesDe(hoy); periodo.hasta = _masDias(periodo.desde, 6);
      } else {
        var lunPasado = _masDias(_lunesDe(hoy), -7);
        periodo.desde = lunPasado; periodo.hasta = _masDias(lunPasado, 6);
      }
      pintar();
    };
  });
  engancharMes();
}

function pantallaProfes(){
  if(!MESES_HAY.length){ $('pantalla').innerHTML='<div class="vacio">Todavía no hay clases cerradas en el historial.</div>'; return; }
  var filas=filasDelPeriodo();
  var pozo=calcularPozo(filas);
  var lista=Object.keys(pozo.porProfe).map(function(k){ return pozo.porProfe[k]; })
    .sort(function(a,b){ return b.monto-a.monto; });

  var html=selectorPeriodo();
  /* El período va ESCRITO arriba del total. Un monto de pago sin decir de cuándo
     a cuándo es un número que después nadie puede revisar. */
  html+='<div class="cifras">'+
    '<div class="cifra sale"><b>'+gs(pozo.total)+'</b><span>total a pagar · '+esc(periodoTxt())+'</span></div>'+
    '<div class="cifra"><b>'+gs(lista.length)+'</b><span>profesores</span></div>'+
    '<div class="cifra"><b>'+gs(filas.length)+'</b><span>clases en el período</span></div>'+
  '</div>';

  if(pozo.clasesSinTipo) html+='<div class="aviso"><b>'+gs(pozo.clasesSinTipo)+' clases</b> tienen un tipo '+
    'sin aporte cargado y no suman al pozo. Se cargan en <b>Tipos de clase</b>.</div>';

  if(pozo.coach) html+='<div class="aviso"><b>'+gs(pozo.coach)+' clases de coach</b> este mes. '+
    'No entran en la bolsa de la hora: esa plata es del profesor que la dio. '+
    'El cobro y el pago del coach todavía no están hechos.</div>';

  if(pozo.decorativos) html+='<div class="aviso"><b>'+gs(pozo.decorativos)+' casilleros</b> del calendario '+
    '(LIBRE, ALMUERZO, no hay cancha) llegaron al historial como si fueran clases. No se cuentan: '+
    'no son alumnos. Conviene no cargarles un tipo de clase en la grilla.</div>';

  html+='<div class="caja"><table class="t"><thead><tr><th>Profesor</th><th class="num">Horas</th>'+
    '<th class="num">Clases</th><th class="num">Presentes</th><th class="num">A cobrar</th>'+
    '<th></th></tr></thead><tbody>';
  if(!lista.length) html+='<tr><td colspan="6" class="vacio">'+
    (pozo.clasesSinTipo
      ? 'Todavía no se puede calcular: falta cargar el aporte de los tipos de clase.'
      : 'Sin clases este mes.')+'</td></tr>';
  lista.forEach(function(p){
    html+='<tr class="click" data-p="'+esc(p.profe)+'"><td><b>'+esc(p.profe)+'</b>'+(nombreProfe(p.profe)!==p.profe?' <span style="color:var(--suave);font-weight:400">'+esc(nombreProfe(p.profe))+'</span>':'')+'</td>'+
      '<td class="num">'+gs(p.horas)+'</td><td class="num">'+gs(p.clases)+'</td>'+
      '<td class="num">'+gs(p.presentes)+(p.ayudas?' <span class="pin mn">'+p.ayudas+' ayuda(s)</span>':'')+'</td>'+
      '<td class="num"><b>'+gs(p.monto)+'</b></td>'+
      '<td class="num"><button class="chico">Ver el detalle</button></td></tr>';
  });
  html+='</tbody></table><div class="pie">La bolsa de cada hora se arma con los alumnos presentes de las tres '+
    'sedes y se reparte en partes iguales entre los profes que tenían clase esa hora.</div></div>';

  $('pantalla').innerHTML=html;
  engancharPeriodo();
  document.querySelectorAll('tr.click').forEach(function(tr){
    tr.onclick=function(){ abrirProfe(tr.dataset.p, pozo); };
  });
}

function abrirProfe(profe, pozo){
  var hs=Object.keys(pozo.horas).map(function(k){ return pozo.horas[k]; })
    .filter(function(b){ return b.profes[profe] && b.total; })
    .sort(function(a,b){ return (a.fecha+a.hora)<(b.fecha+b.hora)?-1:1; });

  var tot=0; hs.forEach(function(b){ tot+=b.parte; });

  var h='<div class="f-cab"><h2>'+esc(profe)+'</h2><button id="fCerrar">✕</button></div>'+
        '<div class="f-cuerpo">'+
        /* El mismo período que la tabla de arriba, no el mes a secas: si dijeran
           cosas distintas, el detalle no serviría para revisar el total. */
        '<div class="rotulo"><b>'+esc(conMayuscula(periodoTxt()))+'</b> · '+
        gs(hs.length)+' horas trabajadas</div>'+
        '<div class="op bien"><div class="fila1"><span class="et">A cobrar en el período</span>'+
        '<span class="nm">₲ '+gs(tot)+'</span></div></div>'+
        '<table class="t" style="margin-top:12px"><thead><tr><th>Día</th><th>Hora</th>'+
        '<th class="num">Bolsa</th><th class="num">Profes</th><th class="num">Le toca</th></tr></thead><tbody>';
  hs.forEach(function(b){
    h+='<tr><td>'+esc(fechaCorta(b.fecha))+'</td><td>'+esc(b.hora)+'</td>'+
       '<td class="num">'+gs(b.total)+'</td><td class="num">'+Object.keys(b.profes).length+'</td>'+
       '<td class="num">'+gs(b.parte)+'</td></tr>';
  });
  h+='</tbody></table>'+
     '<button class="chico" id="pCopiar" style="width:100%;margin-top:12px">Copiar el detalle</button></div>';

  $('ficha').innerHTML=h;
  $('ficha').classList.add('ancha');
  $('ov').classList.add('show');
  document.body.style.overflow='hidden';
  $('fCerrar').onclick=function(){ $('ficha').classList.remove('ancha'); cerrarFicha(); };
  $('pCopiar').onclick=function(){
    var t=profe+' · '+periodoTxt()+'\n';
    hs.forEach(function(b){
      t+=fechaCorta(b.fecha)+' '+b.hora+' · bolsa '+gs(b.total)+' entre '+
         Object.keys(b.profes).length+' → '+gs(b.parte)+'\n';
    });
    t+='TOTAL: '+gs(tot)+' Gs.';
    navigator.clipboard.writeText(t).then(function(){ toast('Detalle copiado'); },
      function(){ toast('No pude copiar'); });
  };
}

/* ============================================================
   SOLAPA TIPOS DE CLASE

   La lista NO está escrita a mano: sale de los tipos que aparecen de verdad en
   el historial. Si mañana aparece un tipo nuevo, aparece acá solo, marcado como
   sin aporte, y los informes avisan. Una casa por dato: el aporte vive
   únicamente en tipos_v1.
   ============================================================ */
function pantallaTipos(){
  var uso={};
  historial.forEach(function(h){
    var t=(h.tipo||'').trim()||'(sin tipo)';
    if(!uso[t]) uso[t]={tipo:t, clases:0};
    uso[t].clases++;
  });
  Object.keys(tipos).forEach(function(k){ if(!uso[k]) uso[k]={tipo:k, clases:0}; });
  var lista=Object.keys(uso).map(function(k){ return uso[k]; })
    .sort(function(a,b){ return b.clases-a.clases; });

  var html='<div class="aviso">Acá se carga <b>cuánto aporta cada tipo de clase al pozo de los profesores</b>. '+
    'No es lo que paga el alumno: eso vive en el padrón, alumno por alumno. Son dos números distintos para la misma clase.</div>';

  html+='<div class="caja"><h3>Tipos que aparecen en el historial</h3>';
  if(!lista.length) html+='<div class="pie">Todavía no hay clases cerradas.</div>';
  lista.forEach(function(t){
    var k=claveTipo(t.tipo);
    var val=tipos[k]&&tipos[k].aporte?tipos[k].aporte:'';
    html+='<div class="tipoFila"><div class="nom">'+esc(t.tipo)+
      '<div class="uso">'+gs(t.clases)+' clases en el historial</div></div>'+
      '<input type="text" inputmode="numeric" data-t="'+esc(k)+'" value="'+esc(val?gs(val):'')+
      '" placeholder="0"'+(puedeEditar?'':' disabled')+'>'+
      ((puedeEditar && !t.clases)?'<button class="quitarTipo" data-q="'+esc(k)+'" title="Quitar este tipo">✕</button>':'')+
      '</div>';
  });
  if(puedeEditar){
    html+='<div class="agregarTipo">'+
      '<div class="tit">Agregar un tipo que todavía no aparece</div>'+
      '<div class="fila">'+
        '<input type="text" id="tNombre" placeholder="Nombre del tipo, igual que en el calendario">'+
        '<input type="text" inputmode="numeric" id="tMonto" placeholder="Aporte">'+
        '<button class="chico" id="tAgregar">Agregar</button>'+
      '</div>'+
      '<div class="pie" style="margin-top:8px">El nombre tiene que escribirse <b>exactamente igual</b> a como '+
      'aparece en el calendario, o la clase no va a encontrar su aporte.</div>'+
    '</div>';
  }
  if(lista.length && puedeEditar) html+='<button class="pri" id="tGuardar" style="margin-top:14px">Guardar los aportes</button>';
  if(lista.length && !puedeEditar) html+='<div class="pie" style="margin-top:12px">Tu permiso de Caja es solo de lectura: '+
    'ves los aportes pero no podés cambiarlos.</div>';
  html+='<div class="pie">Se guarda en Firebase, en <b>tipos_v1</b>. Es el único dato que nace en esta app.</div></div>';

  $('pantalla').innerHTML=html;

  if($('tAgregar')) $('tAgregar').onclick=function(){
    var nom=($('tNombre').value||'').trim();
    var monto=+soloDigitos($('tMonto').value)||0;
    if(!nom){ toast('Ponele un nombre al tipo'); return; }
    var k=claveTipo(nom);
    if(tipos[k]){ toast('Ese tipo ya está en la lista'); return; }
    tipos[k]={ aporte:monto, ts:Date.now(), por:miCorreo };
    pantallaTipos();
    toast('Agregado. Acordate de guardar.');
  };
  document.querySelectorAll('.quitarTipo').forEach(function(b){
    b.onclick=function(){
      if(!confirm('¿Quitar el tipo "'+b.dataset.q+'"? No tiene clases en el historial.')) return;
      delete tipos[b.dataset.q]; pantallaTipos();
    };
  });

  if($('tGuardar')) $('tGuardar').onclick=function(){
    var datos={};
    document.querySelectorAll('input[data-t]').forEach(function(i){
      var v=+soloDigitos(i.value)||0;
      if(v) datos[i.dataset.t]={ aporte:v, ts:Date.now(), por:miCorreo };
    });
    $('tGuardar').disabled=true;
    firebase.database().ref('tipos_v1').set(datos).then(function(){
      tipos=datos; $('tGuardar').disabled=false;
      toast('Aportes guardados');
      anotarOp('tipos','Se actualizaron los aportes de '+Object.keys(datos).length+' tipos de clase');
      pintar();
    }).catch(function(e){
      $('tGuardar').disabled=false;
      alert('No se pudo guardar en Firebase.\n\n'+e.message+
        '\n\nSi dice que no tenés permiso, falta agregarle el cajón tipos_v1 a las reglas de Firebase.');
    });
  };
}

function anotarOp(tipo, detalle){
  try{
    var hoy=new Date();
    var dia=hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');
    firebase.database().ref('ops_v1/'+dia).push({
      tipo:tipo, alumno:'—', detalle:detalle,
      porCorreo:miCorreo, porNombre:miNombre||miCorreo, ts:Date.now()
    }).catch(function(){});
  }catch(e){}
}

/* ============================================================
   SOLAPA PARA CORREGIR

   No es una lista cargada a mano ni un archivo aparte: se calcula cada vez,
   cruzando el historial contra el padrón. El que se corrige en la app de
   Alumnos desaparece de acá solo.
   ============================================================ */
function calcularCorregir(){
  var porAlumno={}, tiposSinAporte={};
  historial.forEach(function(h){
    if(esAyudante(h) || esBloque(h.alumno)) return;   // el ayudante y los bloques no son alumnos
    if(esCoach(h)) return;                            // el coach no se cobra por precio de ficha
    var f=fichaDe(h);
    var k=f?(f.id||keyAlumno(f.nombre)):('?'+keyAlumno(h.alumno));
    if(!porAlumno[k]) porAlumno[k]={ nombre:f?f.nombre:h.alumno, ficha:f, clases:0, cobrables:0, tipos:{} };
    var a=porAlumno[k];
    a.clases++;
    if(h.seCobra) a.cobrables++;
    if(h.tipo) a.tipos[h.tipo]=(a.tipos[h.tipo]||0)+1;
    if(h.presente && !aporteDe(h.tipo)){
      var t=(h.tipo||'').trim()||'(sin tipo)';
      tiposSinAporte[t]=(tiposSinAporte[t]||0)+1;
    }
  });

  var items=[];
  Object.keys(porAlumno).forEach(function(k){
    var a=porAlumno[k], f=a.ficha, motivos=[];
    if(!f) motivos.push({txt:'no está en el padrón', grave:true});
    else{
      if(f.beca){ /* becado: el cero es a propósito, no falta ningún dato */ }
      else if(!f.precio) motivos.push({txt:'sin precio cargado', grave:true});
      else if(f.precio>TOPE_ABONO) motivos.push({txt:'abono mensual ('+gs(f.precio)+') en la casilla del precio por clase', grave:false});
      if(!f.tipo) motivos.push({txt:'sin tipo de clase', grave:false});
      var tr=telRaro(f.tel);
      if(tr) motivos.push({txt: tr==='sin teléfono' ? 'sin teléfono' : ('teléfono: '+tr+' ('+f.telCrudo+')'), grave:false});
    }
    if(Object.keys(a.tipos).length>1)
      motivos.push({txt:'hace '+Object.keys(a.tipos).length+' tipos de clase y el padrón tiene un solo precio', grave:false});
    if(!motivos.length) return;
    items.push({ nombre:a.nombre, ficha:f, clases:a.clases, cobrables:a.cobrables, motivos:motivos,
                 grave: motivos.some(function(m){ return m.grave; }) });
  });
  items.sort(function(a,b){
    if(a.grave!==b.grave) return a.grave?-1:1;
    return b.cobrables-a.cobrables;
  });
  return { items:items, tiposSinAporte:tiposSinAporte };
}

function contarCorregir(){
  var c=calcularCorregir();
  var n=c.items.length+Object.keys(c.tiposSinAporte).length;
  $('nCorregir').textContent=n?'· '+n:'';
}

/* ============================================================
   BORRAR EL HISTORIAL — la zona peligrosa

   Para qué: poder empezar de cero, o sacar un tramo de días que quedó mal.

   Esto borra el registro contable de la academia: lo que se le cobra a cada
   alumno y lo que se le paga a cada profe. Por eso tiene tres candados y una
   red abajo:

   1. Solo lo ve un ADMINISTRADOR. No alcanza con tener el permiso de Caja.
   2. Pide una CLAVE, que vive en Firebase (usuarios/<tu correo>/claveBorrado),
      NO en este archivo. El repo es público: una clave escrita acá la leería
      cualquiera desde GitHub. Cada admin tiene la suya y la define la primera
      vez que entra.
   3. Hay que escribir la palabra BORRAR a mano. Un toque sin querer no alcanza.

   Y LA RED: antes de borrar se guarda una copia entera en
   historial_borrados/<momento>. Si te arrepentís, está ahí. No se borra sola.
   ============================================================ */

var _claveBorrado = null;      // la de este admin, leída de Firebase
/* El resultado del último borrado se guarda acá y lo vuelve a dibujar la
   pantalla. Si viviera solo en el cartel de abajo se perdería enseguida: al
   borrar cambian los datos, el escucha de Firebase repinta y se lleva puesto el
   mensaje — justo el que dice DÓNDE quedó la copia, que es lo que necesitás si
   te arrepentís. */
var _ultimoBorrado = null;

function _clavePath(){ return 'usuarios/' + aClave(miCorreo) + '/claveBorrado'; }

function cargarClaveBorrado(){
  return firebase.database().ref(_clavePath()).once('value')
    .then(function(s){ _claveBorrado = s.val() || null; })
    .catch(function(){ _claveBorrado = null; });
}

/* Los días que hay guardados, para mostrar qué se va a borrar antes de hacerlo. */
function diasDelHistorial(){
  var dias = {};
  historial.forEach(function(h){ dias[h.fecha] = (dias[h.fecha] || 0) + 1; });
  return Object.keys(dias).sort().map(function(f){ return { fecha:f, filas:dias[f] }; });
}

function pantallaBorrar(){
  if(!esAdminCaja){
    return '<div class="caja"><div class="vacio">Esta parte es solo para administradores.</div></div>';
  }
  var dias = diasDelHistorial();
  var totalFilas = historial.length;
  var h = '<div class="caja peligro">';
  h += '<h3 style="margin:0 0 6px">🗑️ Borrar el historial</h3>';
  h += '<p class="pie" style="margin:0 0 12px">Esto borra el registro de clases del que salen los cobros y el pago a los profesores. ' +
       'Antes de borrar se guarda una copia completa, por las dudas.</p>';

  if(_ultimoBorrado){
    h += '<div class="aviso"><b class="verde">Último borrado:</b> ' + gs(_ultimoBorrado.dias) + ' día(s), ' +
         esc(_ultimoBorrado.cuando) + '.<br>La copia quedó en <code>historial_borrados/' +
         esc(_ultimoBorrado.sello) + '</code> — de ahí se puede volver atrás.</div>';
  }

  if(!dias.length){
    h += '<div class="vacio">No hay nada guardado para borrar.</div></div>';
    return h;
  }

  h += '<div class="cifras"><div class="cifra"><b>' + gs(dias.length) + '</b><span>días guardados</span></div>' +
       '<div class="cifra"><b>' + gs(totalFilas) + '</b><span>clases en total</span></div>' +
       '<div class="cifra"><b>' + esc(dias[0].fecha) + '</b><span>el más viejo</span></div>' +
       '<div class="cifra"><b>' + esc(dias[dias.length-1].fecha) + '</b><span>el más nuevo</span></div></div>';

  if(!_claveBorrado){
    h += '<div class="aviso"><b>Todavía no definiste tu clave de borrado.</b> ' +
         'Es una clave aparte de la de tu cuenta, solo para esto. Se guarda en tu ficha de usuario.' +
         '<div class="mesfila" style="margin-top:8px">' +
         '<input class="sel" id="bClaveNueva" type="password" placeholder="Elegí una clave (mínimo 6)" autocomplete="new-password">' +
         '<button class="chico" id="bDefinir">Guardar mi clave</button></div></div>';
    h += '</div>';
    return h;
  }

  h += '<div class="mesfila" style="margin-bottom:10px">' +
       '<label><input type="radio" name="bModo" value="todo" checked> Borrar <b>TODO</b></label>' +
       '<label style="margin-left:14px"><input type="radio" name="bModo" value="rango"> Borrar <b>desde / hasta</b></label>' +
       '</div>';

  h += '<div class="mesfila" id="bRango" style="display:none;margin-bottom:10px">' +
       '<input class="sel" id="bDesde" type="date" value="' + esc(dias[0].fecha) + '">' +
       '<span style="margin:0 6px">hasta</span>' +
       '<input class="sel" id="bHasta" type="date" value="' + esc(dias[dias.length-1].fecha) + '">' +
       '</div>';

  h += '<div id="bResumen" class="aviso"></div>';

  h += '<div class="mesfila">' +
       '<input class="sel" id="bClave" type="password" placeholder="Tu clave de borrado" autocomplete="off">' +
       '<input class="sel" id="bPalabra" placeholder="Escribí BORRAR" autocomplete="off" style="margin-left:6px">' +
       '<button class="chico malo" id="bHacer" style="margin-left:6px">Borrar</button>' +
       '</div>';

  h += '<div id="bSalida" class="pie" style="margin-top:10px"></div>';
  h += '</div>';
  return h;
}

/* Qué días caen en lo elegido. Se calcula siempre antes de borrar, y es lo
   mismo que se le muestra al usuario: nunca se borra algo que no se mostró. */
function diasElegidosParaBorrar(){
  var modo = (document.querySelector('input[name=bModo]:checked') || {}).value || 'todo';
  var dias = diasDelHistorial();
  if(modo === 'todo') return { modo:modo, dias:dias };
  var d = ($('bDesde') || {}).value || '';
  var hs = ($('bHasta') || {}).value || '';
  return { modo:modo, desde:d, hasta:hs,
           dias: dias.filter(function(x){ return (!d || x.fecha >= d) && (!hs || x.fecha <= hs); }) };
}

function pintarResumenBorrado(){
  var r = diasElegidosParaBorrar();
  var el = $('bResumen'); if(!el) return;
  var filas = r.dias.reduce(function(s,x){ return s + x.filas; }, 0);
  if(!r.dias.length){ el.innerHTML = 'No hay ningún día en ese rango. No se va a borrar nada.'; return; }
  el.innerHTML = 'Se van a borrar <b>' + gs(r.dias.length) + ' día(s)</b> y <b>' + gs(filas) + ' clases</b>' +
    (r.modo === 'rango' ? (' — del ' + esc(r.dias[0].fecha) + ' al ' + esc(r.dias[r.dias.length-1].fecha)) : ' — TODO el historial') + '.';
}

function engancharBorrar(){
  if(!esAdminCaja) return;

  var def = $('bDefinir');
  if(def){
    def.onclick = function(){
      var v = ($('bClaveNueva').value || '').trim();
      if(v.length < 6){ alert('Poné una clave de al menos 6 caracteres.'); return; }
      def.disabled = true; def.textContent = 'Guardando…';
      firebase.database().ref(_clavePath()).set(v).then(function(){
        _claveBorrado = v;
        alert('Clave guardada. Ya podés usar el borrado.');
        pintar();
      }).catch(function(e){
        def.disabled = false; def.textContent = 'Guardar mi clave';
        alert('No pude guardar la clave:\n\n' + e.message);
      });
    };
    return;
  }

  Array.prototype.forEach.call(document.querySelectorAll('input[name=bModo]'), function(r){
    r.onchange = function(){
      var esRango = (document.querySelector('input[name=bModo]:checked') || {}).value === 'rango';
      if($('bRango')) $('bRango').style.display = esRango ? '' : 'none';
      pintarResumenBorrado();
    };
  });
  if($('bDesde')) $('bDesde').onchange = pintarResumenBorrado;
  if($('bHasta')) $('bHasta').onchange = pintarResumenBorrado;
  pintarResumenBorrado();

  var btn = $('bHacer'); if(!btn) return;
  btn.onclick = function(){
    var salida = $('bSalida');
    var clave = ($('bClave').value || '');
    var palabra = ($('bPalabra').value || '').trim().toUpperCase();

    if(clave !== _claveBorrado){ salida.innerHTML = '<b class="rojo">La clave no es correcta.</b>'; return; }
    if(palabra !== 'BORRAR'){ salida.innerHTML = '<b class="rojo">Escribí la palabra BORRAR para confirmar.</b>'; return; }

    var r = diasElegidosParaBorrar();
    if(!r.dias.length){ salida.innerHTML = '<b class="rojo">No hay días para borrar.</b>'; return; }
    var filas = r.dias.reduce(function(s,x){ return s + x.filas; }, 0);

    if(!confirm('Vas a borrar ' + r.dias.length + ' día(s) y ' + filas + ' clases.\n\n' +
                (r.modo === 'rango' ? ('Del ' + r.dias[0].fecha + ' al ' + r.dias[r.dias.length-1].fecha) : 'TODO el historial') +
                '\n\nSe guarda una copia antes de borrar. ¿Sigo?')) return;

    btn.disabled = true; btn.textContent = 'Borrando…';
    salida.innerHTML = 'Guardando la copia de respaldo…';

    var ref = firebase.database().ref('historial_v2');
    ref.once('value').then(function(s){
      var todo = s.val() || {};
      var copia = {};
      r.dias.forEach(function(d){ if(todo[d.fecha]) copia[d.fecha] = todo[d.fecha]; });
      var sello = new Date().toISOString().replace(/[:.]/g, '-');
      return firebase.database().ref('historial_borrados/' + sello).set({
        cuando: new Date().toISOString(),
        porCorreo: miCorreo,
        modo: r.modo,
        dias: r.dias.map(function(d){ return d.fecha; }),
        datos: copia
      }).then(function(){ return sello; });
    }).then(function(sello){
      salida.innerHTML = 'Copia guardada. Borrando…';
      /* Una sola escritura con todos los días en null: o se borran todos o no se
         borra ninguno. Borrarlos de a uno podía dejar la mitad hecha. */
      var upd = {};
      r.dias.forEach(function(d){ upd[d.fecha] = null; });
      return ref.update(upd).then(function(){ return sello; });
    }).then(function(sello){
      btn.disabled = false; btn.textContent = 'Borrar';
      if($('bClave')) $('bClave').value = '';
      if($('bPalabra')) $('bPalabra').value = '';
      _ultimoBorrado = { sello: sello, dias: r.dias.length,
                         cuando: new Date().toLocaleString('es-PY') };
      salida.innerHTML = '<b class="verde">Listo: se borraron ' + gs(r.dias.length) + ' día(s).</b><br>' +
        'La copia quedó en <code>historial_borrados/' + esc(sello) + '</code> por si hace falta volver atrás.';
      try{ pintar(); }catch(e){}
    }).catch(function(e){
      btn.disabled = false; btn.textContent = 'Borrar';
      salida.innerHTML = '<b class="rojo">No se pudo borrar: ' + esc(e.message) + '</b><br>' +
        'No se tocó nada: el borrado va después de la copia, y la copia falló.';
    });
  };
}

function pantallaCorregir(){
  var c=calcularCorregir();
  var graves=c.items.filter(function(x){ return x.grave; });
  var clasesGraves=graves.reduce(function(s,x){ return s+x.cobrables; },0);

  var html='<div class="cifras">'+
    '<div class="cifra malo"><b>'+gs(graves.length)+'</b><span>alumnos que no se pueden cobrar</span></div>'+
    '<div class="cifra malo"><b>'+gs(clasesGraves)+'</b><span>clases colgadas por eso</span></div>'+
    '<div class="cifra"><b>'+gs(c.items.length)+'</b><span>para revisar en total</span></div>'+
  '</div>';

  var tsa=Object.keys(c.tiposSinAporte);
  if(tsa.length){
    html+='<div class="caja"><h3>Tipos de clase sin aporte cargado</h3>'+
      '<table class="t"><thead><tr><th>Tipo</th><th class="num">Clases que no suman al pozo</th></tr></thead><tbody>';
    tsa.sort(function(a,b){ return c.tiposSinAporte[b]-c.tiposSinAporte[a]; }).forEach(function(t){
      html+='<tr><td>'+esc(t)+'</td><td class="num">'+gs(c.tiposSinAporte[t])+'</td></tr>';
    });
    html+='</tbody></table><div class="pie">Se cargan en la solapa <b>Tipos de clase</b>. '+
      'Mientras estén en cero, el pago a profesores sale corto.</div></div>';
  }

  /* ============================================================
     BLOQUES DE ALTO RENDIMIENTO SIN ALUMNOS ADENTRO

     Esto no se veía en ningún lado y mueve plata todos los días. El profe que
     tiene el bloque cobra su parte de esa hora, pero como al bloque nadie le
     cargó los alumnos, no aporta nada al pozo: esa parte sale de los otros
     profes que sí lo llenaron.

     No se cambia el reparto —el profe SÍ trabajó esa hora— pero se muestra, con
     nombre y monto, para que se pueda arreglar cargando los alumnos.
     ============================================================ */
  var pz=calcularPozo(historial);
  if(pz.arVacios){
    var desv=pz.arDesvio||{};
    var pierden=Object.keys(desv).filter(function(p){ return desv[p]>0; })
                       .sort(function(a,b){ return desv[b]-desv[a]; });
    var ganan=Object.keys(desv).filter(function(p){ return desv[p]<0; })
                       .sort(function(a,b){ return desv[a]-desv[b]; });
    var movido=pierden.reduce(function(s,p){ return s+desv[p]; },0);
    html+='<div class="caja"><h3>Bloques de Alto Rendimiento sin alumnos cargados</h3>'+
      '<div class="aviso"><b>'+gs(pz.arVacios)+' bloque(s)</b> ocupan una hora de un profesor y '+
      'no aportan nada al pozo, porque nadie les cargó los alumnos adentro.'+
      (movido>=1 ? ' Eso mueve <b>'+gs(Math.round(movido))+' Gs</b> desde los demás profesores hacia ellos.' : '')+
      '</div>';
    if(ganan.length || pierden.length){
      html+='<table class="t"><thead><tr><th>Profesor</th><th class="num">Bloques vacíos</th>'+
        '<th class="num">Cobra de más / de menos</th></tr></thead><tbody>';
      ganan.concat(pierden).forEach(function(p){
        var n=(pz.arVaciosPorProfe||{})[p]||0;
        html+='<tr><td>'+esc(nombreProfe(p))+'</td><td class="num">'+(n||'—')+'</td>'+
          '<td class="num">'+(desv[p]<0?'+':'−')+gs(Math.abs(Math.round(desv[p])))+'</td></tr>';
      });
      html+='</tbody></table>';
    }
    html+='<div class="pie">Se arregla cargando los alumnos en la app de <b>Alto rendimiento</b>, y '+
      'recién después el aporte de <b>AR60</b> y <b>AR30</b> acá en Tipos de clase. En ese orden: '+
      'al revés no cambia nada, porque las filas de esos alumnos todavía no existen.</div></div>';
  }

  html+='<div class="caja"><h3>Alumnos</h3>';
  if(!c.items.length) html+='<div class="pie">No hay nada para corregir.</div>';
  else{
    html+='<table class="t"><thead><tr><th>Alumno</th><th class="num">Clases</th>'+
      '<th class="num">Cobrables</th><th>Qué le falta</th></tr></thead><tbody>';
    c.items.forEach(function(x){
      html+='<tr><td>'+esc(x.nombre)+'</td><td class="num">'+gs(x.clases)+'</td>'+
        '<td class="num">'+gs(x.cobrables)+'</td><td>'+
        x.motivos.map(function(m){ return '<span class="pin '+(m.grave?'no':'sp')+'">'+esc(m.txt)+'</span>'; }).join(' ')+
        (x.ficha && puedeEditar
          ? '<div class="arreglo">'+
              '<input class="cPrecio" data-n="'+esc(x.nombre)+'" placeholder="precio o BECA" value="'+
                 esc(x.ficha.beca?'BECA':(x.ficha.precio?gs(x.ficha.precio):''))+'">'+
              '<input class="cTipo" data-n="'+esc(x.nombre)+'" placeholder="tipo" value="'+esc(x.ficha.tipo||'')+'">'+
              '<button class="chico cGuardar" data-n="'+esc(x.nombre)+'">Guardar</button>'+
            '</div>'
          : '')+
        '</td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='<div class="pie">Los rojos son los que hoy no se pueden cobrar. Todo esto se arregla en la '+
    '<b>app de Alumnos</b>, que es donde vive el padrón: acá desaparecen solos cuando se corrigen. '+
    'Ordenado por clases cobrables, no alfabético: primero lo que más plata mueve.</div></div>';

  $('pantalla').innerHTML=html;

  document.querySelectorAll('.cGuardar').forEach(function(b){
    b.onclick=function(){
      var nom=b.dataset.n;
      var pr=document.querySelector('.cPrecio[data-n="'+CSS.escape(nom)+'"]');
      var tp=document.querySelector('.cTipo[data-n="'+CSS.escape(nom)+'"]');
      var it=c.items.filter(function(z){ return z.nombre===nom; })[0];
      if(!it || !it.ficha) return;
      if(!(pr.value||'').trim() && !(tp.value||'').trim()){ toast('Poné un precio o un tipo'); return; }
      b.disabled=true; b.textContent='Guardando…';
      corregirAlumno(it.ficha, pr.value, tp.value).then(function(){
        b.disabled=false; b.textContent='Guardar';
        toast('Guardado en la planilla');
        pintar();
      }).catch(function(e){
        b.disabled=false; b.textContent='Guardar';
        alert('No se pudo guardar.\n\n'+(e.message||''));
      });
    };
  });

  /* La zona de borrado vive al final de "Para corregir", que es la pantalla de
     mantenimiento. No es una solapa aparte a propósito: no tiene que estar a un
     toque de distancia. */
  if(esAdminCaja){
    $('pantalla').insertAdjacentHTML('beforeend', pantallaBorrar());
    try{ engancharBorrar(); }catch(e){ console.warn('borrado:', e.message); }
  }
}

    .catch(function(e){ $('errLogin').textContent=e.message; });
};
$('btnSalir').onclick=function(e){ e.preventDefault(); firebase.auth().signOut(); };
$('btnSalir2').onclick=function(){ firebase.auth().signOut(); };

/* Nada que lea Firebase corre antes del login. */
firebase.auth().onAuthStateChanged(function(u){
  if(!u){ $('login').style.display='flex'; $('nopuede').style.display='none'; $('app').style.display='none'; return; }
  miCorreo=u.email.toLowerCase();
  firebase.database().ref('usuarios/'+aClave(miCorreo)).once('value').then(function(s){
    var f=s.val()||{}, p=f.permisos||{};
    /* Permiso propio `caja`. El administrador entra siempre.
       · escribir → además puede cargar los aportes de los tipos de clase
       · leer     → ve todo, no toca nada
       Esto es plata: quien no lo tenga declarado no entra, aunque tenga otros permisos. */
    var esAdmin = (p.admin===true);
    esAdminCaja = esAdmin;
    var nivel = esAdmin ? 'escribir' : ((p.caja==='escribir'||p.caja==='leer') ? p.caja : '');
    if(f.activo!==true || !nivel){
      $('login').style.display='none';
      $('nopuedeTxt').textContent=miCorreo+'\n\nNo tenés el permiso de Caja.\nPedíselo a José desde el panel de Accesos.';
      $('nopuede').style.display='flex';
      return;
    }
    puedeEditar = (nivel==='escribir');
    miNombre=f.nombre||'';
    $('login').style.display='none'; $('nopuede').style.display='none';
    $('app').style.display='block';
    $('yoMail').textContent=miCorreo;
    Promise.all([cargarPadron(), cargarHistorial(), cargarTipos(), cargarVivo(), cargarColumnas(), cargarNombres(), cargarClaveBorrado()]).then(function(){
      /* La planilla se recupera ANTES de armar los alumnos: si quedo cargada de
         antes, entra en el mismo armado y no hace falta volver a elegir el archivo. */
      planRecuperar();
      armarAlumnos();
      leidoTs=Date.now();
      $('cargando').style.display='none';
      $('rango').textContent = historial.length
        ? gs(historial.length)+' clases en el historial · '+
          (MESES_HAY.length?mesNombre(MESES_HAY[0])+' a '+mesNombre(MESES_HAY[MESES_HAY.length-1]):'')
        : 'todavía sin clases cerradas';
      pintarFrescura();
      pintar();
      planEnganchar(); planPintarBarra();
      escucharTodo();          // de acá en adelante, lo que cambie llega solo
    });
    $('btnRefrescar').onclick=refrescar;
  }).catch(function(e){
    $('login').style.display='none';
    $('nopuedeTxt').textContent='No se pudo verificar tu acceso. '+e.message;
    $('nopuede').style.display='flex';
  });
});
</script>

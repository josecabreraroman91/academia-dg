<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja · Academia DG</title>
<style>
  :root{
    --fondo:#eef3f6; --tarjeta:#ffffff; --linea:#dbe4ea;
    --texto:#17262f; --suave:#6a7f8b;
    --teal:#0e7c9e; --teal-osc:#0a5c75; --teal-claro:#e3f1f6;
    --verde:#15803d; --verde-claro:#e8f5ec;
    --rojo:#b42318; --rojo-claro:#fdecea; --ambar:#8a5a00; --ambar-claro:#fdf3e2;
    --violeta:#5b3a86; --violeta-claro:#ede4f7;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--fondo);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 80px}
  h1{font-size:24px;margin:0 0 2px;letter-spacing:-.4px}
  .sub{color:var(--suave);font-size:13.5px}
  .yo{color:var(--suave);font-size:12px;margin:4px 0 10px}
  .yo a{color:var(--teal);text-decoration:none;margin-left:10px}

  .frescura{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--tarjeta);
    border:1px solid var(--linea);border-radius:11px;padding:8px 12px;margin-bottom:16px;
    font-size:12.5px;color:var(--suave)}
  .frescura .txt{flex:1;min-width:150px}
  .frescura .txt b{color:var(--texto);font-weight:600}
  .frescura .viejo{color:var(--ambar);font-weight:600}

  button{font-family:inherit;font-size:14px;padding:10px 18px;border-radius:9px;
    border:1px solid var(--linea);background:var(--tarjeta);color:var(--texto);cursor:pointer}
  button:hover{border-color:var(--suave)}
  button.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
  button.pri:hover{background:var(--teal-osc)}
  button.chico{font-size:12.5px;padding:6px 12px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ---- Solapas ---- */
  .planBarra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;
    padding:10px 13px;border:1px solid var(--linea);border-radius:11px;background:#fbfcfd}
  .planBarra .planTxt{font-size:12.5px;color:var(--suave);flex:1;min-width:220px}
  .planBarra .planTxt b{color:var(--texto)}
  .planBarra .planAviso{color:var(--malo,#b45309);font-weight:600}
  .solapas{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .solapas button{font-size:13.5px;padding:8px 15px;border-radius:20px}
  .solapas button.on{border-color:var(--teal);background:var(--teal-claro);
    color:var(--teal-osc);font-weight:700}
  .solapas button b{opacity:.65;font-weight:600;margin-left:4px}

  /* ---- Cifras de arriba ---- */
  .cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
  .cifra{background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
  .cifra b{display:block;font-size:23px;font-weight:600;line-height:1.15;letter-spacing:-.5px}
  .cifra span{font-size:12px;color:var(--suave)}
  .cifra.entra b{color:var(--verde)}
  .cifra.sale b{color:var(--ambar)}
  .cifra.queda b{color:var(--teal)}
  .cifra.malo b{color:var(--rojo)}

  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .barra input{flex:1;min-width:190px;background:var(--tarjeta);border:1px solid var(--linea);
    border-radius:10px;padding:11px 14px;font-family:inherit;font-size:15px;color:var(--texto)}
  .barra input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-claro)}
  select.sel{font-family:inherit;font-size:14.5px;font-weight:600;padding:10px 12px;
    border:1px solid var(--linea);border-radius:10px;background:var(--tarjeta);
    color:var(--texto);text-transform:capitalize;cursor:pointer}
  select.sel:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-claro)}

  .aviso{border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:13px;
    background:var(--ambar-claro);border:1px solid #eccf9a;color:var(--ambar)}
  .aviso b{color:#6b4600}

  /* ---- La tabla alumno × mes ---- */
  .tabla{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;overflow-x:auto}
  .tgrid{display:grid;min-width:max-content}
  .th,.td{padding:9px 8px;border-bottom:1px solid var(--linea);display:flex;align-items:center}
  .th{position:sticky;top:0;background:var(--tarjeta);font-size:11px;font-weight:700;color:var(--suave);
    letter-spacing:.4px;text-transform:uppercase;justify-content:center;
    border-bottom:2px solid var(--linea);z-index:2}
  .th.nomh{justify-content:flex-start;padding-left:16px}
  .td.nomc{padding-left:16px;font-size:14.5px;font-weight:500;position:sticky;left:0;
    background:var(--tarjeta);z-index:1;gap:7px;flex-wrap:wrap}
  .td.mesc{justify-content:center;padding:6px 8px}
  .tgrid>.fin{border-bottom:0}
  .cnt{min-width:46px;padding:7px 9px;border-radius:9px;border:1px solid transparent;
    background:var(--teal-claro);color:var(--teal-osc);font-family:inherit;font-size:15px;
    font-weight:700;cursor:pointer;line-height:1.1;text-align:center}
  .cnt:hover{border-color:var(--teal);background:#d2e9f1}
  .cnt small{display:block;font-size:9.5px;font-weight:500;opacity:.75}
  .sin{color:#c3ced5;font-size:15px;user-select:none}
  .pin{font-size:9.5px;padding:2px 6px;border-radius:20px;font-weight:700;white-space:nowrap}
  .pin.no{background:var(--rojo-claro);color:var(--rojo)}
  .pin.sp{background:var(--ambar-claro);color:var(--ambar)}
  .pin.mn{background:var(--violeta-claro);color:var(--violeta)}
  .pin.tl{background:#eceff1;color:var(--suave)}
  #masBtn{width:100%;margin-top:10px}
  .vacio{text-align:center;color:var(--suave);padding:40px 16px;font-size:14.5px}

  /* ---- Tablas comunes (informes, profes, corregir) ---- */
  .caja{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;
    padding:15px 16px;margin-bottom:14px}
  .caja h3{margin:0 0 10px;font-size:15px}
  .caja .pie{color:var(--suave);font-size:12px;margin-top:10px}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px}
  table.t th{text-align:left;color:var(--suave);font-size:11px;font-weight:700;letter-spacing:.4px;
    text-transform:uppercase;padding:7px 8px;border-bottom:2px solid var(--linea);white-space:nowrap}
  table.t td{padding:9px 8px;border-bottom:1px solid var(--linea)}
  table.t tr:last-child td{border-bottom:0}
  table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover td{background:var(--teal-claro)}
  .neg{color:var(--rojo)}

  /* ---- La ficha del alumno ---- */
  #ov{position:fixed;inset:0;z-index:50;background:rgba(15,35,45,.45);display:none;
    align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
  #ov.show{display:flex}
  .ficha{background:var(--tarjeta);border-radius:16px;width:100%;max-width:470px;
    box-shadow:0 18px 50px rgba(10,50,65,.22);overflow:hidden;margin:auto}
  .ficha.ancha{max-width:620px}
  .f-cab{padding:15px 16px 12px;display:flex;align-items:center;gap:8px}
  .f-cab h2{margin:0;font-size:19px;letter-spacing:-.3px;flex:1;min-width:0}
  .f-cab button{padding:5px 9px;font-size:15px;line-height:1;color:var(--suave)}
  .f-cuerpo{padding:0 16px 18px}
  .mesfila{display:flex;gap:7px;align-items:stretch;margin-bottom:10px}
  /* La zona de borrado va con marco rojo: que se vea distinta del resto y que
     nadie la confunda con una pantalla más. */
  .caja.peligro{border:2px solid var(--rojo);margin-top:18px}
  button.chico.malo{background:var(--rojo);color:#fff;border-color:var(--rojo)}
  .rojo{color:var(--rojo)} .verde{color:var(--verde,#1a7f37)}
  .mesfila .sel{flex:1}
  .masmes{width:42px;padding:0;font-size:19px;font-weight:700;color:var(--teal);line-height:1}
  .masmes:hover{border-color:var(--teal);background:var(--teal-claro)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-claro);
    color:var(--teal-osc);border:1px solid #bfdfea;border-radius:20px;padding:4px 6px 4px 11px;
    font-size:12px;font-weight:600;text-transform:capitalize}
  .chip button{all:unset;cursor:pointer;font-size:13px;line-height:1;padding:0 4px;color:var(--teal-osc)}
  .chip button:hover{color:var(--rojo)}
  .chipAdd{background:var(--tarjeta);border:1px dashed var(--linea);border-radius:20px;
    padding:4px 11px;font-size:12px;color:var(--suave);cursor:pointer;text-transform:capitalize}
  .chipAdd:hover{border-color:var(--teal);color:var(--teal)}
  .diasMes{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;
    letter-spacing:.4px;margin:9px 0 6px;width:100%}
  .rotulo{font-size:13px;color:var(--suave);margin-bottom:10px}
  .rotulo b{color:var(--texto);font-weight:600}
  /* El ₲ de la cabecera de la ficha: poner el precio a mano cuando el padron
     no lo tiene. Se abre en su lugar, sin empujar nada. */
  .pbox{display:flex;align-items:center;gap:6px}
  .pbtn{padding:5px 9px;font-size:14px;color:var(--suave);border:1px solid transparent;
    background:none;border-radius:8px;cursor:pointer}
  .pbtn:hover{border-color:var(--linea);color:var(--texto)}
  .pbtn.falta{color:var(--verde);border-color:var(--verde);font-weight:700}
  #fPrecio{display:none;width:118px;border:1px solid var(--teal);border-radius:8px;
    padding:5px 9px;font-size:13px;font-family:inherit}
  #fPrecio:focus{outline:none;box-shadow:0 0 0 3px var(--teal-claro)}
  .pbox.abierto #fPrecio{display:block}
  .pbox.abierto .pbtn{display:none}
  .dias{display:flex;gap:7px;flex-wrap:wrap}
  .d{background:var(--teal);color:#fff;border-radius:9px;min-width:44px;padding:7px 8px;
    text-align:center;line-height:1.15}
  .d.varias{background:var(--teal-osc)}
  .d .n{display:block;font-size:16px;font-weight:700}
  .d .c{display:block;font-size:10.5px;opacity:.85;margin-top:1px}
  /* ---- Marca de PAGADO, por fecha ----
     Se toca el dia y queda verde. Es la unica forma que hay de saber que esa
     clase ya se cobro: hasta ahora ese dato no existia en ningun lado. */
  .d{cursor:pointer;user-select:none;position:relative;transition:background .12s}
  .d:hover{filter:brightness(1.12)}
  .d.pagado{background:var(--verde)}
  .d.pagado .n::after{content:'✓';position:absolute;top:3px;right:5px;
    font-size:10px;font-weight:800;opacity:.95}
  .d.guardando{opacity:.45}
  /* El mes entero en verde cuando estan pagadas TODAS sus fechas: asi no hace
     falta marcar el mes aparte, se deduce solo. */
  .rotulo.pagado{color:var(--verde);font-weight:600}
  .rotulo.pagado b{color:var(--verde)}
  .rotulo .selloPago{background:var(--verde-claro);color:var(--verde);border-radius:7px;
    padding:2px 8px;font-size:11px;font-weight:800;margin-left:8px;letter-spacing:.3px}
  .diasMes.pagado{color:var(--verde)}

  .cobro{margin-top:16px;padding-top:13px;border-top:1px solid var(--linea)}
  .cobro .tit{font-size:11px;font-weight:700;color:var(--suave);letter-spacing:.4px;
    text-transform:uppercase;margin-bottom:9px}
  .op{border:1px solid var(--linea);border-radius:11px;padding:10px 12px;margin-bottom:8px}
  .op .fila1{display:flex;align-items:baseline;gap:8px}
  .op .et{font-size:13px;font-weight:600;flex:1}
  .op .nm{font-size:19px;font-weight:700;letter-spacing:-.4px;white-space:nowrap}
  .op .exp{font-size:11.5px;color:var(--suave);margin-top:3px}
  .op.bien{border-color:#bcdccb;background:var(--verde-claro)}
  .op.bien .nm{color:var(--verde)}
  .op.flojo{border-color:#eccf9a;background:var(--ambar-claro)}
  .op.flojo .nm{color:var(--ambar)}
  .op.malo{border-color:#f3b9b9;background:var(--rojo-claro)}
  .op.malo .nm{color:var(--rojo);font-size:14px}

  .wa{width:100%;margin-top:14px;background:#1f9d55;border-color:#1f9d55;color:#fff;font-weight:700}
  .wa:hover{background:#187f45;border-color:#187f45}
  .wa:disabled{background:#e6ebee;border-color:var(--linea);color:#9fb0ba;cursor:not-allowed}
  .waNota{font-size:11.5px;color:var(--suave);margin-top:6px;text-align:center}

  /* ---- Tipos de clase ---- */
  .tipoFila{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea)}
  .tipoFila:last-of-type{border-bottom:0}
  .tipoFila .nom{flex:1;font-weight:600}
  .tipoFila .uso{color:var(--suave);font-size:12px;font-weight:400}
  .tipoFila input{width:140px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:9px;
    color:var(--texto);padding:9px 11px;font-family:inherit;font-size:14.5px;font-weight:600;text-align:right}
  .tipoFila input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-claro)}
  .arreglo{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .arreglo input{background:var(--tarjeta);border:1px solid var(--linea);border-radius:8px;
    color:var(--texto);padding:6px 9px;font-family:inherit;font-size:12.5px;width:120px}
  .arreglo .cTipo{width:80px}
  .arreglo input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-claro)}
  .quitarTipo{border:1px solid var(--linea);background:var(--tarjeta);color:var(--suave);
    border-radius:8px;padding:6px 10px;font-size:13px;line-height:1;cursor:pointer}
  .quitarTipo:hover{border-color:var(--rojo);color:var(--rojo)}
  .agregarTipo{margin-top:16px;padding-top:14px;border-top:1px solid var(--linea)}
  .agregarTipo .tit{font-size:11px;font-weight:700;color:var(--suave);letter-spacing:.4px;
    text-transform:uppercase;margin-bottom:9px}
  .agregarTipo .fila{display:flex;gap:8px;flex-wrap:wrap}
  .agregarTipo input{background:var(--tarjeta);border:1px solid var(--linea);border-radius:9px;
    color:var(--texto);padding:9px 11px;font-family:inherit;font-size:14px}
  .agregarTipo #tNombre{flex:1;min-width:200px}
  .agregarTipo #tMonto{width:120px;text-align:right;font-weight:600}
  .agregarTipo input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-claro)}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;
    background:var(--texto);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;display:none}

  #login,#nopuede{position:fixed;inset:0;z-index:99;background:var(--fondo);display:none;
    align-items:center;justify-content:center;flex-direction:column;padding:26px;text-align:center}
  #login h2,#nopuede h2{margin:0 0 8px;font-size:22px}
  #login p,#nopuede p{color:var(--suave);max-width:360px;margin:0 0 22px;white-space:pre-line}
  .err{color:var(--rojo);font-size:13px;margin-top:9px;min-height:17px}
  @media (max-width:560px){ .f-cab,.f-cuerpo{padding-left:15px;padding-right:15px} }
</style>
</head>
<body>

<div id="login">
  <h2>Caja</h2>
  <p>Cobros por alumno, pago a profesores e informes de la academia.</p>
  <button class="pri" id="btnEntrar">Entrar con Google</button>
  <div class="err" id="errLogin"></div>
</div>

<div id="nopuede">
  <h2>No tenés acceso</h2>
  <p id="nopuedeTxt"></p>
  <button id="btnSalir2">Salir</button>
</div>

<div class="wrap" id="app" style="display:none">
  <h1>Caja <span style="font-size:11px;font-weight:400;opacity:.5">v2026-08-14 · +padron_v1</span></h1>
  <div class="sub" id="rango"></div>
  <div class="yo"><span id="yoMail"></span><a href="#" id="btnSalir">salir</a></div>

  <div class="frescura">
    <div class="txt" id="frescuraTxt">Leyendo…</div>
    <button class="chico" id="btnRefrescar">🔄 Actualizar ahora</button>
  </div>

  <div class="planBarra" id="planBarra"></div>
  <input type="file" id="planArchivo" accept=".csv,text/csv" style="display:none">

  <div class="solapas">
    <button data-s="cobros" class="on">Cobros</button>
    <button data-s="informes">Informes</button>
    <button data-s="profes">Pago a profesores</button>
    <button data-s="tipos">Tipos de clase</button>
    <button data-s="corregir">Para corregir <b id="nCorregir"></b></button>
  </div>

  <div id="cargando" class="vacio">Leyendo el historial…</div>
  <div id="pantalla"></div>
</div>

<div id="ov">
  <div class="ficha" id="ficha"></div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCwHaVLIoFrXb2NFl9Od6j8LuLvklxpzRc",
  authDomain: "academia-dg.firebaseapp.com",
  databaseURL: "https://academia-dg-default-rtdb.firebaseio.com",
  projectId: "academia-dg",
  storageBucket: "academia-dg.firebasestorage.app",
  messagingSenderId: "623967243039",
  appId: "1:623967243039:web:e22397b466b63aefdf3e2a"
});

/* ============================================================
   CAJA — de dónde sale cada número

   Nada se guarda dos veces. Todo se calcula al abrir, leyendo:

     historial_v1/csv  · las clases que ya pasaron (copia de la hoja HISTORIAL,
                         la refresca un script cada 30 minutos)
     alumnos_v1/csv    · el padrón: precio por clase y teléfono
     tipos_v1          · cuánto aporta cada tipo de clase al pozo de los profes.
                         Es el ÚNICO dato que nace en esta app.

   Las dos cuentas son independientes y solo comparten la clase:

     Lo que cobra la academia → sale del ALUMNO (su precio, del padrón)
     Lo que se paga al profe  → sale del TIPO DE CLASE (igual para todos)

   La diferencia es lo que le queda a la academia.
   ============================================================ */

var CUENTA={ nombre:'Diego González', alias:'1.549.349' };
/* El puente: la única forma de escribir en la planilla. Verifica la sesión de
   Firebase antes de escribir, así que el pedido viaja firmado. */
var PUENTE_URL='https://script.google.com/macros/s/AKfycbx0sFIbIVKDslYQb1Dkk9Wo5AhykUFplMDIsuj1DWB4Xy7FSU1Ebn04ZcahHYqCB4cR/exec';

/* ============================================================
   EL PUENTE A LA PLANILLA, Y CÓMO SE ENTERA UNO CUANDO FALLA

   El puente es un Apps Script que escribe en la hoja, y contesta
   {ok:true} o {ok:false, error:"..."}. O sea que la respuesta SIEMPRE estuvo
   ahí: nadie la leía.

   Antes esto viajaba en un formulario a un iframe escondido y se daba por bueno
   a los 5 segundos, pasara lo que pasara: token vencido, permiso sacado, Apps
   Script caído, la hoja renombrada. El dato quedaba en Firebase —que acá se
   escribe primero, así que no se pierde— pero la planilla se iba quedando atrás
   en silencio. Y de la planilla sale `alumnos_v1`, que es de donde esta misma
   pantalla lee los precios.

   Ahora se intenta por fetch, que sí deja leer la respuesta. Si el navegador lo
   bloquea por CORS se cae al iframe de siempre, pero distinguiendo "contestó" de
   "se quedó mudo". Nunca sale peor que antes.
   ============================================================ */
/* El puente avisa por acá cuando la planilla no confirmó. Sin esto el fallo
   queda solo en la consola, que nadie mira. */
window.__avisoPuente=function(txt){ try{ toast('⚠️ '+txt); }catch(e){ console.warn(txt); } };

function avisoPuente(res, action){
  if(res && res.ok) return res;
  var txt = 'La planilla no confirmó el cambio' + (res && res.error ? ': ' + res.error : '') +
            '. El dato quedó guardado acá, pero la hoja puede estar desactualizada.';
  try{ if(typeof window.__avisoPuente === 'function'){ window.__avisoPuente(txt, res, action); return res; } }catch(e){}
  console.warn('puente (' + action + '): ' + txt);
  return res;
}

function enviarAlPuente(action, payload){
  return firebase.auth().currentUser.getIdToken().catch(function(){ return ''; }).then(function(idToken){
    var cuerpo = 'data=' + encodeURIComponent(JSON.stringify(Object.assign({action:action, idToken:idToken}, payload)));

    /* CAMINO 1 — fetch. El Content-Type de formulario es a propósito: es de los
       que el navegador manda sin preguntar antes (sin preflight), así que Apps
       Script lo recibe igual que al formulario de toda la vida. */
    return fetch(PUENTE_URL, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body: cuerpo
    }).then(function(r){ return r.text(); }).then(function(t){
      var d=null; try{ d=JSON.parse(t); }catch(e){}
      if(d && typeof d.ok === 'boolean') return avisoPuente({ok:d.ok, via:'fetch', error:d.error||''}, action);
      /* Contestó algo que no es el JSON del puente (una pantalla de login de
         Google, por ejemplo). No se da por bueno. */
      return avisoPuente({ok:false, via:'fetch', error:'respuesta inesperada del puente'}, action);
    }).catch(function(e){
      console.warn('puente por fetch no salió (' + e.message + '), voy por el iframe');
      /* CAMINO 2 — el formulario de siempre. No se puede leer la respuesta
         porque viene de otro dominio, pero sí se puede saber si CONTESTÓ. */
      return new Promise(function(resolve){
        var name='pnt_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
        var ifr=document.createElement('iframe'); ifr.name=name; ifr.style.display='none'; document.body.appendChild(ifr);
        var form=document.createElement('form'); form.method='POST'; form.action=PUENTE_URL; form.target=name; form.style.display='none';
        var inp=document.createElement('input'); inp.type='hidden'; inp.name='data';
        inp.value=JSON.stringify(Object.assign({action:action, idToken:idToken}, payload));
        form.appendChild(inp); document.body.appendChild(form);
        var listo=false, fin=function(contesto){
          if(listo) return; listo=true;
          setTimeout(function(){ try{ form.remove(); ifr.remove(); }catch(e){} },300);
          resolve(contesto ? {ok:true, via:'iframe', error:''}
                           : avisoPuente({ok:false, via:'iframe', error:'no contestó en 8 segundos'}, action));
        };
        ifr.onload=function(){ fin(true); };
        setTimeout(function(){ fin(false); }, 8000);   // 8s: Apps Script arranca lento la primera vez
        form.submit();
      });
    });
  });
}

/* Corrige el precio y el tipo de un alumno. Escribe en las DOS casas a la vez:
   en Firebase al instante (para verlo ya) y en la planilla por el puente, que
   es donde vive el padrón de verdad. Es el mismo camino de la app de Alumnos. */
function corregirAlumno(ficha, precioTxt, tipo){
  var esBeca=/beca/i.test(precioTxt);
  var num=+soloDigitos(precioTxt)||0;
  var precioPlanilla = esBeca ? 'BECA' : (num.toLocaleString('en-US')+'Gs.');
  var datos={ nombre:ficha.nombre, cat:ficha.cat||'', lado:'', tipo:tipo||ficha.tipo||'',
              precio:precioPlanilla, coment:'', nomHor:'', nomWpp:'', tel:ficha.telCrudo||'' };
  /* Firebase primero: no depende de que la planilla ande. */
  try{
    var k=keyAlumno(ficha.nombre).replace(/\s+/g,'_');
    firebase.database().ref('alumnos_v2/'+k).update({
      nombre:ficha.nombre, precio: esBeca?0:num, tipo:datos.tipo, tel:ficha.tel||''
    }).catch(function(){});
  }catch(e){}
  /* Migración a Firebase (paso 3 — escritura doble): la corrección también va a
     padron_v1 (canónico). Se busca el ID por nombre y se actualizan precio/tipo/tel.
     Aditivo: la planilla por el puente sigue igual, y el bridge reconcilia. */
  try{
    var kn=keyAlumno(ficha.nombre);
    firebase.database().ref('padron_v1/alumnos').once('value').then(function(s){
      var al=s.val()||{};
      for(var id in al){
        if(al[id] && keyAlumno(al[id].nombre)===kn){
          firebase.database().ref('padron_v1/alumnos/'+id).update({ precio:precioPlanilla, tipo:datos.tipo, tel:ficha.tel||'' }).catch(function(){});
          break;
        }
      }
    }).catch(function(){});
  }catch(e){}
  return enviarAlPuente('alumnos', {alumnos:[datos]}).then(function(){
    ficha.precio = esBeca?0:num; ficha.beca=esBeca; ficha.tipo=datos.tipo;
    anotarOp('editar', 'Corrigió a '+ficha.nombre+' · precio '+precioPlanilla+(datos.tipo?' · tipo '+datos.tipo:''));
  });
}

function normNom(s){
  return String(s==null?'':s).replace(/\u2060/g,'').replace(/\u200b/g,'').replace(/\u2019/g,"'")
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/\s+/g,' ').trim();
}
/* Misma limpieza que usa el calendario: saca el sufijo de sede o de tipo de clase
   pegado al nombre ("Pedro Gomez LOMAS", "Rob Wilkie DUAL"). Sin esto, el mismo
   alumno queda partido en dos. */
/* Sufijos de sede o tipo de clase pegados al nombre ("Pedro Gomez LOMAS").
   OJO: 'alto' y 'rendimiento' NO van acá — borraban palabras del medio de un
   nombre y hacían que "Alto1" quedara como "alto". Los bloques se reconocen
   aparte, con esBloque(). */
var SUFIJOS=['lomas','elite','segurola','dual','duales','individual','ind','grupal','g','d',
             'noche','ar','pretemporada','prete','grupo'];
/* Las letras sueltas g y d están en la lista porque en la grilla se escribe
   "Pedro Gomez G" para grupal. Pero también son INICIALES de apellido, y ahí
   borrarlas mezcla a dos personas: "Jose M. G." y "Jose M. D." quedaban los dos
   como "jose m", y si sus clases llegaban sin ID se les sumaban las clases y se
   les cobraba cruzado. La regla: una letra suelta se borra solo si lo que viene
   antes NO es otra letra suelta. "Pedro Gomez G" sí; "Jose M. G." no. */
function esSufijoBorrable(palabras, i){
  var p=palabras[i];
  if(SUFIJOS.indexOf(p)<0) return false;
  if(p.length===1 && i>0 && palabras[i-1].length===1) return false;   // es una inicial
  /* Y nunca se borra si lo que queda es demasiado corto para identificar a
     alguien: "Lu G" quedaría en "lu", dos letras que pueden chocar con otro. */
  if(palabras.slice(0,i).join(' ').replace(/\s/g,'').length < 3) return false;
  return true;
}
function keyAlumno(s){
  /* Se conservan los NÚMEROS: sin ellos "Alto1" y "Alto2" quedaban iguales y el
     sistema los fusionaba en un solo alumno. */
  var w=normNom(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().split(' ');
  while(w.length>1 && esSufijoBorrable(w, w.length-1)) w.pop();
  return w.join(' ');
}
function soloDigitos(s){ return String(s==null?'':s).replace(/\D/g,''); }

/* Códigos de país de los alumnos del exterior: no se les pega el 595 delante, y
   se lo despega si una versión vieja ya lo hizo. Igual que en el calendario. */
var PAIS_CC=['549','54','598','591','593','55','56','51','57','52','34','33','39','44','49',
             '351','353','31','41','43','45','46','47','48','420','61','64','81','82','86','972','1'];
function empiezaConPais(d){
  for(var i=0;i<PAIS_CC.length;i++){ if(d.indexOf(PAIS_CC[i])===0) return true; }
  return false;
}
function normTel(raw){
  var d=soloDigitos(raw); if(!d) return '';
  if(d.slice(0,2)==='00') d=d.slice(2);
  if(d.indexOf('595')===0 && d.length>12 && empiezaConPais(d.slice(3))) return d.slice(3);
  if(d.indexOf('595')===0){
    var r=d.slice(3); while(r.charAt(0)==='0') r=r.slice(1);
    return '595'+r;
  }
  while(d.charAt(0)==='0') d=d.slice(1);
  if(d.length<=10 && !empiezaConPais(d)) return '595'+d;
  return d;
}
function telOk(t){ return t && t.length>=10 && t.length<=15; }
/* Un paraguayo es 595 + 9 dígitos = 12. Un número del exterior con su código de
   país está bien: hay 76 alumnos así. Lo que no es ninguna de las dos cosas está
   mal cargado — el caso de Jorge Bernal, con el 595 tipeado 959, pasa el largo
   pero no existe. */
function telRaro(t){
  var d=soloDigitos(t); if(!d) return 'sin teléfono';
  if(d.indexOf('595')===0){
    if(d.length===12) return '';
    return d.length>12 ? 'le sobran '+(d.length-12)+' dígito(s)' : 'le faltan '+(12-d.length)+' dígito(s)';
  }
  if(empiezaConPais(d) && d.length>=10 && d.length<=15) return '';
  return 'no se reconoce el país';
}

/* Solo la primera letra. El text-transform:capitalize del CSS ponía en mayúscula
   cada palabra y el rango quedaba "Del 17/8 Al 19/8". */
function conMayuscula(t){ t=String(t||''); return t.charAt(0).toUpperCase()+t.slice(1); }
function fechaCorta(iso){

  return DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
}
function mesDe(iso){ return iso.slice(0,7); }
/* La bolsa de los profes se agrupa por el TEXTO de la hora. Si una fila dice
   "07:00" y otra "7:00" se arman DOS bolsas y cada profe cobra la suya entera
   en vez de repartir. Hoy todo sale de la misma lista, pero una corrección
   escrita a mano en la planilla lo partiría sin que nadie lo note. */
function normHora(h){
  var t=String(h==null?'':h).trim();
  var m=t.match(/^(\d{1,2})\s*[:.]?\s*(\d{2})?$/);
  return m ? ((+m[1])+':'+(m[2]||'00')) : t;
}

function mesCorto(m){ var p=m.split('-'); return MESES_CORTO[(+p[1])-1]+' '+p[0].slice(2); }

/* ---------- Lectura de los datos ---------- */
function parseCSV(txt){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<txt.length;i++){ var c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* HISTORIAL: Fecha · Alumno · Hora · Sede · Profe · Tipo · Estado · Cobro · Motivo · ID */
function parsearHistorial(paq){
  if(!paq) return;
  var csv = (typeof paq==='string') ? paq : paq.csv;
  histActualizado = (paq && paq.actualizado) ? paq.actualizado : '';
  if(!csv) return;
  var rows=parseCSV(csv); if(rows.length<2) return;
  historial=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    var fecha=(r[0]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) continue;
    var nom=(r[1]||'').trim(); if(!nom) continue;
    var estado=(r[6]||'').trim();
    historial.push({
      fecha:fecha, alumno:nom, hora:normHora((r[2]||'').trim()), sede:(r[3]||'').trim(),
      profe:(r[4]||'').trim(), tipo:(r[5]||'').trim(),
      estado:estado, cobro:(r[7]||'').trim(), motivo:(r[8]||'').trim(),
      id:(r[9]||'').trim(),
      presente: estado.indexOf('Presente')===0,
      seCobra: (r[7]||'').trim().toLowerCase().indexOf('s')===0
    });
  }
}
/* ============================================================
   DE DÓNDE SALE EL HISTORIAL

   Antes salía de la hoja HISTORIAL de la planilla, que un script copiaba a
   historial_v1 cada tanto. Ese camino se abandonó: hoy el sistema vive en
   Firebase y el día lo cierra solo el servidor a las 23:30, que escribe
   directo en historial_v2/<fecha>.

   Una fecha, un paquete con sus filas. Es lo mismo que había, con dos
   ventajas: no depende de la planilla y se puede borrar por día.
   ============================================================ */
function parsearHistorialV2(nodo){
  historial=[]; histActualizado='';
  if(!nodo || typeof nodo!=='object') return;
  var ultimo='';
  Object.keys(nodo).sort().forEach(function(fecha){
    var paq=nodo[fecha];
    var filas=(paq && paq.filas) || [];
    if(!Array.isArray(filas)) return;
    if(paq.cerrado && paq.cerrado>ultimo) ultimo=paq.cerrado;
    filas.forEach(function(r){
      if(!r || !r.length) return;
      var f=String(r[0]||'').trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(f)) return;
      var nom=String(r[1]||'').trim(); if(!nom) return;
      var estado=String(r[6]||'').trim();
      historial.push({
        fecha:f, alumno:nom, hora:normHora(String(r[2]||'').trim()), sede:String(r[3]||'').trim(),
        profe:String(r[4]||'').trim(), tipo:String(r[5]||'').trim(),
        estado:estado, cobro:String(r[7]||'').trim(), motivo:String(r[8]||'').trim(),
        id:String(r[9]||'').trim(),
        presente: estado.indexOf('Presente')===0,
        seCobra: String(r[7]||'').trim().toLowerCase().indexOf('s')===0
      });
    });
  });
  histActualizado = ultimo;
}
function cargarHistorial(){
  return firebase.database().ref('historial_v2').once('value').then(function(s){
    parsearHistorialV2(s.val());
  }).catch(function(e){ console.warn('historial_v2:', e.message); });
}

function parsearPadron(paq){
  if(!paq) return;
  var csv = (typeof paq==='string') ? paq : paq.csv;
  padActualizado = (paq && paq.actualizado) ? paq.actualizado : '';
  if(!csv) return;
  var rows=parseCSV(csv); if(rows.length<2) return;
  var head=-1, col={};
  for(var r=0;r<Math.min(rows.length,12);r++){
    var h=rows[r].map(normNom);
    var iNom=h.indexOf('alumnos'); if(iNom<0) iNom=h.indexOf('alumno');
    var iId=h.indexOf('id');
    if(iNom>=0 && iId>=0){
      head=r; col.nom=iNom; col.id=iId;
      col.precio=h.findIndex(function(x){ return x.indexOf('precio')>=0; });
      col.tel=h.findIndex(function(x){ return x.indexOf('telefono')>=0; });
      col.tipo=h.findIndex(function(x){ return x.indexOf('tipo de clase')>=0; });
      col.cat=h.findIndex(function(x){ return x.indexOf('categoria')>=0; });
      col.alt1=h.findIndex(function(x){ return x.indexOf('nombre p/ horario')>=0 || x.indexOf('nombre p horario')>=0; });
      col.alt2=h.findIndex(function(x){ return x.indexOf('nombre_calendario')>=0 || x.indexOf('nombre calendario')>=0; });
      break;
    }
  }
  if(head<0) return;
  padron=[]; idxId={}; idxNom={};
  for(var i=head+1;i<rows.length;i++){
    var f=rows[i], nom=(f[col.nom]||'').trim(); if(!nom) continue;
    var a={
      nombre:nom,
      id:col.id>=0?(f[col.id]||'').trim():'',
      /* BECA escrito en la casilla del precio = alumno becado, no paga. Es
         distinto del cero o el vacío, que significan "falta cargarlo". */
      beca: col.precio>=0 && /beca/i.test(String(f[col.precio]||'')),
      precio:col.precio>=0?(+soloDigitos(f[col.precio])||0):0,
      tel:col.tel>=0?normTel(f[col.tel]):'',
      telCrudo:col.tel>=0?(f[col.tel]||'').trim():'',
      tipo:col.tipo>=0?(f[col.tipo]||'').trim():'',
      cat:col.cat>=0?(f[col.cat]||'').trim():''
    };
    padron.push(a);
    if(a.id && !idxId[a.id]) idxId[a.id]=a;
    /* ============================================================
       LOS PARES A PROPÓSITO: "Rodrigo Lee INDIVIDUAL" y "Rodrigo Lee GRUPAL"

       keyAlumno() borra el sufijo del tipo de clase, y eso es correcto para el
       caso común: en la grilla se escribe "Pedro Gomez G" y en el padrón está
       "Pedro Gomez". Pero hay ~20 alumnos cargados DOS veces a propósito, uno
       por tipo de clase, con su ID y su precio distintos. A esos la clave corta
       los junta y el segundo no entraba nunca al índice.

       Se guardan las dos claves: el nombre COMPLETO y la corta. Buscar prueba
       primero por el nombre completo, así "Rodrigo Lee GRUPAL" encuentra su
       propia ficha (Gs 90.000) en vez de la individual (Gs 150.000).
       ============================================================ */
    [nom, col.alt1>=0?f[col.alt1]:'', col.alt2>=0?f[col.alt2]:''].forEach(function(n){
      var exacta=normNom(n); if(exacta && !idxNom[exacta]) idxNom[exacta]=a;
      var k=keyAlumno(n);    if(k && !idxNom[k]) idxNom[k]=a;
    });
  }
  aplicarVivo();
}

/* Padrón: los encabezados NO están en la primera fila y hay columnas ocultas,
   así que las columnas se buscan por su nombre, nunca por posición. */
/* ============================================================
   DE DONDE SALE EL PADRON: PRIMERO FIREBASE, LA PLANILLA DE RESPALDO

   Hasta ahora mandaba la planilla de Google (`alumnos_v1`) y `padron_v1` se
   escribia pero no se leia nunca. Desde el 26/08/2026 se da vuelta: manda
   Firebase, que es donde vive el sistema.

   MEDIDO ANTES DE DARLO VUELTA, alumno por alumno:
     945 estan en las dos · 5 solo en la planilla · 0 solo en Firebase
     7 precios distintos, y en 6 de esos 7 Firebase tiene el precio bueno y
     la planilla dice 0Gs. (alguien lo cargo desde la app y nunca volvio).

   POR QUE LA PLANILLA SIGUE DE RESPALDO Y NO SE SACA DE UNA
   El robot que copia planilla -> padron_v1 no corre desde el 24/08, asi que
   los alumnos que Diego anota A MANO EN LA PLANILLA todavia no llegan solos
   a Firebase (son los 5 de arriba, todos con ID alto: A0931 a A0950). Si se
   sacara la planilla hoy, esos 5 desaparecerian de Caja.
   Cuando el padron este regularizado se saca este respaldo y la planilla
   queda muerta.

   EL PRECIO NO SE ROMPE: padron_v1 lo guarda igual que la planilla
   ('110,000Gs.'), y aca se lee con soloDigitos(), que saca todo lo que no
   sea numero. De los 945: 891 en ese formato, 18 como numero, 35 vacios y
   1 en BECA. Los cuatro casos ya andaban.
   ============================================================ */
function cargarPadron(){
  return Promise.all([
    firebase.database().ref('alumnos_v1').once('value')
      .then(function(s){ return s.val(); })
      .catch(function(e){ console.warn('alumnos_v1:', e.message); return null; }),
    firebase.database().ref('padron_v1/alumnos').once('value')
      .then(function(s){ return s.val()||{}; })
      .catch(function(e){ console.warn('padron_v1:', e.message); return {}; })
  ]).then(function(r){
    /* Primero la planilla, que es la que trae la estructura y los pares de
       ficha a proposito; despues Firebase le pisa lo que importa. */
    _padronV1 = r[1] || {};
    parsearPadron(r[0]);
    aplicarPadronV1(_padronV1);
  });
}

/* Firebase le gana a la planilla en precio, tipo y telefono. Y el que esta en
   Firebase y no en la planilla se agrega: al reves de antes, ahora no se
   pierde el que se creo desde una app. */
var padronV1Origen = { pisados:0, agregados:0, total:0 };
/* Se guarda el ultimo padron_v1 que llego: cuando cambia la planilla hay que
   rearmar todo desde cero, y sin esta copia el rearmado dejaria a Caja
   leyendo la planilla sola y con los precios viejos. */
var _padronV1 = {};
function aplicarPadronV1(pv1){
  padronV1Origen = { pisados:0, agregados:0, total:0 };
  if(!pv1) return;
  Object.keys(pv1).forEach(function(id){
    var p = pv1[id]; if(!p || !p.nombre) return;
    padronV1Origen.total++;
    var f = idxId[id];
    if(f){
      /* Solo se pisa lo que Firebase tiene cargado. Un precio vacio en
         Firebase no borra el que trae la planilla: seria perder un dato
         bueno por uno que no existe. */
      var tienePrecio = String(p.precio==null?'':p.precio).trim() !== '';
      if(tienePrecio){
        f.beca   = /beca/i.test(String(p.precio));
        f.precio = +soloDigitos(p.precio) || 0;
      }
      if(p.tipo) f.tipo = p.tipo;
      if(p.tel){ f.telCrudo = String(p.tel); f.tel = normTel(p.tel); }
      if(p.cat) f.cat = p.cat;
      padronV1Origen.pisados++;
      return;
    }
    var nuevo = {
      nombre: p.nombre, id: id,
      beca: /beca/i.test(String(p.precio||'')),
      precio: +soloDigitos(p.precio) || 0,
      tel: normTel(p.tel||''), telCrudo: String(p.tel||''),
      tipo: p.tipo||'', cat: p.cat||''
    };
    padron.push(nuevo);
    idxId[id] = nuevo;
    var e = normNom(nuevo.nombre); if(e && !idxNom[e]) idxNom[e] = nuevo;
    var k = keyAlumno(nuevo.nombre); if(k && !idxNom[k]) idxNom[k] = nuevo;
    padronV1Origen.agregados++;
  });
}

/* ============================================================
   EL PRECIO, SIN ESPERAR LOS 15 MINUTOS

   La app de Alumnos escribe cada alumno en `alumnos_v2` al instante, y el
   puente lo lleva a la planilla; recién 15 minutos después entra en la copia
   que lee la caja. Así que se lee el cajón instantáneo y se pisa lo que traiga.

   No rompe "una casa por dato": la planilla sigue mandando. `alumnos_v2` es la
   MISMA casa un paso antes, no una copia paralela con vida propia.
   ============================================================ */
function cargarVivo(){
  return firebase.database().ref('alumnos_v2').once('value').then(function(s){
    alumnosVivo=s.val()||{}; aplicarVivo();
  }).catch(function(e){ alumnosVivo={}; console.warn('alumnos_v2:', e.message); });
}

function aplicarVivo(){
  if(!alumnosVivo || !padron.length) return;
  Object.keys(alumnosVivo).forEach(function(k){
    var v=alumnosVivo[k]; if(!v || !v.nombre) return;
    var kk=keyAlumno(v.nombre);
    var a=idxNom[kk];
    if(a){
      if(v.precio!==undefined && v.precio!==null) a.precio=Number(v.precio)||0;
      if(v.tipo!==undefined) a.tipo=v.tipo||'';
      if(v.tel){ a.tel=normTel(v.tel); a.telCrudo=v.tel; }
      a.vivo=true;
    } else {
      /* Alumno recién creado: todavía no está en la copia de la planilla. Si no
         se lo agrega, la caja lo marcaría como "no está en el padrón". */
      var nuevo={ nombre:v.nombre, id:'', precio:Number(v.precio)||0,
                  tel:v.tel?normTel(v.tel):'', telCrudo:v.tel||'',
                  tipo:v.tipo||'', cat:v.cat||'', vivo:true };
      padron.push(nuevo);
      if(kk) idxNom[kk]=nuevo;
    }
  });
}

/* ============================================================
   COLUMNAS QUE NO SON PROFESORES

   En la grilla hay columnas que no son una persona: "Sin profe" (SP) y las de
   A DEFINIR, que se usan para estacionar alumnos hasta ubicarlos. Si contaran
   como profesor, se llevarían una parte de la bolsa de esa hora y todos los
   profes de verdad cobrarían menos.

   La marca vive en el calendario (calendario_v2/profesores), que es donde se
   define la columna. Acá solo se lee.
   ============================================================ */
function cargarColumnas(){
  return firebase.database().ref('columnas_v1').once('value').then(function(s){
    guardarColumnas(s.val());
  }).catch(function(e){ console.warn('columnas_v1:', e.message); });
}
/* Qué columnas NO son un profesor. Viven en su propio cajón: el calendario se
   publica entero, así que una copia vieja borraba la marca sin querer. */
function guardarColumnas(v){
  v=v||{}; noProfe={};
  Object.keys(v).forEach(function(k){
    if(v[k] && v[k].noEsProfe) noProfe[String(k).trim().toUpperCase()]=true;
  });
}
function guardarNombresProfes(lista){
  lista=lista||[]; profesores={};
  var arr=Array.isArray(lista)?lista:Object.keys(lista).map(function(k){ return lista[k]; });
  arr.forEach(function(p){ if(p&&p.dim) profesores[String(p.dim).trim().toUpperCase()]=p.nombre||p.dim; });
}
function cargarNombres(){
  return firebase.database().ref('calendario_v2/profesores').once('value').then(function(s){
    guardarNombresProfes(s.val());
  }).catch(function(e){ console.warn('profesores:', e.message); });
}
function esColumnaSinProfe(dim){ return !!noProfe[String(dim||'').trim().toUpperCase()]; }
function nombreProfe(dim){ return profesores[String(dim||'').trim().toUpperCase()] || dim; }

/* Los casilleros de ALTO RENDIMIENTO, ALMUERZO, LIBRE, los puntos y los guiones
   ocupan lugar en la grilla pero NO son alumnos. Misma regla que el calendario. */
/* Fila de profe ayudante: no es un alumno ni un bloque. Solo dice que ese
   profesor trabajó esa hora, así que entra al reparto de la bolsa. */
function esAyudante(h){
  return String(h && h.tipo||'').toUpperCase()==='AYUDA' ||
         String(h && h.alumno||'').toUpperCase()==='AYUDANTE';
}

/* ============================================================
   LOS CASILLEROS QUE NO SON UN ALUMNO

   En la grilla hay textos que ocupan lugar pero no son una persona. Y NO se
   tratan todos igual, porque significan cosas distintas:

   · BLOQUE DE ALTO RENDIMIENTO → ahí el profe SÍ está trabajando. No aporta al
     pozo (sus alumnos entran en filas propias, con su tipo AR60 o AR30), pero
     cuenta como hora trabajada y le da derecho a su parte.

   · CASILLERO DECORATIVO → ALMUERZO, LIBRE, no hay cancha, feriado. Ahí no hay
     clase: ni aporta al pozo ni cuenta como hora trabajada.

   Antes los dos caían en la misma bolsa y un "LIBRE" con tipo de clase cargado
   engordaba el pozo de la hora. Nadie lo veía, porque la pantalla de cobros sí
   los escondía: se pagaba de más en silencio.
   ============================================================ */
var DECORATIVOS=/almuerzo|\blibre\b|pretemporada|no\s*hay\s*cancha|nohaycancha|\bferiado\b|\bvacaciones\b|cancelad|suspendid|\bentrenamiento\b/i;
function esBloqueAR(nombre){
  return /alto\s*rendimiento|alto\s*r\b/i.test(String(nombre==null?'':nombre).trim());
}
function esBloque(nombre){
  var crudo=String(nombre==null?'':nombre).trim();
  if(esBloqueAR(crudo) || DECORATIVOS.test(crudo)) return true;
  /* El largo se mide sobre el nombre TAL CUAL ESTÁ ESCRITO, no sobre el limpio.
     Antes se medía sobre el limpio, y a "Lu G" la limpieza le sacaba la G por
     ser sufijo de grupal: quedaba en "lu", dos letras, y el sistema lo tomaba
     por decoración. Sus clases NO SE COBRABAN NUNCA y no aparecía en la Caja,
     sin ningún aviso. Le pasaba a cualquier nombre corto. */
  var letras=crudo.replace(/[^a-z0-9]/gi,'');
  if(!letras) return true;                                      // vacío, guiones, puntos
  if(keyAlumno(nombre).replace(/\./g,'').trim()==='') return true;
  return letras.length<=2;                                      // "-", "AR", "G" sueltos
}

/* ============================================================
   LA CLASE DE COACH

   El profesor la da por su cuenta. La plata la cobra la academia y se la pasa
   entera a él, así que NO pasa por la bolsa de la hora.

   Dos cosas tiene que respetar, y las dos son de plata:

   · No aporta al pozo, y tampoco le da al profe derecho a una parte del pozo
     de esa hora. Si contara como hora trabajada, el que dio el coach se
     llevaría una parte de lo que aportaron las clases de las otras sedes.
   · No se le cobra al alumno por el precio de su ficha. Tiene su propio precio.

   Mientras el cobro y el pago del coach no estén hechos, estas filas quedan
   registradas en el historial y no mueven un peso.
   ============================================================ */
function esCoach(h){
  return String(h && h.tipo || '').trim().toUpperCase()==='COACH';
}

function cargarTipos(){
  return firebase.database().ref('tipos_v1').once('value').then(function(s){
    tipos=s.val()||{};
  }).catch(function(e){ tipos={}; console.warn('tipos_v1:', e.message); });
}

/* El ID manda. Si no viene, se busca por el nombre COMPLETO primero y recién
   después por la clave corta — ver el comentario de los pares en cargarPadron. */
function fichaDe(h){
  if(h.id && idxId[h.id]) return idxId[h.id];
  return idxNom[normNom(h.alumno)] || idxNom[keyAlumno(h.alumno)] || null;
}
/* Las claves de Firebase no aceptan puntos ni barras. */
function claveTipo(t){ return String(t||'(sin tipo)').trim().replace(/[.#$/\[\]]/g,'_')||'(sin tipo)'; }
function aporteDe(tipo){
  var t=tipos[claveTipo(tipo)];
  return t && t.aporte ? +t.aporte : 0;
}

/* ============================================================
   EL POZO DE LOS PROFESORES

   · La bolsa de una hora se arma con lo que aportan las clases QUE SE COBRAN
     de esa hora, juntando las tres sedes.
   · Se reparte en partes iguales entre todos los profes que TENÍAN CLASE esa
     hora, hayan venido sus alumnos o no. El profe cuyos alumnos faltaron igual
     estuvo trabajando: hay 85 horas así en el historial viejo.
   · No importa cuántos alumnos tuvo cada uno.
   · Si en una hora no se cobra ninguna clase, la bolsa es cero y nadie cobra.

   CAMBIÓ EL 1 DE AGOSTO DE 2026. Antes aportaban solo los alumnos PRESENTES.
   Eso dejaba afuera al que confirmó y no vino: se le cobraba la clase, pero
   esa plata no llegaba al profe, que había ido y esperado igual. Ahora el
   criterio es uno solo y más simple: LO QUE SE LE COBRA AL ALUMNO ES LO QUE
   APORTA. Si la administración marca una clase "no se cobra" —fuerza mayor,
   un aviso a tiempo— deja de aportar sola, sin tocar nada más.

   Ojo con las comparaciones viejas: la verificación contra los tres meses de
   Bookit se hizo con la regla anterior. Con esta, los montos de los profesores
   SUBEN respecto de esa verificación, y es correcto que suban.
   ============================================================ */
function calcularPozo(filas){
  var horas={};
  /* Los bloques de Alto Rendimiento vacíos, contados una sola vez por
     fecha+hora+profe: el mismo bloque puede venir en varias filas. */
  var bloquesARvistos={}, arPorProfe={};
  filas.forEach(function(h){
    var k=h.fecha+'|'+h.hora;
    if(!horas[k]) horas[k]={fecha:h.fecha, hora:h.hora, total:0, profes:{}, presentes:0, clases:0, sinTipo:0, estacionados:0, ayudas:0, decorativos:0, coach:0, bloquesAR:0, porClase:{}};
    var b=horas[k];
    /* Una columna que no es un profesor no trabaja: ni cobra parte del pozo, ni
       lo que aporta el alumno estacionado ahí engorda la bolsa de los demás. */
    if(esColumnaSinProfe(h.profe)){ b.estacionados++; return; }
    if(esAyudante(h)){ if(h.profe) b.profes[h.profe]=true; b.ayudas++; return; }
    /* ============================================================
       EL BLOQUE DE ALTO RENDIMIENTO VACÍO

       El profe trabaja esa hora, así que entra al reparto. El bloque en sí no
       aporta: lo que aporta son sus alumnos, que llegan en filas propias con su
       tipo AR60 o AR30.

       Pero si al bloque nadie le cargó los alumnos, esas filas propias NO
       EXISTEN. Entonces el profe se lleva su parte de la hora aportando cero, y
       esa plata sale de los otros profes que sí llenaron la bolsa. Medido sobre
       14 días reales: Gs 4.144.579 movidos desde 8 profes hacia los 3 que dan
       AR, con los 63 bloques vacíos.

       No se cambia el reparto —el profe SÍ trabajó esa hora— pero se cuenta,
       para que deje de pasar en silencio y se vea en "Para corregir". */
    if(esBloqueAR(h.alumno)){
      if(h.profe) b.profes[h.profe]=true;
      b.bloquesAR++;
      if(!bloquesARvistos[h.fecha+'|'+h.hora+'|'+h.profe]){
        bloquesARvistos[h.fecha+'|'+h.hora+'|'+h.profe]=true;
        arPorProfe[h.profe]=(arPorProfe[h.profe]||0)+1;
      }
      return;
    }
    /* Un casillero decorativo no es una clase: no aporta y no da hora trabajada. */
    if(esBloque(h.alumno)){ b.decorativos++; return; }
    /* El coach es del profesor, no de la academia: ni aporta ni da hora trabajada. */
    if(esCoach(h)){ b.coach++; return; }
    b.clases++;
    if(h.profe) b.profes[h.profe]=true;
    /* Quién estuvo esa hora por una CLASE de verdad, no solo por un bloque.
       Sirve para saber, más abajo, a quién le cambiaría el pago si los bloques
       vacíos dejaran de contar. */
    if(h.profe) b.porClase[h.profe]=true;
    if(h.presente) b.presentes++;
    /* LO QUE SE COBRA ES LO QUE APORTA.

       No es lo mismo que "vino". Un alumno que confirmó y faltó sin avisar se
       le cobra igual, y esa plata entra en la bolsa de esa hora: el profe fue,
       esperó, y el cupo quedó ocupado. No es culpa suya que el alumno no viniera.

       Si es un caso de fuerza mayor, la administración lo marca "no se cobra"
       desde el historial del alumno, y ahí deja de aportar automáticamente:
       no hay que tocar nada más.

       Antes aportaban solo los presentes, así que esa plata se cobraba pero
       el profe no veía un peso de ella. */
    if(h.seCobra){
      var ap=aporteDe(h.tipo);
      if(!ap) b.sinTipo++;
      b.total+=ap;
    }
  });
  var porProfe={}, sinTipoTotal=0, totalPozo=0, decorativosTotal=0, coachTotal=0;
  Object.keys(horas).forEach(function(k){
    var b=horas[k], ps=Object.keys(b.profes);
    sinTipoTotal+=b.sinTipo;
    decorativosTotal+=b.decorativos;
    coachTotal+=b.coach;
    if(!ps.length || !b.total) return;
    b.parte=b.total/ps.length;
    totalPozo+=b.total;
    ps.forEach(function(p){
      if(!porProfe[p]) porProfe[p]={profe:p, monto:0, horas:0, clases:0, presentes:0};
      porProfe[p].monto+=b.parte;
      porProfe[p].horas++;
    });
  });
  filas.forEach(function(h){
    if(esColumnaSinProfe(h.profe)) return;
    if(esAyudante(h)){ if(porProfe[h.profe]) porProfe[h.profe].ayudas=(porProfe[h.profe].ayudas||0)+1; return; }
    /* Ni el bloque de alto rendimiento ni los casilleros decorativos cuentan
       como una clase dada: el bloque ya se abre en una fila por alumno. */
    if(esBloqueAR(h.alumno) || esBloque(h.alumno)) return;
    if(esCoach(h)) return;   // no es una clase de la academia
    if(h.profe && porProfe[h.profe]){
      porProfe[h.profe].clases++;
      if(h.presente) porProfe[h.profe].presentes++;
    }
  });

  /* ============================================================
     CUÁLES DE ESOS BLOQUES ESTÁN VACÍOS, Y CUÁNTO MUEVEN

     Un bloque tiene sus alumnos cargados si en la misma fecha+hora+profe hay
     filas con tipo AR (AR60 / AR30). Si no hay ninguna, el bloque está vacío:
     el profe cobra su parte de esa hora sin haber aportado nada.

     Para saber cuánto pesa se recalcula el reparto SIN los bloques vacíos y se
     compara. Lo que un profe cobra de más es exactamente lo que los demás
     cobran de menos. */
  var conAlumnosAR={};
  filas.forEach(function(h){
    /* AR60 y AR30, con numero: la fila del BLOQUE tiene tipo 'AR' pelado y no
       cuenta como alumno. Sin el digito, el bloque se contaba a si mismo como
       si tuviera gente adentro y nunca aparecia como vacio. */
    if(/^AR\d/i.test(String(h.tipo||'').trim())) conAlumnosAR[h.fecha+'|'+h.hora+'|'+h.profe]=true;
  });
  var arVacios=0, arVaciosPorProfe={};
  Object.keys(bloquesARvistos).forEach(function(k){
    if(conAlumnosAR[k]) return;
    arVacios++;
    var p=k.split('|')[2];
    arVaciosPorProfe[p]=(arVaciosPorProfe[p]||0)+1;
  });

  /* Cuánto mueve: el mismo reparto pero sacando los bloques vacíos del conteo
     de profes de cada hora. */
  var desvio={};
  if(arVacios){
    var sinVacios={};
    Object.keys(horas).forEach(function(k){
      var b=horas[k], ps=Object.keys(b.profes).filter(function(p){
        /* Se saca al profe solo si en esa hora SOLO estaba por un bloque vacío. */
        if(!bloquesARvistos[b.fecha+'|'+b.hora+'|'+p]) return true;
        if(conAlumnosAR[b.fecha+'|'+b.hora+'|'+p]) return true;
        return b.porClase && b.porClase[p];
      });
      if(!ps.length || !b.total) return;
      var parte=b.total/ps.length;
      ps.forEach(function(p){ sinVacios[p]=(sinVacios[p]||0)+parte; });
    });
    Object.keys(porProfe).forEach(function(p){
      var d=(sinVacios[p]||0)-porProfe[p].monto;
      if(Math.abs(d)>=1) desvio[p]=d;
    });
  }

  return { horas:horas, porProfe:porProfe, total:totalPozo, clasesSinTipo:sinTipoTotal,
           decorativos:decorativosTotal, coach:coachTotal,
           arVacios:arVacios, arVaciosPorProfe:arVaciosPorProfe, arDesvio:desvio };
}

/* ============================================================
   LOS ALUMNOS, MES POR MES

   Se cobra lo que ya decidió el cierre del día (columna Cobro del HISTORIAL):
   el que vino, y el que dijo que venía y no vino. Acá no se vuelve a decidir
   nada, solo se le pone precio.
   ============================================================ */
function armarAlumnos(){
  var mapa={}, meses={};
  historial.forEach(function(h){
    if(!h.seCobra) return;
    if(esAyudante(h) || esBloque(h.alumno)) return;   // no son alumnos
    if(esCoach(h)) return;                            // el coach tiene su propio precio
    var f=fichaDe(h);
    var k=f?(f.id||keyAlumno(f.nombre)):('?'+keyAlumno(h.alumno));
    if(!mapa[k]) mapa[k]={ k:k, nombre:f?f.nombre:h.alumno, ficha:f, meses:{}, total:0 };
    var a=mapa[k], m=mesDe(h.fecha);
    meses[m]=true;
    if(!a.meses[m]) a.meses[m]={ clases:0, dias:{} };
    a.meses[m].clases++;
    a.meses[m].dias[h.fecha]=(a.meses[m].dias[h.fecha]||0)+1;
    a.total++;
  });
  /* La planilla del sistema viejo se suma ACA, despues del historial propio:
     asi se rearma sola cada vez que llegan datos nuevos de Firebase. */
  try{ planSumar(mapa, meses); }catch(e){ console.warn('planilla:', e.message); }
  ALUMNOS=Object.keys(mapa).map(function(k){ return mapa[k]; })
    .sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  MESES_HAY=Object.keys(meses).sort();
}

/* Cuánto se le cobra a un alumno por los meses elegidos.
   Un precio de más de 500.000 es un abono mensual mal cargado en la casilla del
   precio por clase: no se multiplica por clase, se cobra una vez por mes. */
function cobroDe(a, mesesSel){
  var f=a.ficha;
  var clases=0, planClases=0, planMonto=0, planConPrecio=0, planIndiv=0;
  mesesSel.forEach(function(m){
    var mm=a.meses[m]; if(!mm) return;
    clases        += mm.clases;
    planClases    += (mm.planClases||0);
    planMonto     += (mm.planMonto||0);
    planConPrecio += (mm.planConPrecio||0);
    planIndiv     += (mm.planIndiv||0);
  });
  /* Las clases que salen de la PLANILLA ya vienen con el precio real que
     cobro el sistema viejo, clase por clase. Para esas no se usa el padron:
     usar el padron seria recalcular algo que ya esta calculado, y le erraria
     a todo el que tenga un precio negociado. El padron se usa solo para las
     clases del historial propio. */
  /* `propias` = las que las cobra el PADRON. Son todas menos las que vinieron
     con su propio precio adentro del archivo. Con el reporte de profesores
     eso da cero, y entonces las cobra todas el padron. */
  var propias = clases - planConPrecio;
  var extra = { planClases:planClases, planMonto:planMonto, propias:propias,
                planConPrecio:planConPrecio, planIndiv:planIndiv };
  /* La BECA se mira ANTES que la planilla, a proposito. Con la planilla
     adelante, un alumno marcado como becado en el padron podia terminar con
     un monto arriba de cero si el sistema viejo le habia cobrado algo, y de
     ahi sale un mensaje de WhatsApp pidiendole plata a alguien que no paga.
     Entre cobrarle de mas a un becado y no cobrarle a alguien que debe, el
     error caro es el primero: uno lo ve el alumno, el otro lo ve Diego. */
  if(f && f.beca) return Object.assign({ estado:'beca', clases:clases, total:0 }, extra);
  if(planConPrecio && !propias)
    return Object.assign({ estado:'planilla', clases:clases, total:planMonto }, extra);
  if(!f) return Object.assign({ estado:'nopadron', clases:clases, total:planMonto }, extra);
  if(!f.precio) return Object.assign({ estado:'sinprecio', clases:clases, total:planMonto }, extra);
  if(f.precio>TOPE_ABONO) return Object.assign({ estado:'abono', clases:clases, precio:f.precio,
                                   total:f.precio*mesesSel.length, meses:mesesSel.length }, extra);
  /* Mezcla: los dias viejos con el precio de la planilla y los nuevos con el
     del padron. Se muestran las dos partes para que se vea de donde sale cada
     guarani. */
  if(planConPrecio)
    return Object.assign({ estado:'mixto', clases:clases, precio:f.precio,
                           total:f.precio*propias + planMonto }, extra);
  return Object.assign({ estado:'ok', clases:clases, precio:f.precio, total:f.precio*clases }, extra);
}

function filasDelMes(mes){
  if(!mes) return historial;
  return historial.filter(function(h){ return mesDe(h.fecha)===mes; });
}

/* ============================================================
   CUÁNDO SE ACTUALIZA CADA COSA

   Tres velocidades, y conviene tenerlas claras:

   · Precio, tipo y teléfono de un alumno → AL INSTANTE. La app de Alumnos los
     escribe en `alumnos_v2` y acá se escucha ese cajón en vivo.
   · Los aportes de los tipos de clase → AL INSTANTE, también en vivo.
   · Las clases y si se cobran → hasta 30 MINUTOS. Vienen de la planilla, y un
     script de Google copia HISTORIAL a Firebase cada media hora. Eso no se puede
     apurar desde acá: el botón vuelve a leer la copia, pero si el script todavía
     no corrió, la copia sigue siendo la misma.

   Por eso el cartel de arriba dice de cuándo son los datos: es lo único que el
   sistema realmente sabe.
   ============================================================ */
function haceCuanto(iso){
  if(!iso) return '';
  var t=new Date(iso).getTime();
  if(isNaN(t)) return '';
  var min=Math.round((Date.now()-t)/60000);
  if(min<1) return 'recién';
  if(min===1) return 'hace 1 minuto';
  if(min<60) return 'hace '+min+' minutos';
  var h=Math.round(min/60);
  return h===1 ? 'hace 1 hora' : 'hace '+h+' horas';
}

function pintarFrescura(){
  var e=$('frescuraTxt'); if(!e) return;
  var partes=[];
  var h=haceCuanto(histActualizado);
  var p=haceCuanto(padActualizado);
  var viejo = function(iso){
    var t=new Date(iso).getTime();
    return iso && !isNaN(t) && (Date.now()-t)/60000 > 45;
  };
  partes.push('Clases y cobros: <b'+(viejo(histActualizado)?' class="viejo"':'')+'>'+
    (h||'sin fecha')+'</b>');
  partes.push('padrón: <b'+(viejo(padActualizado)?' class="viejo"':'')+'>'+(p||'sin fecha')+'</b>');
  partes.push('precios y tipos: <b>en vivo</b>');
  e.innerHTML=partes.join(' · ');
}

/* ============================================================
   LAS MARCAS DE PAGO, POR FECHA

   Hasta ahora no existia en NINGUN lado el dato de quien pago que: ni en este
   sistema ni en el viejo (su modulo de Pagos tiene 2 registros, los dos de
   2025). Se cobraba de memoria.

   Se guarda una marca por ALUMNO y FECHA en `pagos_v1/<alumno>/<fecha>`:

       { v: true|false, ts: <milisegundos>, por: <correo> }

   POR QUE SE GUARDA EL "NO" Y NO SE BORRA LA MARCA
   La herramienta provisoria borraba la llave al desmarcar y despues fusionaba
   lo local con la nube sumando las dos (`Object.assign`). Como la nube todavia
   tenia el `true`, la marca VOLVIA SOLA: desmarcar era imposible, rebotaba
   siempre. Guardando el `false` con su hora, el ultimo que toca manda, y
   desmarcar funciona igual de bien que marcar.

   El MES no se marca aparte: se deduce. Si estan pagadas todas las fechas del
   mes, el mes esta pagado. Una marca menos que mantener y una contradiccion
   menos posible (mes pagado con fechas sin pagar).
   ============================================================ */
var PAGOS = {};          // { alumnoK: { 'YYYY-MM-DD': {v,ts,por} } }
var _pagoEnVuelo = {};   // para no repintar en gris dos veces la misma celda

/* La clave del alumno tal cual va en Firebase. Firebase NO admite . $ # [ ] /
   en las claves; keyAlumno ya deja solo letras, numeros y espacios, y el id
   es A####, asi que en la practica no cambia nada. Pero tiene que pasar por
   ACA las dos veces: al leer y al escribir. Codificar solo al escribir hacia
   que la marca no se encontrara al recargar y pareciera que no se guardo. */
function clavePago(k){
  return String(k==null?'':k).replace(/[.$#\[\]\/]/g, '_');
}

function estaPagado(k, fecha){
  var a = PAGOS[clavePago(k)];
  return !!(a && a[fecha] && a[fecha].v === true);
}

/* Un mes esta pagado cuando lo estan TODAS sus fechas. Sin fechas no hay mes
   pagado: si no dio clases, no hay nada que cobrar ni que marcar. */
function mesPagado(a, m){
  var mm = a && a.meses[m];
  if(!mm) return false;
  var ds = Object.keys(mm.dias);
  if(!ds.length) return false;
  for(var i=0;i<ds.length;i++){ if(!estaPagado(a.k, ds[i])) return false; }
  return true;
}
function mesesPagados(a, sel){
  if(!sel || !sel.length) return false;
  for(var i=0;i<sel.length;i++){ if(!mesPagado(a, sel[i])) return false; }
  return true;
}

/* Marcar / desmarcar una fecha. Se pinta al instante y se confirma cuando
   Firebase contesta; si falla, se avisa y se vuelve atras. */
function togglePago(k, fecha){
  if(!puedeEditar) return;
  var llave = k + '|' + fecha;
  if(_pagoEnVuelo[llave]) return;
  var nuevo = !estaPagado(k, fecha);
  _pagoEnVuelo[llave] = true;
  var kf = clavePago(k);
  if(!PAGOS[kf]) PAGOS[kf] = {};
  var antes = PAGOS[kf][fecha];
  PAGOS[kf][fecha] = { v:nuevo, ts:Date.now(), por:miCorreo };
  pintarFicha();
  firebase.database().ref('pagos_v1/'+kf+'/'+fecha)
    .set({ v:nuevo, ts:Date.now(), por:miCorreo })
    .then(function(){ delete _pagoEnVuelo[llave]; })
    .catch(function(e){
      delete _pagoEnVuelo[llave];
      if(antes) PAGOS[kf][fecha] = antes; else delete PAGOS[kf][fecha];
      pintarFicha();
      alert('No pude guardar la marca de pago.\n\n'+e.message+'\n\nSi dice "permission denied", falta publicar la regla de pagos_v1.');
    });
}

/* ============================================================
   LA PLANILLA DEL SISTEMA VIEJO — SE CARGA A MANO, NO SE GUARDA

   El historial propio (historial_v2) arranca el 25/08/2026. Todo lo de antes
   vive en el sistema viejo, y de ahi sale el reporte "Monto por Alumnos"
   (Informes -> Monto por Alumnos -> Descargar xlsx, guardado como CSV).

   POR QUE ESE REPORTE Y NO EL OTRO
   Hay dos gemelos. El de PROFESORES trae, entre parentesis, lo que cobra el
   PROFE; el de ALUMNOS trae lo que paga el ALUMNO. Con el de profes no se puede
   deducir el precio: hay 25 tipos de clase y varios comparten monto (solo en
   50.000 hay siete). Con el de alumnos no hay nada que deducir, el precio viene
   clase por clase.

   POR QUE NO SE GUARDA EN FIREBASE
   Decision de Jose (26/08/2026): la planilla cambia todos los dias y se carga a
   mano, como en la herramienta provisoria. Mas adelante se decide si se
   incorpora o no.

   Y NO HACE FALTA QUE SE GUARDE: las marcas de pago se guardan con la llave
   `alumno + fecha`, no con la fila del archivo. Cargas la planilla de hoy,
   marcas lo cobrado, manana cargas la planilla nueva -- con mas dias y con
   correcciones -- y las marcas de ayer siguen en su lugar.

   Queda en localStorage nada mas para que refrescar la pagina no te obligue a
   volver a cargar el archivo. Es de esta computadora y de nadie mas.
   ============================================================ */
var PLANILLA = null;   // { clases:[{fecha,hora,nombre,monto,k}], desde, hasta, cargadaTs, sinCruzar:[] }
var PLAN_LLAVE = 'caja_planilla_v1';

/* ---------- Lector de CSV que respeta las comillas ----------
   El campo Estudiantes trae comas adentro ("Juan (90.000), Ana (90.000)"), asi
   que partir por coma a secas rompe todo. */
function planCsvFilas(txt){
  var filas=[], fila=[], campo='', enComillas=false, i=0;
  txt = String(txt||'').replace(/^﻿/, '');
  while(i < txt.length){
    var c = txt[i];
    if(enComillas){
      if(c === '"'){
        if(txt[i+1] === '"'){ campo+='"'; i+=2; continue; }
        enComillas=false; i++; continue;
      }
      campo+=c; i++; continue;
    }
    if(c === '"'){ enComillas=true; i++; continue; }
    if(c === ','){ fila.push(campo); campo=''; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){ fila.push(campo); filas.push(fila); fila=[]; campo=''; i++; continue; }
    campo+=c; i++;
  }
  if(campo.length || fila.length){ fila.push(campo); filas.push(fila); }
  return filas.filter(function(f){ return f.length>1 || (f[0]||'').trim(); });
}

/* La fecha viene DD/MM/AAAA y adentro se trabaja con AAAA-MM-DD. */
function planFecha(s){
  var m = String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return '';
  return m[3] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[1]).slice(-2);
}
function planMonto(s){
  var d = String(s==null?'':s).replace(/[^\d]/g,'');
  return d ? +d : 0;
}

/* ---------- El cruce de nombres contra el padron ----------
   Tres pasadas, de la mas segura a la menos:
     1. EXACTO por el indice que ya usa Caja
     2. POR LETRAS, para los errores de tipeo ("Rosti Vaselinov" -> "Veselinov")
     3. POR PALABRAS, para los nombres largos o dados vuelta
        ("Jose Fabrizio Bareiro Leon" -> "Fabrizio Bareiro")

   La tercera hace falta de verdad: sin ella quedan afuera 917 clases medidas
   sobre el reporte de junio a agosto, porque la distancia por letras corta
   cuando los largos se diferencian en mas de 4 y esos nombres se diferencian
   en mucho mas. */
function planDistancia(a,b){
  if(a===b) return 1;
  var m=a.length, n=b.length;
  if(!m || !n || Math.abs(m-n)>4) return 0;
  var prev=[], cur=[], i, j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    var t=prev; prev=cur; cur=t;
  }
  return 1 - prev[n]/Math.max(m,n);
}
function planPalabras(s){
  return String(s||'').split(' ').filter(function(w){ return w.length>2; });
}
var _planCache = {};
function planCruzar(nombre){
  var exacta = normNom(nombre);
  if(_planCache[exacta] !== undefined) return _planCache[exacta];
  var f = idxNom[exacta] || idxNom[keyAlumno(nombre)] || null;
  if(f){ _planCache[exacta]=f; return f; }

  var base = keyAlumno(nombre), mejor=null, mejorV=0, i;
  /* 2) por letras */
  for(i=0;i<padron.length;i++){
    var p=padron[i]; if(!p.nombre) continue;
    var v = planDistancia(base, keyAlumno(p.nombre));
    if(v>mejorV){ mejorV=v; mejor=p; }
  }
  if(mejor && mejorV>=0.93){ _planCache[exacta]=mejor; return mejor; }

  /* 3) por palabras: TODAS las palabras del mas corto tienen que estar en el
     otro, y tienen que ser al menos dos. Con una sola palabra en comun
     ("Maria Lopez" y "Maria Gonzalez") se pegarian dos personas distintas. */
  var tn = planPalabras(base), best=null, bestLen=0;
  if(tn.length>=2){
    for(i=0;i<padron.length;i++){
      var q=padron[i]; if(!q.nombre) continue;
      var tp = planPalabras(keyAlumno(q.nombre));
      if(tp.length<2) continue;
      var corto = tn.length<=tp.length ? tn : tp;
      var largo = tn.length<=tp.length ? tp : tn;
      var todas=true;
      for(var z=0;z<corto.length;z++){ if(largo.indexOf(corto[z])<0){ todas=false; break; } }
      if(todas && corto.length>bestLen){ bestLen=corto.length; best=q; }
    }
  }
  _planCache[exacta] = best;
  return best;
}

/* ---------- Leer el archivo ---------- */
function planLeer(txt){
  var filas = planCsvFilas(txt);
  if(!filas.length) throw new Error('el archivo esta vacio');
  var cab = filas[0].map(function(c){ return String(c||'').trim().toLowerCase(); });
  var iHora=cab.indexOf('hora'), iFecha=cab.indexOf('fecha'), iAl=cab.indexOf('estudiantes');
  if(iFecha<0 || iAl<0){
    throw new Error('no encuentro las columnas Fecha y Estudiantes.\n\n' +
                    'Tiene que ser el reporte de Informes -> Monto por Alumnos.');
  }
  /* LOS DOS REPORTES SIRVEN, Y SE USAN DISTINTO.

     - Monto por PROFESORES (el que se usa todos los dias): entre parentesis va
       lo que cobra el PROFE. NO sirve para cobrarle al alumno, pero sirve para
       dos cosas: contar cuantas veces vino, y saber cuales fueron INDIVIDUALES.
       De toda la tabla de aportes, 70.000 es el unico monto que no se repite:
       solo lo tiene la individual. Los demas se pisan entre si (50.000 es
       grupal, dual y chicos individual; 30.000 es primera, chicos y profesores),
       asi que con esos no se puede saber el tipo sin adivinar, y adivinar aca
       termina en una clase mal cobrada. El precio sale del padron.
     - Monto por ALUMNOS: entre parentesis va lo que paga el ALUMNO, clase por
       clase. Ahi no hay nada que deducir ni que buscar en el padron.
     Se reconocen por la columna PROFES, que solo trae el de alumnos. */
  var esDeAlumnos = cab.indexOf('profes') >= 0;

  var rx = /([^,(]+?)\s*\(([\d.]+)\)/g;
  var clases=[], f, m, fecha, hora, desde='', hasta='';
  for(var r=1;r<filas.length;r++){
    f = filas[r];
    fecha = planFecha(f[iFecha]); if(!fecha) continue;
    hora = String(f[iHora]||'').trim();
    if(!desde || fecha<desde) desde=fecha;
    if(!hasta || fecha>hasta) hasta=fecha;
    rx.lastIndex=0;
    while((m = rx.exec(String(f[iAl]||'')))){
      var nom = m[1].replace(/^[\s,]+|[\s,]+$/g,'');
      if(!nom) continue;
      var mon = planMonto(m[2]);
      clases.push({ fecha:fecha, hora:hora, nombre:nom, monto:mon,
        /* Solo en el reporte de profes el monto delata el tipo. En el de alumnos
           el monto ES el precio, y no se deduce nada. */
        indiv: (!esDeAlumnos && mon === 70000) });
    }
  }
  if(!clases.length) throw new Error('no encontre ninguna clase adentro del archivo');
  return { clases:clases, desde:desde, hasta:hasta, esDeAlumnos:esDeAlumnos, cargadaTs:Date.now() };
}

/* ---------- Meter la planilla adentro de los alumnos ----------
   Se llama al final de armarAlumnos, asi que se rearma sola cada vez que
   cambian los datos de Firebase.

   LA REGLA CONTRA EL DOBLE CONTEO: si una FECHA ya viene del historial propio,
   la planilla no la toca. El historial es el que manda para los dias que
   cubre; la planilla solo aporta los dias de antes. Sin esto, los dias en que
   los dos se pisan se cobrarian dos veces. */
function planSumar(mapa, meses){
  if(!PLANILLA || !PLANILLA.clases.length) return;
  var fechasPropias = {};
  historial.forEach(function(h){ if(h.fecha) fechasPropias[h.fecha]=true; });

  var sinCruzar = {};
  PLANILLA.clases.forEach(function(c){
    if(fechasPropias[c.fecha]) return;              // ese dia ya lo tiene el historial
    var ficha = planCruzar(c.nombre);
    if(!ficha) sinCruzar[c.nombre] = (sinCruzar[c.nombre]||0)+1;
    var k = ficha ? (ficha.id || keyAlumno(ficha.nombre)) : ('?'+keyAlumno(c.nombre));
    if(!mapa[k]) mapa[k] = { k:k, nombre: ficha?ficha.nombre:c.nombre, ficha:ficha,
                             meses:{}, total:0 };
    var a = mapa[k], mm = c.fecha.slice(0,7);
    meses[mm] = true;
    if(!a.meses[mm]) a.meses[mm] = { clases:0, dias:{} };
    a.meses[mm].clases++;
    a.meses[mm].dias[c.fecha] = (a.meses[mm].dias[c.fecha]||0)+1;
    a.meses[mm].planClases = (a.meses[mm].planClases||0)+1;
    if(c.indiv) a.meses[mm].planIndiv = (a.meses[mm].planIndiv||0)+1;
    /* LA PLATA SOLO SALE DEL ARCHIVO CUANDO EL ARCHIVO LA TRAE.
       En el reporte de ALUMNOS el monto es lo que paga el alumno: se usa tal
       cual. En el de PROFESORES es lo que cobra el profe, y usarlo para cobrar
       seria cobrarle de menos a todo el mundo: ahi la clase queda SIN precio
       propio y la cobra el padron, como corresponde. */
    if(PLANILLA.esDeAlumnos){
      a.meses[mm].planConPrecio = (a.meses[mm].planConPrecio||0)+1;
      a.meses[mm].planMonto     = (a.meses[mm].planMonto||0) + (c.monto||0);
    }
    a.total++;
  });
  PLANILLA.sinCruzar = Object.keys(sinCruzar).sort(function(x,y){
    return sinCruzar[y]-sinCruzar[x];
  }).map(function(n){ return { nombre:n, veces:sinCruzar[n] }; });
}

/* ---------- Cargar / descargar ---------- */
function planGuardarLocal(txt){
  try{ localStorage.setItem(PLAN_LLAVE, txt); }
  catch(e){
    /* Si no entra, se avisa: quedarse callado haria creer que manana la planilla
       sigue cargada cuando en realidad se perdio al refrescar. */
    alert('La planilla se cargo, pero no la pude dejar guardada en esta computadora'+
          ' (' + e.message + ').\n\nVa a andar igual hasta que refresques la pagina.');
  }
}
function planCargarTexto(txt, guardar){
  var p = planLeer(txt);
  /* Los dos reportes se cargan sin preguntar nada: cada uno se usa como
     corresponde. Antes esto frenaba con un cartel al reporte de PROFESORES,
     que es justamente el que se usa todos los dias. */
  PLANILLA = p;
  _planCache = {};
  if(guardar) planGuardarLocal(txt);
  armarAlumnos();
  pintar();
  planPintarBarra();
  return true;
}
function planSacar(){
  if(!confirm('Sacar la planilla cargada?\n\nLas marcas de pago NO se tocan: estan guardadas' +
              ' por alumno y fecha, no dependen del archivo.')) return;
  PLANILLA = null; _planCache = {};
  try{ localStorage.removeItem(PLAN_LLAVE); }catch(e){}
  armarAlumnos(); pintar(); planPintarBarra();
}
function planRecuperar(){
  try{
    var t = localStorage.getItem(PLAN_LLAVE);
    if(t) PLANILLA = planLeer(t);
  }catch(e){ console.warn('planilla guardada:', e.message); PLANILLA=null; }
}

/* ---------- La barra de arriba ---------- */
function planPintarBarra(){
  var el = document.getElementById('planBarra');
  if(!el) return;
  if(!PLANILLA){
    el.innerHTML = '<span class="planTxt">Cobrando solo con el historial propio, del 25/08 en adelante. ' +
      'Para ver lo de antes, carga la planilla del sistema viejo.</span>' +
      '<button class="chico" id="planCargar">Cargar planilla</button>';
  } else {
    var n = PLANILLA.clases.length;
    var afuera = (PLANILLA.sinCruzar||[]).reduce(function(s,x){ return s+x.veces; }, 0);
    var indiv = PLANILLA.clases.filter(function(c){ return c.indiv; }).length;
    /* Se dice cual de los dos reportes es, porque cambia de donde sale el
       precio: el de alumnos lo trae adentro, el de profesores lo saca del
       padron. Si no se dice, no hay forma de saber por que un mes cobra
       distinto que otro. */
    el.innerHTML = '<span class="planTxt"><b>Planilla cargada</b> · ' + gs(n) +
      ' clases · del ' + PLANILLA.desde + ' al ' + PLANILLA.hasta + '<br>' +
      (PLANILLA.esDeAlumnos
        ? 'Reporte de <b>alumnos</b>: el precio viene en el archivo.'
        : 'Reporte de <b>profesores</b>: cuenta las clases y marca las individuales; el precio sale del padrón.') +
      (indiv ? ' · <b>' + gs(indiv) + '</b> individuales' : '') +
      (afuera ? ' · <span class="planAviso">' + gs(afuera) + ' sin cruzar con el padrón</span>' : '') +
      '</span>' +
      '<button class="chico" id="planCargar">Cambiar</button>' +
      '<button class="chico" id="planSacar">Sacar</button>';
  }
  var b1 = document.getElementById('planCargar');
  if(b1) b1.onclick = function(){ document.getElementById('planArchivo').click(); };
  var b2 = document.getElementById('planSacar');
  if(b2) b2.onclick = planSacar;
}
function planEnganchar(){
  var inp = document.getElementById('planArchivo');
  if(!inp) return;
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{ planCargarTexto(String(fr.result||''), true); }
      catch(e){ alert('No pude leer la planilla.\n\n' + e.message); }
      inp.value = '';
    };
    fr.onerror = function(){ alert('No pude abrir el archivo.'); inp.value=''; };
    fr.readAsText(f, 'utf-8');
  };
}

    parsearHistorialV2(s.val()); datosLlegaron();
  }, function(e){ console.warn('historial_v2:', e.message); });

  /* Las marcas de pago llegan solas: si el otro marca en su maquina, aca se
     ve al instante. Firebase es la unica verdad, no se fusiona nada a mano
     (ese fue el error de la herramienta provisoria). */
  db.ref('pagos_v1').on('value', function(s){
    PAGOS = s.val() || {};
    var ov=$('ov');
    if(ov && ov.classList.contains('show')) pintarFicha();
  }, function(e){ console.warn('pagos_v1:', e.message); });
}

/* El botón. Vuelve a pedir todo de cero, sin esperar. */
function refrescar(){
  if(refrescando) return;
  refrescando=true;
  var b=$('btnRefrescar');
  var antesH=histActualizado, antesP=padActualizado;
  b.disabled=true; b.textContent='Actualizando…';
  Promise.all([cargarPadron(), cargarHistorial(), cargarTipos(), cargarVivo(), cargarColumnas(), cargarNombres(), cargarClaveBorrado()]).then(function(){
    armarAlumnos(); pintar(); pintarFrescura(); planPintarBarra();
    b.disabled=false; b.textContent='🔄 Actualizar ahora';
    refrescando=false;
    if(antesH===histActualizado && antesP===padActualizado)
      toast('Ya estabas viendo lo último que hay');
    else
      toast('Datos actualizados');
  }).catch(function(){
    b.disabled=false; b.textContent='🔄 Actualizar ahora'; refrescando=false;
    toast('No pude actualizar');
  });
}

}
function engancharMes(){

}

function pintar(){
  if(solapa==='cobros') pantallaCobros();
  else if(solapa==='informes') pantallaInformes();

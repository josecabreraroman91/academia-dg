<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesos · Academia DG</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --linea:#30363d; --txt:#e6edf3;
    --sec:#8b949e; --azul:#2f81f7; --verde:#3fb950; --rojo:#f85149; --ambar:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}

  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:21px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--sec);font-size:13px}
  .yo{color:var(--sec);font-size:12px;margin:10px 0 22px}
  .yo a{color:var(--azul);text-decoration:none;margin-left:8px}

  .ficha{background:var(--panel);border:1px solid var(--linea);border-radius:12px;
    padding:14px;margin-bottom:14px}
  .ficha.baja{opacity:.55}
  .fhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .fnom-edit{font-family:inherit;font-size:15px;font-weight:700;width:100%;
    background:transparent;border:1px solid transparent;border-radius:8px;
    color:inherit;padding:5px 8px;margin:-5px 0 0 -8px}
  .fnom-edit:hover{border-color:var(--linea)}
  .fnom-edit:focus{border-color:var(--azul);background:var(--bg);outline:none}
  .fnom{font-weight:600;font-size:16px}
  .fmail{color:var(--sec);font-size:12.5px;word-break:break-all}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--linea);color:var(--sec)}
  .tag.super{color:var(--ambar);border-color:var(--ambar)}
  .tag.baja{color:var(--rojo);border-color:var(--rojo)}
  .spacer{flex:1}

  .mods{margin-top:14px;border-top:1px solid var(--linea);padding-top:6px}
  .mod{display:flex;align-items:center;gap:10px;padding:7px 0;flex-wrap:wrap}
  .mnom{flex:1;min-width:150px;font-size:14px}
  .mnom small{display:block;color:var(--sec);font-size:11.5px}
  .niv{display:flex;border:1px solid var(--linea);border-radius:8px;overflow:hidden}
  .niv button{background:transparent;border:0;color:var(--sec);font-size:12px;
    padding:6px 11px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .niv button+button{border-left:1px solid var(--linea)}
  .niv button.on{background:var(--azul);color:#fff;font-weight:600}
  .niv button.on.cero{background:#30363d;color:var(--txt)}

  .facc{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button.b{font-family:inherit;font-size:13.5px;padding:9px 16px;border-radius:8px;
    border:1px solid var(--linea);background:transparent;color:var(--txt);cursor:pointer}
  button.b.pri{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
  button.b.mal{color:var(--rojo);border-color:#5a2a2a}
  button.b:disabled{opacity:.4;cursor:default}

  .nuevo{background:var(--panel);border:1px dashed var(--linea);border-radius:12px;padding:14px;margin-bottom:22px}
  .nuevo input{width:100%;background:var(--bg);border:1px solid var(--linea);border-radius:8px;
    color:var(--txt);padding:10px 12px;font-family:inherit;font-size:14px;margin-bottom:8px}
  .aviso{font-size:12.5px;color:var(--sec);margin-top:8px}
  .err{color:var(--rojo);font-size:13px;margin-top:8px}
  .ok{color:var(--verde);font-size:13px;margin-top:8px}

  #cargando,#vacio{color:var(--sec);text-align:center;padding:40px 0}

  #login,#nopuede{position:fixed;inset:0;z-index:99;background:var(--bg);
    display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center}
  #login h2,#nopuede h2{margin:0 0 8px;font-size:20px}
  #login p,#nopuede p{color:var(--sec);max-width:340px;margin:0 0 22px}
</style>
</head>
<body>

<div id="login">
  <h2>Accesos · Academia DG</h2>
  <p>Este panel es solo para administradores.</p>
  <button class="b pri" id="btnEntrar">Entrar con Google</button>
  <div class="err" id="errLogin"></div>
</div>

<div id="nopuede">
  <h2>No tenés acceso a este panel</h2>
  <p id="nopuedeTxt"></p>
  <button class="b" id="btnSalir2">Salir</button>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <h1>Accesos</h1>
    <span class="sub">Quién entra a qué</span>
  </header>
  <div class="yo">Conectado como <b id="yoMail"></b><a href="#" id="btnSalir">Salir</a></div>

  <div class="nuevo">
    <div style="font-weight:600;margin-bottom:10px">Agregar una persona</div>
    <input id="nvMail" type="email" placeholder="correo@gmail.com" autocomplete="off">
    <input id="nvNom" type="text" placeholder="Nombre (por ejemplo: Marina)" autocomplete="off">
    <button class="b pri" id="btnAgregar">Agregar</button>
    <div class="aviso">Tiene que ser la cuenta de Google con la que va a entrar. Se agrega sin ningún permiso: se los das abajo.</div>
    <div class="err" id="errNuevo"></div>
  </div>

  <div id="cargando">Cargando…</div>
  <div id="lista"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCwHaVLIoFrXb2NFl9Od6j8LuLvklxpzRc",
  authDomain: "academia-dg.firebaseapp.com",
  databaseURL: "https://academia-dg-default-rtdb.firebaseio.com",
  projectId: "academia-dg",
  storageBucket: "academia-dg.firebasestorage.app",
  messagingSenderId: "623967243039",
  appId: "1:623967243039:web:e22397b466b63aefdf3e2a"
});

// Módulos del sistema. La clave es la que leen el hub y las reglas.
var MODULOS = [
  {k:'calendario',   n:'Calendario',    d:'Horarios del día, mensajes y reporte'},
  {k:'profes',       n:'Vista Profes',  d:'Asistencia desde la tablet'},
  {k:'alumnos',      n:'Alumnos',       d:'Listado y datos de alumnos'},
  {k:'pagos',        n:'Pagos a Profesores', d:''},
  {k:'cobros',       n:'Cobros',        d:'Consulta y registro de cobros'},
  {k:'nivelacion',   n:'Evaluación de alumnos', d:'Cargar evaluaciones'},
  {k:'agenda',       n:'Agendar alumnos', d:'Ver lugares libres y anotar alumnos nuevos desde el celular'},
  {k:'agente',       n:'Libreta del agente', d:'Ver lo que anota el agente de WhatsApp'},
  {k:'historial',    n:'Historial', d:'Ver quién hizo cada cambio: asistencias, movimientos, alumnos agendados'}
];
var NIVELES = [
  {v:'no',       t:'Sin acceso'},
  {v:'leer',     t:'Ver'},
  {v:'escribir', t:'Ver y editar'}
];

var $ = function(id){ return document.getElementById(id); };
var miCorreo = null;
var fichas = {};   // clave (con comas) -> ficha

function aClave(mail){ return String(mail).trim().toLowerCase().replace(/\./g, ','); }
function aCorreo(clave){ return String(clave).replace(/,/g, '.'); }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ---------- Pintar ----------
function pintar(){
  var claves = Object.keys(fichas).sort(function(a,b){
    return (fichas[a].nombre||a).localeCompare(fichas[b].nombre||b);
  });
  $('cargando').style.display='none';
  if(!claves.length){ $('lista').innerHTML='<div id="vacio">Todavía no hay nadie cargado.</div>'; return; }

  $('lista').innerHTML = claves.map(function(cl){
    var f = fichas[cl] || {};
    var p = f.permisos || {};
    var activo = f.activo === true;
    var admin  = p.admin === true;
    var yo = (aCorreo(cl) === miCorreo);

    var mods = MODULOS.map(function(m){
      var actual = p[m.k] || 'no';
      var botones = NIVELES.map(function(n){
        var on = (actual===n.v) ? (' on'+(n.v==='no'?' cero':'')) : '';
        return '<button class="'+on.trim()+'" data-cl="'+esc(cl)+'" data-mod="'+m.k+'" data-niv="'+n.v+'">'+n.t+'</button>';
      }).join('');
      return '<div class="mod"><div class="mnom">'+esc(m.n)+
             (m.d?'<small>'+esc(m.d)+'</small>':'')+
             '</div><div class="niv">'+botones+'</div></div>';
    }).join('');

    return '<div class="ficha'+(activo?'':' baja')+'" data-ficha="'+esc(cl)+'">'+
      '<div class="fhead" style="flex-wrap:wrap">'+
        '<div style="flex:1;min-width:0"><input class="fnom-edit" data-nom="'+esc(cl)+'" value="'+esc(f.nombre||'')+'" placeholder="Nombre de la persona"></div>'+
        '<div class="fmail">'+esc(aCorreo(cl))+'</div>'+
        '<div class="spacer"></div>'+
        (admin?'<span class="tag super">Super administrador</span>':'')+
        (activo?'':'<span class="tag baja">Dado de baja</span>')+
        (yo?'<span class="tag">Sos vos</span>':'')+
      '</div>'+
      '<div class="mods">'+mods+'</div>'+
      '<div class="facc">'+
        '<button class="b" data-acc="activo" data-cl="'+esc(cl)+'">'+(activo?'Dar de baja':'Reactivar')+'</button>'+
        '<button class="b" data-acc="admin" data-cl="'+esc(cl)+'">'+(admin?'Quitar super administrador':'Hacer super administrador')+'</button>'+
        '<div class="spacer"></div>'+
        '<button class="b mal" data-acc="borrar" data-cl="'+esc(cl)+'">Eliminar</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

// ---------- Guardar ----------
function guardar(cl){
  return firebase.database().ref('usuarios/'+cl).set(fichas[cl]);
}

function tocar(cl, cambio){
  var f = fichas[cl]; if(!f) return;
  cambio(f);
  pintar();
  guardar(cl).catch(function(e){ alert('No se pudo guardar: '+e.message); cargar(); });
}

/* El nombre se guarda mientras se escribe. Es el que se ve en el Historial,
   así que conviene que se pueda corregir sin entrar a Firebase. */
document.addEventListener('input', function(ev){
  var inp = ev.target.closest ? ev.target.closest('input[data-nom]') : null;
  if(!inp) return;
  var cl = inp.dataset.nom, f = fichas[cl];
  if(!f) return;
  clearTimeout(inp._t);
  inp._t = setTimeout(function(){
    var v = inp.value.trim();
    if(!v || v === f.nombre) return;
    f.nombre = v;
    guardar(cl).catch(function(e){ alert('No se pudo guardar el nombre: '+e.message); cargar(); });
  }, 700);
});
document.addEventListener('focusout', function(ev){
  var inp = ev.target.closest ? ev.target.closest('input[data-nom]') : null;
  if(!inp) return;
  var f = fichas[inp.dataset.nom];
  if(f && !inp.value.trim()) inp.value = f.nombre || '';
});

// ---------- Eventos ----------
document.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if(!b) return;

  // nivel de un módulo
  if(b.dataset.mod){
    tocar(b.dataset.cl, function(f){
      f.permisos = f.permisos || {};
      f.permisos[b.dataset.mod] = b.dataset.niv;
    });
    return;
  }

  var acc = b.dataset.acc; if(!acc) return;
  var cl = b.dataset.cl;
  var f = fichas[cl] || {};
  var esYo = (aCorreo(cl) === miCorreo);

  if(acc==='activo'){
    if(f.activo===true && esYo && !confirm('Te estás dando de baja a vos mismo. Vas a perder el acceso al panel.\n\n¿Seguro?')) return;
    tocar(cl, function(x){ x.activo = !(x.activo===true); });
  }

  if(acc==='admin'){
    var era = (f.permisos||{}).admin === true;
    if(era && esYo && !confirm('Te estás quitando el rol de super administrador.\n\n¿Seguro?')) return;
    tocar(cl, function(x){ x.permisos = x.permisos||{}; x.permisos.admin = !era; });
  }

  if(acc==='borrar'){
    if(esYo){ alert('No podés eliminar tu propia ficha.'); return; }
    if(!confirm('Eliminar a '+(f.nombre||aCorreo(cl))+' definitivamente?\n\nVa a perder el acceso al instante.')) return;
    firebase.database().ref('usuarios/'+cl).remove()
      .then(function(){ delete fichas[cl]; pintar(); })
      .catch(function(e){ alert('No se pudo eliminar: '+e.message); });
  }
});

$('btnAgregar').onclick = function(){
  var mail = $('nvMail').value.trim().toLowerCase();
  var nom  = $('nvNom').value.trim();
  $('errNuevo').textContent='';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ $('errNuevo').textContent='Ese correo no parece válido.'; return; }
  if(!nom){ $('errNuevo').textContent='Poné un nombre para reconocerlo después.'; return; }
  var cl = aClave(mail);
  if(fichas[cl]){ $('errNuevo').textContent='Esa persona ya está en la lista.'; return; }
  fichas[cl] = { nombre:nom, activo:true, permisos:{ admin:false } };
  guardar(cl).then(function(){
    $('nvMail').value=''; $('nvNom').value=''; pintar();
  }).catch(function(e){ $('errNuevo').textContent='No se pudo agregar: '+e.message; delete fichas[cl]; });
};

// ---------- Carga ----------
function cargar(){
  firebase.database().ref('usuarios').once('value').then(function(s){
    fichas = s.val() || {};
    pintar();
  }).catch(function(e){
    $('cargando').textContent = 'No se pudo leer la lista: '+e.message;
  });
}

$('btnEntrar').onclick = function(){
  $('errLogin').textContent='';
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(function(e){ $('errLogin').textContent='No se pudo entrar: '+e.message; });
};
$('btnSalir').onclick = function(e){ e.preventDefault(); firebase.auth().signOut().then(function(){ location.reload(); }); };
$('btnSalir2').onclick = function(){ firebase.auth().signOut().then(function(){ location.reload(); }); };

firebase.auth().onAuthStateChanged(function(u){
  if(!u){ $('login').style.display='flex'; $('nopuede').style.display='none'; $('app').style.display='none'; return; }
  miCorreo = u.email.toLowerCase();
  firebase.database().ref('usuarios/'+aClave(miCorreo)).once('value').then(function(s){
    var f = s.val();
    if(!f || f.activo!==true || !(f.permisos||{}).admin){
      $('login').style.display='none';
      $('nopuedeTxt').textContent = miCorreo;
      $('nopuede').style.display='flex';
      return;
    }
    $('login').style.display='none'; $('nopuede').style.display='none';
    $('app').style.display='block';
    $('yoMail').textContent = miCorreo;
    cargar();
  }).catch(function(e){
    $('login').style.display='none';
    $('nopuedeTxt').textContent = 'No se pudo verificar tu acceso. '+e.message;
    $('nopuede').style.display='flex';
  });
});
</script>
</body>
</html>

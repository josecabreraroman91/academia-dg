/* ============================================================
   GANANCIAS — cuánto lleva cobrado cada profesor

   Usa EXACTAMENTE la misma cuenta que la Caja, para que nunca den distinto:

     · La bolsa de cada hora se arma con lo que aportan los alumnos PRESENTES
       de esa hora, juntando las tres sedes.
     · Se reparte en partes iguales entre los profes que tenían clase esa hora.
     · Las columnas que no son un profesor (Sin profe) no cobran.
     · El profe ayudante cobra su parte aunque no tenga alumnos propios.

   Todos ven lo de todos: es un dato de la academia, no un secreto entre profes.
   Se actualiza solo, sin recargar.
   ============================================================ */

var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];

var $=function(id){ return document.getElementById(id); };
var miCorreo=null, miNombre='', miDim='';
var historial=[], tipos={}, profesores={}, noProfe={};
var rango='semana', desde='', hasta='';

function esc(t){ return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function aClave(m){ return String(m).trim().toLowerCase().replace(/\./g, ','); }
function gs(n){ return Math.round(n||0).toLocaleString('es-PY'); }
function soloDigitos(s){ return String(s==null?'':s).replace(/\D/g,''); }
function normNom(s){
  return String(s==null?'':s).replace(/\u2060/g,'').replace(/\u200b/g,'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
}
function fechaCorta(iso){
  var d=new Date(iso+'T00:00:00');
  return DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
}
function hoyISO(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function parseCSV(txt){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<txt.length;i++){ var c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

/* HISTORIAL: Fecha · Alumno · Hora · Sede · Profe · Tipo · Estado · Cobro · Motivo · ID */
function parsearHistorial(paq){
  if(!paq) return;
  var csv=(typeof paq==='string')?paq:paq.csv;
  if(!csv) return;
  var rows=parseCSV(csv); if(rows.length<2) return;
  historial=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    var fecha=(r[0]||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) continue;
    var nom=(r[1]||'').trim(); if(!nom) continue;
    var estado=(r[6]||'').trim();
    historial.push({
      fecha:fecha, alumno:nom, hora:(r[2]||'').trim(), sede:(r[3]||'').trim(),
      profe:(r[4]||'').trim(), tipo:(r[5]||'').trim(), estado:estado,
      presente: estado.indexOf('Presente')===0,
      seCobra: (r[7]||'').trim().toLowerCase().indexOf('s')===0
    });
  }
}

function guardarColumnas(v){
  v=v||{}; noProfe={};
  Object.keys(v).forEach(function(k){
    if(v[k] && v[k].noEsProfe) noProfe[String(k).trim().toUpperCase()]=true;
  });
}
function guardarNombresProfes(lista){
  lista=lista||[]; profesores={};
  var arr=Array.isArray(lista)?lista:Object.keys(lista).map(function(k){ return lista[k]; });
  arr.forEach(function(p){ if(p&&p.dim) profesores[String(p.dim).trim().toUpperCase()]=p.nombre||p.dim; });
}
function esColumnaSinProfe(dim){ return !!noProfe[String(dim||'').trim().toUpperCase()]; }
function nombreProfe(dim){ return profesores[String(dim||'').trim().toUpperCase()] || dim; }
function claveTipo(t){ return String(t||'(sin tipo)').trim().replace(/[.#$/\[\]]/g,'_')||'(sin tipo)'; }
function aporteDe(tipo){ var t=tipos[claveTipo(tipo)]; return t&&t.aporte?+t.aporte:0; }
function esAyudante(h){
  return String(h&&h.tipo||'').toUpperCase()==='AYUDA' ||
         String(h&&h.alumno||'').toUpperCase()==='AYUDANTE';
}

var DECORATIVOS=/almuerzo|\blibre\b|pretemporada|no\s*hay\s*cancha|nohaycancha|\bferiado\b|\bvacaciones\b|cancelad|suspendid|\bentrenamiento\b/i;
function esBloqueAR(nombre){ return /alto\s*rendimiento|alto\s*r\b/i.test(String(nombre==null?'':nombre).trim()); }
function esBloque(nombre){ var crudo=String(nombre==null?'':nombre).trim(); if(esBloqueAR(crudo)||DECORATIVOS.test(crudo)) return true; var letras=crudo.replace(/[^a-z0-9]/gi,''); if(!letras) return true; return letras.length<=2; }
function esCoach(h){ return String(h&&h.tipo||'').trim().toUpperCase()==='COACH'; }
/* La misma cuenta que la Caja. Si cambia una, hay que cambiar la otra. */
function calcularPozo(filas){
  var horas={};
  filas.forEach(function(h){
    var k=h.fecha+'|'+h.hora;
    if(!horas[k]) horas[k]={fecha:h.fecha, hora:h.hora, total:0, profes:{}, presentes:0, sinTipo:0};
    var b=horas[k];
    if(esColumnaSinProfe(h.profe)) return;
    if(esAyudante(h)){ if(h.profe) b.profes[h.profe]=true; return; }
    if(esBloqueAR(h.alumno)){ if(h.profe) b.profes[h.profe]=true; return; }
    if(esBloque(h.alumno)) return;
    if(esCoach(h)) return;
    if(h.profe) b.profes[h.profe]=true;
    if(h.presente) b.presentes++;
    if(h.seCobra){
      var ap=aporteDe(h.tipo);
      if(!ap) b.sinTipo++;
      b.total+=ap;
    }
  });
  var porProfe={}, total=0, sinTipo=0;
  Object.keys(horas).forEach(function(k){
    var b=horas[k], ps=Object.keys(b.profes);
    sinTipo+=b.sinTipo;
    if(!ps.length||!b.total) return;
    b.parte=b.total/ps.length;
    total+=b.total;
    ps.forEach(function(p){
      if(!porProfe[p]) porProfe[p]={profe:p, monto:0, horas:0, alumnos:0};
      porProfe[p].monto+=b.parte;
      porProfe[p].horas++;
    });
  });
  filas.forEach(function(h){
    if(esColumnaSinProfe(h.profe)||esAyudante(h)) return;
    if(esBloqueAR(h.alumno)||esBloque(h.alumno)||esCoach(h)) return;
    if(h.profe && porProfe[h.profe] && h.presente) porProfe[h.profe].alumnos++;
  });
  return { horas:horas, porProfe:porProfe, total:total, sinTipo:sinTipo };
}

/* ---------- El rango de fechas ---------- */
function lunesDe(d){
  var x=new Date(d+'T00:00:00');
  var dia=x.getDay(), resta=(dia===0?6:dia-1);
  x.setDate(x.getDate()-resta);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
function calcularRango(){
  var hoy=hoyISO();
  if(rango==='hoy')     return { d:hoy, h:hoy, txt:'hoy' };
  if(rango==='semana')  return { d:lunesDe(hoy), h:hoy, txt:'esta semana' };
  if(rango==='mes')     return { d:hoy.slice(0,8)+'01', h:hoy, txt:MESES[+hoy.slice(5,7)-1] };
  if(rango==='mespas'){
    var y=+hoy.slice(0,4), m=+hoy.slice(5,7)-1;
    if(m===0){ m=12; y--; }
    var mm=String(m).padStart(2,'0');
    var ult=new Date(y, m, 0).getDate();
    return { d:y+'-'+mm+'-01', h:y+'-'+mm+'-'+ult, txt:MESES[m-1]+' '+y };
  }
  if(rango==='libre')   return { d:desde, h:hasta, txt:'del '+fechaCorta(desde)+' al '+fechaCorta(hasta) };
  return { d:'0000-01-01', h:'9999-12-31', txt:'todo el historial' };
}
function filasDelRango(){
  var r=calcularRango();
  return historial.filter(function(h){ return h.fecha>=r.d && h.fecha<=r.h; });
}

/* ---------- Pintar ---------- */
function pintar(){
  var r=calcularRango();
  var filas=filasDelRango();
  var pozo=calcularPozo(filas);
  var lista=Object.keys(pozo.porProfe).map(function(k){ return pozo.porProfe[k]; })
    .sort(function(a,b){ return b.monto-a.monto; });

  var dias={}; filas.forEach(function(f){ dias[f.fecha]=true; });
  var loMio=miDim && pozo.porProfe[miDim] ? pozo.porProfe[miDim].monto : 0;

  var html='<div class="cifras">'+
    (miDim?'<div class="cifra plata"><b>'+gs(loMio)+'</b><span>lo tuyo · '+esc(r.txt)+'</span></div>':'')+
    '<div class="cifra"><b>'+gs(pozo.total)+'</b><span>total del período</span></div>'+
    '<div class="cifra"><b>'+gs(lista.length)+'</b><span>profesores</span></div>'+
    '<div class="cifra"><b>'+gs(Object.keys(dias).length)+'</b><span>días con clases</span></div>'+
  '</div>';

  if(pozo.sinTipo) html+='<div class="aviso"><b>'+gs(pozo.sinTipo)+' clases</b> tienen un tipo de clase '+
    'sin aporte cargado y todavía no suman. El total real va a ser mayor.</div>';

  html+='<div class="caja"><h3>Cuánto lleva cada uno · '+esc(r.txt)+'</h3>';
  if(!lista.length){
    html+='<div class="vacio">No hay clases cerradas en este período.</div>';
  } else {
    html+='<table><thead><tr><th>Profesor</th><th class="num">Horas</th>'+
      '<th class="num">Alumnos</th><th class="num">A cobrar</th><th></th></tr></thead><tbody>';
    lista.forEach(function(p){
      var esMio = miDim && p.profe===miDim;
      html+='<tr class="click'+(esMio?' yo':'')+'" data-p="'+esc(p.profe)+'">'+
        '<td><b>'+esc(p.profe)+'</b> <span style="color:var(--suave);font-weight:400">'+
          esc(nombreProfe(p.profe))+'</span>'+(esMio?'<span class="pin">vos</span>':'')+'</td>'+
        '<td class="num">'+gs(p.horas)+'</td>'+
        '<td class="num">'+gs(p.alumnos)+'</td>'+
        '<td class="num"><b>'+gs(p.monto)+'</b></td>'+
        '<td class="num"><button class="chico">Detalle</button></td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='<div class="pie">La bolsa de cada hora se arma con los alumnos presentes de las tres sedes '+
    'y se reparte en partes iguales entre los profes que tenían clase esa hora. '+
    'Se actualiza solo cuando se cierra un día.</div></div>';

  $('pantalla').innerHTML=html;
  document.querySelectorAll('tr.click').forEach(function(tr){
    tr.onclick=function(){ abrirDetalle(tr.dataset.p, pozo, r); };
  });
  $('sub').textContent = historial.length
    ? gs(historial.length)+' clases en el historial · se actualiza solo'
    : 'todavía sin clases cerradas';
}

function abrirDetalle(profe, pozo, r){
  var hs=Object.keys(pozo.horas).map(function(k){ return pozo.horas[k]; })
    .filter(function(b){ return b.profes[profe] && b.total; })
    .sort(function(a,b){ return (a.fecha+a.hora)<(b.fecha+b.hora)?-1:1; });
  var tot=0; hs.forEach(function(b){ tot+=b.parte; });

  var porDia={};
  hs.forEach(function(b){ porDia[b.fecha]=(porDia[b.fecha]||0)+b.parte; });

  var h='<div class="f-cab"><h2>'+esc(profe)+' · '+esc(nombreProfe(profe))+'</h2>'+
        '<button id="fCerrar">✕</button></div><div class="f-cuerpo">'+
        '<div class="cifras"><div class="cifra plata"><b>'+gs(tot)+'</b><span>'+esc(r.txt)+'</span></div>'+
        '<div class="cifra"><b>'+gs(hs.length)+'</b><span>horas trabajadas</span></div></div>';

  h+='<div class="caja"><h3>Por día</h3><table><thead><tr><th>Día</th><th class="num">A cobrar</th></tr></thead><tbody>';
  Object.keys(porDia).sort().forEach(function(f){
    h+='<tr><td>'+esc(fechaCorta(f))+'</td><td class="num">'+gs(porDia[f])+'</td></tr>';
  });
  h+='</tbody></table></div>';

  h+='<div class="caja"><h3>Hora por hora</h3><table><thead><tr><th>Día</th><th>Hora</th>'+
     '<th class="num">Bolsa</th><th class="num">Profes</th><th class="num">Le toca</th></tr></thead><tbody>';
  hs.forEach(function(b){
    h+='<tr><td>'+esc(fechaCorta(b.fecha))+'</td><td>'+esc(b.hora)+'</td>'+
       '<td class="num">'+gs(b.total)+'</td><td class="num">'+Object.keys(b.profes).length+'</td>'+
       '<td class="num">'+gs(b.parte)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  $('ficha').innerHTML=h;
  $('ov').classList.add('show');
  document.body.style.overflow='hidden';
  $('fCerrar').onclick=cerrar;
  try{ history.pushState({f:1},''); }catch(e){}
}
function cerrar(){ $('ov').classList.remove('show'); document.body.style.overflow=''; }
$('ov').onclick=function(e){ if(e.target===$('ov')) cerrar(); };
window.addEventListener('popstate', function(){ if($('ov').classList.contains('show')) cerrar(); });

/* ---------- Controles ---------- */
document.querySelectorAll('#rangos button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#rangos button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); rango=b.dataset.r; pintar();
  };
});
$('btnAplicar').onclick=function(){
  var d=$('fDesde').value, h=$('fHasta').value;
  if(!d || !h){ alert('Elegí las dos fechas.'); return; }
  if(d>h){ var t=d; d=h; h=t; }
  desde=d; hasta=h; rango='libre';
  document.querySelectorAll('#rangos button').forEach(function(x){ x.classList.remove('on'); });
  pintar();
};

/* ---------- Entrada ---------- */
$('btnEntrar').onclick=function(){
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch(function(e){ $('errLogin').textContent=e.message; });
};
$('btnSalir').onclick=function(e){ e.preventDefault(); firebase.auth().signOut(); };
$('btnSalir2').onclick=function(){ firebase.auth().signOut(); };

/* Todo lo que lee Firebase corre después del login. */
firebase.auth().onAuthStateChanged(function(u){
  if(!u){ $('login').style.display='flex'; $('nopuede').style.display='none'; $('app').style.display='none'; return; }
  miCorreo=u.email.toLowerCase();
  firebase.database().ref('usuarios/'+aClave(miCorreo)).once('value').then(function(s){
    var f=s.val()||{}, p=f.permisos||{};
    /* Permiso propio `ganancias`, que se da desde el panel de Accesos.
       Todos los que lo tienen ven lo de todos: no es un secreto entre profes. */
    var puede = p.admin===true || p.ganancias==='leer' || p.ganancias==='escribir';
    if(f.activo!==true || !puede){
      $('login').style.display='none';
      $('nopuedeTxt').textContent=miCorreo+'\n\nNo tenés el permiso de Ganancias.\nPedíselo a José desde el panel de Accesos.';
      $('nopuede').style.display='flex';
      return;
    }
    miNombre=f.nombre||'';
    $('login').style.display='none'; $('nopuede').style.display='none';
    $('app').style.display='block';
    $('yoMail').textContent=miCorreo;
    var hoy=hoyISO();
    $('fHasta').value=hoy; $('fDesde').value=lunesDe(hoy);

    var db=firebase.database();
    /* En vivo: cuando se cierra un día o cambia un aporte, la pantalla se
       actualiza sola sin recargar. */
    db.ref('historial_v1').on('value', function(s){
      parsearHistorial(s.val()); $('cargando').style.display='none'; pintar();
    }, function(e){ console.warn('historial_v1:', e.message); $('cargando').textContent='No pude leer el historial.'; });

    db.ref('tipos_v1').on('value', function(s){ tipos=s.val()||{}; pintar(); },
      function(e){ console.warn('tipos_v1:', e.message); });

    db.ref('columnas_v1').on('value', function(s){
      guardarColumnas(s.val()); pintar();
    }, function(e){ console.warn('columnas_v1:', e.message); });

    db.ref('calendario_v2/profesores').on('value', function(s){
      guardarNombresProfes(s.val());
      /* Se busca cuál columna es la del que está mirando, para resaltarla. */
      var mio=normNom(miNombre);
      if(mio) Object.keys(profesores).forEach(function(d){
        if(normNom(profesores[d])===mio) miDim=d;
      });
      pintar();
    }, function(e){ console.warn('profesores:', e.message); });
  }).catch(function(e){
    $('login').style.display='none';
    $('nopuedeTxt').textContent='No se pudo verificar tu acceso. '+e.message;
    $('nopuede').style.display='flex';
  });
});
</script>
</body>
</html>
